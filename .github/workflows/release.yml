name: Release

# A tag, and nothing else, is what *publishes*. The archive a person downloads has
# to be traceable to one commit that somebody named, which a workflow that also
# ran on every push could not promise.
#
# A manual run is the same job with nothing at the end of it. Several of these
# steps exist nowhere else, so before this trigger the only way to find out
# whether the workflow still worked was to tag a release and watch — which is how
# it stayed broken across three tags. A manual run builds, gates, packs and
# starts the executable exactly as a tag does, and drafts nothing: the draft step
# asks for a tag ref, not for an event name.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >
          The tag this rehearsal is for, e.g. v0.2.0-preview. Given, it is
          checked against the manifest exactly as a real tag is, which is how a
          tag that would be refused is found out about before it is pushed. Left
          empty, nothing is claimed and what is built is the branch as it stands.
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  archive:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      # The one thing this job may do beyond reading: file the draft release.
      contents: write
    steps:
      # A clean checkout, and no build cache anywhere in this job. What is being
      # produced is the artefact people will run; a cache is a set of files from
      # another run that nothing here verifies.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `.github/actions/toolchain`, the same one every CI job uses, and that is
      # the point: this file installed the compiler its own way, that way stopped
      # working, and nothing said so until a tag was pushed. `cache: false` is
      # the one difference and it is the paragraph above.
      - uses: ./.github/actions/toolchain
        with:
          cache: false

      # **The tag and the manifest are one claim or this stops here.** `v0.1.0`
      # over a tree that says `0.1.1` would produce an archive whose name, whose
      # `folio.exe --version` and whose Properties page disagree — and the first
      # two are the only ones most people ever read.
      #
      # **`-preview` is a release channel and not a different claim.** Every
      # release so far has been tagged `v<version>-preview` over a manifest that
      # says `<version>`: `v0.1.0-preview` over `0.1.0`, `v0.1.1-preview` over
      # `0.1.1`. The suffix says who the build is for, not what it is — the
      # archive is still `folio-<version>-windows-x64.zip` and the executable
      # still answers `<version>`, so the tag and the manifest still say the one
      # thing. Both spellings are accepted and nothing else is; a tag naming a
      # version the tree does not carry is still where this stops.
      #
      # What is being claimed comes from the ref when a tag was pushed, and from
      # the input when a person started the run by hand. A manual run with the
      # input left empty claims nothing, and the version is simply read out of
      # the manifest so the rest of the job has one; nothing downstream drafts a
      # release, so there is no claim for it to be wrong about.
      - name: the tag names the version in the manifest
        shell: pwsh
        env:
          CLAIMED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
        run: |
          $manifest = Get-Content -LiteralPath Cargo.toml -Raw
          if ($manifest -notmatch '(?ms)^\[workspace\.package\](.*?)^\[') {
            throw "Cargo.toml has no [workspace.package] table"
          }
          if ($Matches[1] -notmatch '(?m)^\s*version\s*=\s*"([^"]+)"') {
            throw "[workspace.package] declares no version"
          }
          $version = $Matches[1]
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $tag = $env:CLAIMED_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Host "no tag is claimed: this is a rehearsal of $version from ${{ github.ref_name }}, and it will draft nothing"
          } else {
            $accepted = @("v$version", "v$version-preview")
            if ($accepted -notcontains $tag) {
              throw "the tag is $tag and the workspace version is $version; the tag has to be $($accepted -join ' or ')"
            }
            Write-Host "building $tag"
          }

      - name: build
        run: cargo build --release --locked

      # **The licensing gates, run here rather than assumed.** `ci.yml` runs the
      # same two on every push, and that is not the same statement: a tag can be
      # pushed at a commit whose CI never finished, or finished on a different
      # tree. The archive is what people receive, so the file it carries —
      # `THIRD-PARTY-NOTICES.md` — is checked against the lock file in the job
      # that builds the archive, before anything is packed.
      #
      # `check-vendor-notices.ps1` diffs `vendor/alacritty_terminal` against the
      # crates.io archive of the same version, so the registry sources have to be
      # unpacked. The build above already did that; it is named anyway, because a
      # step that only works because of what an earlier step happened to leave
      # behind breaks the day the steps are reordered.
      - name: fetch the sources the notices gates read
        run: cargo fetch --locked

      # Pinned, and not `--locked` alone: `check-notices.ps1` regenerates the
      # notices file and compares bytes, so the generator has to be the same
      # generator that produced the checked-in one. A newer cargo-about that
      # renders one heading differently would read as licence drift.
      - name: cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      # Each gate in its own process, exactly as `ci.yml` runs them. Dot-sourcing
      # a script and then reading `$LASTEXITCODE` reads whatever the last native
      # command in it happened to set — or nothing at all, if it ran none. `-File`
      # gives one exit code that means one thing.
      - name: the notices in the archive match the tree they came from
        shell: pwsh
        run: |
          foreach ($gate in @("scripts/check-notices.ps1", "scripts/check-vendor-notices.ps1")) {
            Write-Host "== $gate"
            pwsh -NoLogo -NoProfile -File $gate
            if ($LASTEXITCODE -ne 0) { throw "$gate failed with exit $LASTEXITCODE" }
          }

      # Before the archive, so that `SHA256SUMS.txt` — written last, over
      # everything in the output directory — covers it.
      - name: bill of materials
        shell: pwsh
        run: ./scripts/release/sbom.ps1

      - name: archive
        shell: pwsh
        run: ./scripts/release/package.ps1

      # The same run of the same script CI runs, against the release binary this
      # job just built. An archive that has never been started is an archive
      # nobody has tested.
      - name: install WARP
        shell: pwsh
        run: ./ci/install-warp.ps1 -TargetDir target/release

      - name: start what was built
        shell: pwsh
        run: ./scripts/release/smoke.ps1 -Exe target/release/folio.exe -Artifacts target/smoke -TimeoutSeconds 300

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: folio-${{ env.VERSION }}
          path: target/release-package
          if-no-files-found: error

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-smoke
          path: target/smoke
          if-no-files-found: warn

      # A draft, never a publish. Somebody reads the notes, checks the archive
      # and presses the button; a release that appears without a person in the
      # loop is a release nobody has looked at.
      #
      # `gh` and not a third-party action: it is on the image, it takes the
      # job's own token, and it is one fewer piece of code with write access to
      # this repository's releases.
      # `github.ref_type`, not the event name: what decides whether anything is
      # published is whether this run is *of a tag*. A manual run has no tag to
      # publish under and never reaches this step, however it was started.
      - name: draft the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath target/release-package -File |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          if ($assets.Count -eq 0) { throw "there is nothing to publish" }
          $assets | Write-Host
          # Built as one list and splatted through the call operator rather than
          # written out on a line: `gh` is a native command, and an assets array
          # interpolated into one takes its own view of quoting the day a path
          # has a space in it.
          $arguments = @('release', 'create', '${{ github.ref_name }}') + $assets + @(
            '--draft',
            '--title', 'Folio ${{ env.VERSION }}',
            '--notes', 'Windows x64 preview. SHA256SUMS.txt lists every asset, and folio.exe carries the same version in its own resources.'
          )
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create exited $LASTEXITCODE" }
