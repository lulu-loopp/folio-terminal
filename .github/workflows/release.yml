name: Release

# A tag, and nothing else, is what this runs *for*. The archive a person
# downloads has to be traceable to one commit that somebody named, which a
# workflow that also ran on every push could not promise.
#
# **Nothing either job here produces is ever attached to a release, on a tag or
# otherwise.** It used to be: on a tag this workflow drafted the release and
# uploaded what it had just built into it — unsigned files, under exactly the
# names the signed ones carry. On 0.2.1 that draft was one button away from being
# published as the real thing, and the only thing between it and a stranger
# downloading an unsigned build was that somebody remembered. A release is signed
# on the one machine that can sign, so that machine is the only place a release
# is made from; `docs/RELEASING.md` is the whole of that procedure. What leaves
# here is a workflow artifact, which nobody can mistake for a download and which
# is what the signed build is checked against.
#
# So both ways in do the same thing. Several of these steps exist nowhere else,
# so before the manual trigger the only way to find out whether the workflow
# still worked was to tag a release and watch — which is how it stayed broken
# across three tags. A manual run builds, gates, packs and starts the executable
# exactly as a tag does.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >
          The tag this rehearsal is for, e.g. v0.2.0-preview. Given, it is
          checked against the manifest exactly as a real tag is, which is how a
          tag that would be refused is found out about before it is pushed. Left
          empty, nothing is claimed and what is built is the branch as it stands.
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  archive:
    runs-on: windows-2025
    timeout-minutes: 90
    # No `contents: write` anywhere in this file. This job files nothing, uploads
    # nothing to a release and has no token that could; the only write it is
    # capable of is the workflow artifact at the end, which needs no permission
    # beyond the run's own. A workflow that cannot publish cannot publish the
    # wrong thing.
    steps:
      # A clean checkout, and no build cache anywhere in this job. What is being
      # produced is the artefact people will run; a cache is a set of files from
      # another run that nothing here verifies.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `.github/actions/toolchain`, the same one every CI job uses, and that is
      # the point: this file installed the compiler its own way, that way stopped
      # working, and nothing said so until a tag was pushed. `cache: false` is
      # the one difference and it is the paragraph above.
      - uses: ./.github/actions/toolchain
        with:
          cache: false

      # The manifest's version, and the tag checked against it. The whole of
      # that rule is `.github/actions/claimed-version`, which the macOS job
      # below comes through too — one reading of one line, so that the two
      # jobs' artefacts cannot come out of a tag they disagree about.
      - uses: ./.github/actions/claimed-version

      # **Before the build, because that is the only thing this step buys.**
      # `package.ps1` packs `folio.msix` with `makeappx.exe`, which comes out of
      # the Windows SDK on the runner image rather than out of this repository.
      # An image that stopped carrying it would otherwise be found out at the
      # `archive` step, after a ten-minute release build and a `cargo install` —
      # so the question is asked first, and it is asked of the same
      # `Find-MakeAppx` the pack itself calls rather than of a second copy of
      # the search written into this file.
      - name: the runner's Windows SDK has makeappx
        shell: pwsh
        run: ./scripts/release/package.ps1 -ToolsOnly

      - name: build
        run: cargo build --release --locked

      # **The licensing gates, run here rather than assumed.** `ci.yml` runs the
      # same two on every push, and that is not the same statement: a tag can be
      # pushed at a commit whose CI never finished, or finished on a different
      # tree. The archive is what people receive, so the file it carries —
      # `THIRD-PARTY-NOTICES.md` — is checked against the lock file in the job
      # that builds the archive, before anything is packed.
      #
      # `check-vendor-notices.ps1` diffs `vendor/alacritty_terminal` against the
      # crates.io archive of the same version, so the registry sources have to be
      # unpacked. The build above already did that; it is named anyway, because a
      # step that only works because of what an earlier step happened to leave
      # behind breaks the day the steps are reordered.
      - name: fetch the sources the notices gates read
        run: cargo fetch --locked

      # Pinned, and not `--locked` alone: `check-notices.ps1` regenerates the
      # notices file and compares bytes, so the generator has to be the same
      # generator that produced the checked-in one. A newer cargo-about that
      # renders one heading differently would read as licence drift.
      - name: cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      # Each gate in its own process, exactly as `ci.yml` runs them. Dot-sourcing
      # a script and then reading `$LASTEXITCODE` reads whatever the last native
      # command in it happened to set — or nothing at all, if it ran none. `-File`
      # gives one exit code that means one thing.
      - name: the notices in the archive match the tree they came from
        shell: pwsh
        run: |
          foreach ($gate in @("scripts/check-notices.ps1", "scripts/check-vendor-notices.ps1")) {
            Write-Host "== $gate"
            pwsh -NoLogo -NoProfile -File $gate
            if ($LASTEXITCODE -ne 0) { throw "$gate failed with exit $LASTEXITCODE" }
          }

      # Before the archive, so that `SHA256SUMS.txt` — written last, over
      # everything in the output directory — covers it.
      - name: bill of materials
        shell: pwsh
        run: ./scripts/release/sbom.ps1

      - name: archive
        shell: pwsh
        run: ./scripts/release/package.ps1

      # The same run of the same script CI runs, against the release binary this
      # job just built. An archive that has never been started is an archive
      # nobody has tested.
      - name: install WARP
        shell: pwsh
        run: ./scripts/ci/install-warp.ps1 -TargetDir target/release

      - name: start what was built
        shell: pwsh
        run: ./scripts/release/smoke.ps1 -Exe target/release/folio.exe -Artifacts target/smoke -TimeoutSeconds 300

      # **What is built here leaves as a workflow artifact and never as a release
      # asset.** A workflow artifact is a zip inside a run, downloadable by
      # whoever can already read this page; a release asset is what a stranger
      # downloads and runs. These files are unsigned and carry exactly the names
      # the signed ones carry, so where they are is the only thing that tells the
      # two apart — which is why they stay here. This copy exists to be compared
      # against the signed build made on the signing machine: the same file list,
      # the same notices, the same version, from the same commit.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: folio-${{ env.VERSION }}
          path: target/release-package
          if-no-files-found: error

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-smoke
          path: target/smoke
          if-no-files-found: warn

      # And that is the end of it. The release itself — the tag's page, its notes
      # and the seven signed assets on it — is made by hand from the machine that
      # signed them, with `gh release create`. `docs/RELEASING.md` has the
      # command. Nothing above this line is part of it.

  # ── the macOS lane ─────────────────────────────────────────────────────────
  #
  # The same bargain the job above makes, made for a second platform: build what
  # a person would download, put it through every step a real release goes
  # through, and leave it where nobody can mistake it for a download.
  # `docs/RELEASING.md` is still the whole of how a release is made, and it is
  # still made from the machine that holds the key.
  #
  # **It signs for real when this run has a certificate, and ad-hoc when it does
  # not, and it produces a bundle either way.** A fork has no secrets, a run
  # started from one has none, and a rehearsal on a branch may have none either;
  # a lane that could only run with a credential would be a lane nobody
  # exercises, which is the bargain `package.ps1`'s `-Sign` note already makes
  # on Windows. What tells the two apart is the name of the artifact —
  # `folio-macos-<version>-unsigned` against `folio-macos-<version>` — and the
  # Gatekeeper assertion below, which demands a *refusal* of the ad-hoc build as
  # firmly as it demands an acceptance of the notarized one.
  #
  # **`macos-14` and not `macos-15`.** `packaging/macos/README.md` fixes the
  # deployment target at macOS 14.0, and the runner whose SDK and libraries are
  # that version is the one that cannot quietly link a symbol introduced after
  # it. Both labels are arm64, which is the other half of what this job needs
  # and the only architecture this preview ships, so the choice between them is
  # entirely the deployment target's.
  #
  # The four scripts are M5-1's and this job does not restate a line of what
  # they do; `docs/RELEASING.md` ▸ macOS and `packaging/macos/README.md` are
  # where the sequence and the flags are written down, and the names of the
  # secrets below are fixed in the first of those.
  macos:
    runs-on: macos-14
    timeout-minutes: 90
    # **What the job after this one is allowed to know.** `VERSION` and
    # `FOLIO_SIGNED` are written into this job's environment while it runs, and
    # a second job can read neither: `needs.<job>.outputs` is the only wire
    # between two jobs, and only a step can put anything on it.
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
      dmg: ${{ steps.artifact.outputs.dmg }}
      signed: ${{ steps.artifact.outputs.signed }}
    # No `contents: write` here either, for the reason the top of this file
    # gives at length.
    env:
      # **The deployment target is not restated here.** It is
      # `LSMinimumSystemVersion` in `packaging/macos/Info.plist.in`, stated
      # once; a `MACOSX_DEPLOYMENT_TARGET` in this file would be a second
      # literal 14.0, agreeing with the first right up until one of them moved.
      # What this job contributes to the same claim is the runner label above.
      #
      # Where the pieces go, and the one distinction that matters among them:
      # `macos-package` is the release page's shape — every file in it is hashed
      # into `SHA256SUMS.txt` and uploaded together — and `macos-symbols` is
      # deliberately not that. It holds the `.dSYM` and the notarization logs,
      # which are kept *beside* a release and never inside it.
      FOLIO_STAGE: target/macos
      FOLIO_APP: target/macos/Folio.app
      FOLIO_PACKAGE: target/macos-package
      FOLIO_SYMBOLS: target/macos-symbols
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The same composite action every job in this repository comes through.
      # Off Windows it takes the *version* out of `rust-toolchain.toml`'s pinned
      # channel and installs it against this runner's own host triple —
      # `1.94.1-aarch64-apple-darwin` here — and exports `RUSTUP_TOOLCHAIN`, so
      # that no later cargo reads the Windows channel back out of that file.
      # `cache: false` for the reason the job above gives: what is produced here
      # is the artefact people would run.
      - uses: ./.github/actions/toolchain
        with:
          cache: false

      - uses: ./.github/actions/claimed-version

      # **Before the build, for the reason the `makeappx` probe above is before
      # the build**: this lane is four shell scripts, and a syntax error in one
      # of them would otherwise be found after a ten-minute release compile.
      # `sh -n` and not `bash -n`, because `#!/bin/sh` is what they claim to be
      # and the claim is worth checking.
      - name: the lane's own scripts parse
        run: |
          set -eu
          for script in scripts/release/macos/*.sh; do
            sh -n "$script"
            echo "parsed: $script"
          done

      # `-p bt-app` and not the workspace: the product is the one binary, and
      # the whole-workspace build above is a Windows job's reason — it also
      # builds the two `examples/` probes that name DirectComposition.
      - name: build
        run: cargo build --release --locked -p bt-app

      # `bundle.sh` assembles `Folio.app` around that binary — the plist from
      # `render-info-plist`, the icon resampled from `assets/app-icon/`,
      # `PkgInfo`, and the four documents the Windows archive also carries —
      # asks the executable it just copied in whether it is this version at this
      # commit, reads the tree back and refuses a bundle that is not exactly
      # those eight files, and runs `dsymutil` into `Folio.app.dSYM` beside it.
      # Nothing in it signs.
      - name: the bundle
        run: scripts/release/macos/bundle.sh --out "$FOLIO_STAGE"

      # **The identity this run signs with, and what a log is allowed to carry
      # about it.** The four secrets and the two variables are named in
      # `docs/RELEASING.md` ▸ macOS ▸ *The lane, and its four secrets*, which is
      # the one place they are agreed on; a secret is the one kind of
      # configuration nobody can read back, so this step spells each name once
      # and says which of them was missing rather than failing later with a
      # message about a certificate.
      #
      # Three states and no fourth. All six present: a real Developer ID
      # signature, notarized and stapled. None present: ad-hoc — `codesign`'s
      # own `-` — which is a real signature over the real bytes with nobody
      # behind it, and which Gatekeeper refuses, as this lane goes on to check.
      # Some present: this stops here, because a certificate with no notary key
      # produces a build that every Mac in the world refuses, and finding that
      # out at `spctl` ten minutes later names the wrong thing.
      #
      # The keychain is this run's own, in `RUNNER_TEMP`, unlocked with the
      # password the owner set as a secret; the login keychain is not touched,
      # and `set-key-partition-list` is what stops `codesign` waiting for a
      # permission nobody can give it on a machine with no screen. What is
      # carried forward is the certificate's SHA-1 rather than its subject: it
      # is unambiguous when a keychain holds more than one identity, and it is
      # why the team id — which the plan keeps out of this repository on purpose
      # — does not reach this log.
      - name: the signing identity, if this run was given one
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          missing=""
          present=""
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD \
            MACOS_KEYCHAIN_PASSWORD MACOS_NOTARY_KEY_P8 \
            MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            else
              present="$present $name"
            fi
          done

          if [ -z "$present" ]; then
            echo "this run was given no signing configuration: the bundle is signed ad-hoc"
            echo "FOLIO_IDENTITY=-" >> "$GITHUB_ENV"
            echo "FOLIO_SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "a half-configured signing lane signs a build every Mac refuses." >&2
            echo "set:$missing" >&2
            echo "the four secrets and the two variables are listed in docs/RELEASING.md" >&2
            exit 1
          fi

          notary="$RUNNER_TEMP/appstoreconnect"
          mkdir -p "$notary/private_keys"
          chmod 700 "$notary" "$notary/private_keys"
          printf 'KEY_ID=%s\nISSUER_ID=%s\n' \
            "$MACOS_NOTARY_KEY_ID" "$MACOS_NOTARY_ISSUER_ID" > "$notary/folio-notary.env"
          printf '%s' "$MACOS_NOTARY_KEY_P8" | base64 --decode \
            > "$notary/private_keys/AuthKey_$MACOS_NOTARY_KEY_ID.p8"
          chmod 600 "$notary/private_keys/AuthKey_$MACOS_NOTARY_KEY_ID.p8"

          keychain="$RUNNER_TEMP/folio-release.keychain-db"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          # Locked again after five minutes idle, so a job that dies between
          # here and the cleanup step leaves a locked keychain behind it.
          security set-keychain-settings -lut 300 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          certificate="$RUNNER_TEMP/folio-signing.p12"
          umask 077
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          # On the search list and in front of what was there: `codesign` looks
          # through the search list rather than at a path.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "the .p12 imported and brought no Developer ID Application identity with it." >&2
            echo "an export taken from Certificates rather than My Certificates has no private key." >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "signing with $identity"
          echo "FOLIO_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "FOLIO_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "FOLIO_NOTARY_DIR=$notary" >> "$GITHUB_ENV"
          echo "FOLIO_SIGNED=true" >> "$GITHUB_ENV"

      # Hardened runtime, secure time stamp, the entitlements, the inside-out
      # order — all of it is `sign.sh`'s, which is what M5-1 exists to get right
      # and what this lane deliberately does not restate.
      #
      # **`--no-spctl`, and the reason is the order of a release rather than a
      # weakened check.** A Developer ID signature that has not been notarized
      # yet is refused by Gatekeeper — `source=Unnotarized Developer ID` — and
      # `sign.sh` treats that refusal as its own failure, correctly, because
      # from inside that script there is nothing left to try. Here there is:
      # notarization is the next step. So the Gatekeeper question is asked once,
      # at the end, of the artefact in the state it is actually shipped in.
      - name: sign
        run: scripts/release/macos/sign.sh --app "$FOLIO_APP" --identity "$FOLIO_IDENTITY" --no-spctl

      # The application's own submission. The image gets its own, from inside
      # `dmg.sh`, because a stapled image holding an unstapled application is a
      # download that works until the reader is offline.
      #
      # The log goes straight to the kept directory rather than beside the
      # bundle: it is the only record of what the notary service actually looked
      # at, and it is nobody's download.
      - name: notarize and staple the application
        if: env.FOLIO_SIGNED == 'true'
        run: |
          set -eu
          mkdir -p "$FOLIO_SYMBOLS"
          scripts/release/macos/notarize.sh --path "$FOLIO_APP" \
            --notary-dir "$FOLIO_NOTARY_DIR" \
            --log "$FOLIO_SYMBOLS/Folio.app.notarylog.json"

      # `dmg.sh` stages the stapled application beside a link to `/Applications`,
      # writes the compressed read-only image, signs it, and — unless there is
      # nothing to notarize with — notarizes and staples that too, then asks
      # Gatekeeper the question a download actually gets.
      #
      # It writes `Folio.dmg`, deliberately: a script that built the long name
      # would be a second reader of the version line. **The rename is this
      # lane's**, and it is where the version and the architecture join the name
      # — the tag and the asset are one claim, and an Intel Mac has to be able
      # to tell from the name that this build is not for it.
      #
      # It writes a second file as well, `Folio-macos-arm64.dmg`: the same bytes
      # under a name that is the same in every release. That one is moved across
      # under the name it already has, because `/releases/latest/download/`
      # resolves an asset by name and a link on a page outside this repository
      # can only be written against a name no version moves.
      - name: the disk image
        run: |
          set -eu
          mkdir -p "$FOLIO_PACKAGE"
          if [ "${FOLIO_SIGNED:-false}" = "true" ]; then
            scripts/release/macos/dmg.sh --app "$FOLIO_APP" --out "$FOLIO_STAGE" \
              --identity "$FOLIO_IDENTITY" --notary-dir "$FOLIO_NOTARY_DIR"
          else
            scripts/release/macos/dmg.sh --app "$FOLIO_APP" --out "$FOLIO_STAGE" \
              --identity "$FOLIO_IDENTITY" --skip-notarize
          fi
          mv "$FOLIO_STAGE/Folio.dmg" "$FOLIO_PACKAGE/Folio-$VERSION-macos-arm64.dmg"
          mv "$FOLIO_STAGE/Folio-macos-arm64.dmg" "$FOLIO_PACKAGE/Folio-macos-arm64.dmg"
          if [ -f "$FOLIO_STAGE/Folio.dmg.notarylog.json" ]; then
            mv "$FOLIO_STAGE/Folio.dmg.notarylog.json" "$FOLIO_SYMBOLS/Folio.dmg.notarylog.json"
          fi
          ls -l "$FOLIO_PACKAGE"

      # **The `.dSYM`, which exists only on the machine that linked the binary.**
      # On Apple targets the release profile's line-tables-only debug
      # information stays in the object files and the linked image carries a
      # debug map pointing at them, so nothing beside `folio` can turn a crash
      # report from a shipped build back into file names and line numbers until
      # `dsymutil` has walked that map — which `bundle.sh` did. It pairs with
      # the image by UUID, it is kept beside the notarization logs, and it goes
      # nowhere near the disk image: several times the download, signed for no
      # reason, and a release lane that does not keep it throws the evidence
      # away at the moment it is made.
      - name: the debug symbols
        run: |
          set -eu
          mkdir -p "$FOLIO_SYMBOLS"
          dwarfdump --uuid "$FOLIO_APP/Contents/MacOS/folio"
          dwarfdump --uuid "$FOLIO_STAGE/Folio.app.dSYM"
          rm -rf "$FOLIO_SYMBOLS/Folio.app.dSYM"
          mv "$FOLIO_STAGE/Folio.app.dSYM" "$FOLIO_SYMBOLS/Folio.app.dSYM"

      # **An ad-hoc run's bundle leaves under a name that says what it is.** The
      # disk image keeps the name a signed one would carry, for the reason the
      # top of this file gives — where a file is, is what tells it from the real
      # thing — but a `.app` anybody could have made is worth naming outright,
      # and it is the artefact a fork or a rehearsal is actually after.
      - name: the unsigned bundle, under a name that says so
        if: env.FOLIO_SIGNED != 'true'
        run: ditto -c -k --sequesterRsrc --keepParent "$FOLIO_APP" "$FOLIO_PACKAGE/Folio-unsigned.app.zip"

      # The same bill of materials the Windows archive carries, for the crates
      # *this* build is made of. `--filter-platform` is what makes it a bill for
      # the thing shipped, so this lane passes its own triple: a macOS build
      # that listed `windows-sys` would be describing a build that does not
      # exist. `pwsh` is on the GitHub macOS image, and the script is the same
      # file the Windows job runs — it reads `cargo metadata` and nothing else.
      - name: bill of materials
        run: >
          pwsh -NoLogo -NoProfile -File scripts/release/sbom.ps1
          -Target aarch64-apple-darwin
          -Output "$FOLIO_PACKAGE/folio-$VERSION-macos-arm64.cdx.json"

      # Every asset this lane produces, in the format `sha256sum -c` reads and
      # in the shape `package.ps1` writes: lower-case hex, two spaces, the bare
      # file name, LF, sorted by name, a final newline. `shasum` prints exactly
      # that line, which is why nothing here formats one by hand.
      #
      # A second file rather than a line appended to the Windows one — the two
      # lanes run on two machines and neither can see the other's output — and
      # `docs/RELEASING.md` is where the two are put on one page.
      - name: the checksums
        run: |
          set -eu
          cd "$FOLIO_PACKAGE"
          rm -f SHA256SUMS.txt
          names=$(ls -1 | LC_ALL=C sort)
          printf '%s\n' "$names" | while IFS= read -r file; do
            [ -f "$file" ] && shasum -a 256 "$file"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # **What was built, started, and asked what it is.** The Windows lane runs
      # `smoke.ps1` against the executable it just built; this asks the bundle
      # the same question, plus the two only a signature can be asked.
      #
      # `--version` is answered on stdout before any window exists — `cli::parse`
      # refuses it above `EventLoop::build` — so this is the real binary
      # starting on a runner with no screen. What it must print is the workspace
      # version and the commit this run checked out: one sentence,
      # `bt_app::version::banner`, the same one the diagnostics header and the
      # panic log carry.
      #
      # **Gatekeeper is asserted in both directions.** An ad-hoc bundle *must*
      # be refused — a lane that only looked for an acceptance would pass a run
      # that signed nothing — and a notarized one must be accepted, and accepted
      # with `source=Notarized Developer ID` rather than with any other source,
      # which is the string the plan's M5 acceptance line names. The image is
      # asked the question a download is asked, which is a different question
      # from the application's: `-t open` and the primary signature, because
      # `-t exec` on a disk image answers something nobody asks.
      - name: start what was built
        run: |
          set -eu
          exe="$FOLIO_APP/Contents/MacOS/folio"
          dmg="$FOLIO_PACKAGE/Folio-$VERSION-macos-arm64.dmg"
          line=$("$exe" --version)
          expected="Folio $VERSION ($(git rev-parse --short=10 HEAD))"
          echo "--version: $line"
          if [ "$line" != "$expected" ]; then
            echo "the bundle answers '$line'; this run built '$expected'" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$FOLIO_APP"
          codesign -dv --verbose=4 "$FOLIO_APP" 2> "$RUNNER_TEMP/codesign.txt" || true
          cat "$RUNNER_TEMP/codesign.txt"

          assessment="$RUNNER_TEMP/spctl.txt"
          set +e
          spctl -a -vvv "$FOLIO_APP" > "$assessment" 2>&1
          accepted=$?
          set -e
          cat "$assessment"

          if [ "${FOLIO_SIGNED:-false}" != "true" ]; then
            if ! grep -q "Signature=adhoc" "$RUNNER_TEMP/codesign.txt"; then
              echo "this run signed ad-hoc and the bundle does not say so" >&2
              exit 1
            fi
            if [ "$accepted" = "0" ]; then
              echo "Gatekeeper accepted an ad-hoc bundle, which cannot be right" >&2
              exit 1
            fi
            echo "ad-hoc: the signature verifies, and Gatekeeper refuses it. Both are this branch passing."
            exit 0
          fi

          if ! grep -q "Authority=Developer ID Application" "$RUNNER_TEMP/codesign.txt"; then
            echo "this run had a certificate and the bundle is not signed by a Developer ID" >&2
            exit 1
          fi
          if [ "$accepted" != "0" ]; then
            echo "a notarized bundle was refused by Gatekeeper" >&2
            exit 1
          fi
          if ! grep -q "source=Notarized Developer ID" "$assessment"; then
            echo "accepted, but not as a notarized Developer ID build, which is a different claim" >&2
            exit 1
          fi
          spctl -a -vvv -t open --context context:primary-signature "$dmg"
          xcrun stapler validate "$FOLIO_APP"
          xcrun stapler validate "$dmg"
          echo "signed, notarized, stapled, and accepted — both the application and the image."

      # **The keychain and the key go, whatever happened above.** They are the
      # owner's, and a runner is a machine this job does not own.
      - name: the credentials this job made go
        if: always()
        run: |
          set -u
          rm -rf "$RUNNER_TEMP/appstoreconnect"
          rm -f "$RUNNER_TEMP/folio-signing.p12"
          if [ -n "${FOLIO_KEYCHAIN:-}" ] && [ -f "${FOLIO_KEYCHAIN}" ]; then
            remaining=$(security list-keychains -d user | tr -d '" ' | grep -v -F "$FOLIO_KEYCHAIN" || true)
            if [ -n "$remaining" ]; then
              security list-keychains -d user -s $remaining
            fi
            security delete-keychain "$FOLIO_KEYCHAIN"
            echo "deleted $FOLIO_KEYCHAIN"
          else
            echo "this run made no keychain"
          fi

      # The same three facts the two uploads below are spelled out of, said
      # once where a later job can read them. The name is built here rather than
      # in `macos-artifact`'s `with:` because the rule that puts `-unsigned` on
      # the end of one of them is this job's, and a second reader of it would be
      # a second place for it to be wrong.
      - id: artifact
        run: |
          set -eu
          signed="${FOLIO_SIGNED:-false}"
          if [ "$signed" = "true" ]; then
            name="folio-macos-$VERSION"
          else
            name="folio-macos-$VERSION-unsigned"
          fi
          {
            echo "name=$name"
            echo "dmg=Folio-$VERSION-macos-arm64.dmg"
            echo "signed=$signed"
          } >> "$GITHUB_OUTPUT"

      # Two names, because which of the two this is, is the first thing a person
      # downloading it needs to know.
      - if: env.FOLIO_SIGNED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: folio-macos-${{ env.VERSION }}
          path: target/macos-package
          if-no-files-found: error

      - if: env.FOLIO_SIGNED != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: folio-macos-${{ env.VERSION }}-unsigned
          path: target/macos-package
          if-no-files-found: error

      # The `.dSYM` and the two notarization logs, kept and kept apart: the
      # files that are archived beside a release and never inside it.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: folio-macos-${{ env.VERSION }}-symbols
          path: target/macos-symbols
          if-no-files-found: warn

  # **The bytes a stranger receives, asked the questions on a machine that did
  # not make them.** The job above verifies a directory on the machine that
  # built it, minutes after building it, with the signing keychain still on the
  # search list and the notary service's answer still warm. That is the right
  # check and it is not the same check as this one. This job takes the artifact
  # back out of the store the release is assembled from, on a runner that did
  # not build it, and puts the questions to *those* bytes: the checksum file the
  # release page publishes, the assessment a downloaded image gets, the
  # application inside the image, and the ticket in both.
  #
  # It is also M6-2's clean-*machine* half. A runner is genuinely one — no trust
  # history, no development install, nothing of ours on it — and it is genuinely
  # not ours. What it cannot be is a person: there is no screen, and
  # `download-artifact` restores bytes rather than extended attributes, so the
  # quarantine attribute and every panel belong to the clean-user walk in
  # `docs/plans/port/m6-1-checklist.md`. `docs/RELEASING.md` ▸ macOS ▸
  # *Clean-machine coverage* is where the two halves are put on one page.
  #
  # `needs: macos` and nothing else: if the lane did not produce an artifact,
  # there is nothing here to ask.
  macos-artifact:
    needs: macos
    runs-on: macos-14
    timeout-minutes: 20
    env:
      FOLIO_DMG: ${{ needs.macos.outputs.dmg }}
      FOLIO_SIGNED: ${{ needs.macos.outputs.signed }}
      FOLIO_MOUNT: folio-image
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.macos.outputs.artifact }}
          path: downloaded

      # `shasum -c` and not a hash compared by eye: the file being checked here
      # is the one a reader is invited to check the download against, so the
      # thing worth proving is that it still describes the bytes after they have
      # been through the artifact store.
      - name: the checksums the release page publishes
        run: |
          set -eu
          cd downloaded
          ls -l
          shasum -a 256 -c SHA256SUMS.txt

      - name: mount the image
        run: |
          set -eu
          mount="$RUNNER_TEMP/$FOLIO_MOUNT"
          rm -rf "$mount"
          mkdir -p "$mount"
          hdiutil attach "downloaded/$FOLIO_DMG" -nobrowse -readonly -noautoopen \
            -mountpoint "$mount"
          ls -l "$mount"

      # Both directions, the same way the build job asserts them: an ad-hoc run
      # must be *refused* here too, or this job would pass a release that signed
      # nothing. `-t open` and the primary signature on the image, because that
      # is the question a download gets and `-t exec` on a disk image answers one
      # nobody asks.
      - name: what the download is asked
        run: |
          set -eu
          app="$RUNNER_TEMP/$FOLIO_MOUNT/Folio.app"
          dmg="downloaded/$FOLIO_DMG"

          codesign --verify --deep --strict --verbose=2 "$app"

          # The four documents the licences ask to travel with the binary, asked
          # of the copies that actually travelled: assembled by `bundle.sh`,
          # sealed by `sign.sh`, packed into the image, uploaded and fetched
          # back. They are inside the seal, so the line above would already have
          # refused a bundle one was taken out of — this names the file, rather
          # than leaving a reader with "a sealed resource is missing", and it
          # asks for bytes as well as for a name.
          for document in LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md TRADEMARK.md; do
            if [ ! -s "$app/Contents/Resources/$document" ]; then
              echo "the application carries no $document" >&2
              exit 1
            fi
          done

          set +e
          spctl -a -vvv -t open --context context:primary-signature "$dmg" \
            > "$RUNNER_TEMP/image.txt" 2>&1
          image=$?
          spctl -a -vvv "$app" > "$RUNNER_TEMP/app.txt" 2>&1
          bundle=$?
          set -e
          cat "$RUNNER_TEMP/image.txt" "$RUNNER_TEMP/app.txt"

          if [ "$FOLIO_SIGNED" != "true" ]; then
            if [ "$image" = "0" ] || [ "$bundle" = "0" ]; then
              echo "Gatekeeper accepted an ad-hoc build, which cannot be right" >&2
              exit 1
            fi
            echo "ad-hoc: the download verifies as a signature and is refused as a download. Both are this branch passing."
            exit 0
          fi

          if [ "$image" != "0" ] || [ "$bundle" != "0" ]; then
            echo "a notarized download was refused by Gatekeeper" >&2
            exit 1
          fi
          if ! grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/app.txt"; then
            echo "accepted, but not as a notarized Developer ID build, which is a different claim" >&2
            exit 1
          fi
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          echo "the uploaded artifact, downloaded again: accepted, notarized and stapled, image and application both."

      # Whatever happened above. A mounted image outlives the step that mounted
      # it, and a runner that ends with one attached is a runner this job left
      # untidy.
      - name: unmount
        if: always()
        run: |
          set -u
          mount="$RUNNER_TEMP/$FOLIO_MOUNT"
          if [ -d "$mount" ]; then
            hdiutil detach "$mount" -quiet || hdiutil detach "$mount" -force || true
          fi
