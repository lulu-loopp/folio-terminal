name: CI

on:
  # A bare `push:` ran this whole matrix on every push of every branch, so each
  # work-in-progress commit on a feature branch mailed the owner its own red run.
  # What is worth a full run is what the product is: `main`, the release tags,
  # and a branch as it is proposed for merging — or one the coordinator asks
  # for by name (`gh workflow run ci.yml --ref <branch>`), which is how a
  # branch is gated on these machines beside the others instead of one at a
  # time on the laptop.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A build here is a fresh one every time; incremental artefacts are pure cost
  # in a job whose target directory arrives from a cache and leaves with it.
  CARGO_INCREMENTAL: 0

# `windows-2025` and not `windows-latest`. The floating label moved from Server
# 2022 to Server 2025 during this project's life and will move again; a terminal
# emulator's CI is a statement about a Windows version, and a statement that
# silently changes what it is about is not one.
#
# Third-party actions are pinned to a commit, not a tag: a tag is a name its
# owner can repoint, and these actions run with the checkout of this repository
# in front of them.

jobs:
  release-script-tests:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Offline release build verification
        shell: pwsh
        run: ./scripts/release/ci-build-tests.ps1
      # The scoop and Homebrew hooks (0.4.6 U-2): the manifests' fields, the
      # cask's syntax, the renderer keeping the hooks, and the scoop hook run
      # against a stub folio.exe — exit 2 stops the uninstall, 1 and 0 go on.
      - name: Package-manager hooks, rendered and run against a stub
        shell: pwsh
        run: ./scripts/ci/check-manager-hooks.ps1
      # The release order (0.4.7 U-41e0): `update-manifests.ps1 -Apply` and
      # `-Revert` against a stand-in for `gh` that fails where each case says —
      # every write that landed is put back, or the run names a release incident.
      - name: Distribution manifests, applied and put back against a gh stand-in
        shell: pwsh
        run: ./scripts/release/update-manifests-tests.ps1

  # ── the gates that prove themselves ────────────────────────────────────────
  #
  # Each of these plants a violation, demands red, and puts the file back. This
  # repository has shipped a gate that could not fail, plus a comment that lied
  # about it, plus a lint table that inherited into nothing; a green run means
  # nothing until the red one has been seen.
  #
  # **Every step here ends with an explicit `exit 0`, and that is load-bearing.**
  # A canary runs a command whose *failure is the thing it is checking for*, and
  # GitHub's `pwsh` shell appends `if (Test-Path variable:\LASTEXITCODE) { exit
  # $LASTEXITCODE }` to the script it runs. Without the explicit exit, the probe's
  # refusal becomes the step's own — the lint canary proved on the first CI run
  # that clippy does reject a planted `todo!()`, and then reported that proof as
  # a red step with nothing in its log, because clippy's 101 was still sitting in
  # `$LASTEXITCODE` when the script ran out. The probe's exit code is read into a
  # variable of its own and never left where the shell will find it.
  #
  # **Every canary runs on every run; there is no path filter.** A canary's
  # subject is not only its script: the lint canary's red depends on the crate it
  # plants into (an `#![allow(clippy::todo)]` there turns it green) and the Rust
  # gates live in the crates themselves, so a filter over the scripts would skip
  # the one run that shows a gate lost its teeth. With the ignored-test canary
  # moved into `logic`, the whole job costs minutes, not a second workspace
  # build.
  gates-can-fail:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      # Whole history, for one step: `check-migration-debt.ps1` compares the
      # debt list with `git merge-base HEAD origin/main`, and at the default
      # depth of one there is no merge base to find — the check would pass by
      # having nothing to read, which is the one way a gate must not pass.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The compiler and the shared cache both come from
      # `.github/actions/toolchain`, which is the one place in this repository
      # that decides what Rust a job is built with. `release.yml` calls the same
      # action, so the two files cannot drift apart again. The wasm32 target is
      # for the wasm-floor canary below.
      - uses: ./.github/actions/toolchain
        with:
          targets: wasm32-unknown-unknown

      # A NUL makes common source searchers classify a text file as binary and
      # skip it. Plant that exact state in a tracked document and require the
      # byte-reading gate to refuse it.
      - name: the no-NUL gate can actually fail
        shell: pwsh
        run: |
          $file = "README.md"
          $original = [IO.File]::ReadAllBytes($file)
          try {
            $planted = [byte[]]::new($original.Length + 1)
            [Array]::Copy($original, $planted, $original.Length)
            $planted[$original.Length] = 0
            [IO.File]::WriteAllBytes($file, $planted)
            $failed = $false
            $message = ""
            try {
              & ./scripts/ci/check-no-nul.ps1 *> $null
            } catch {
              $failed = $true
              $message = $_.Exception.Message
            }
            if (-not $failed) { throw "the no-NUL gate accepted a planted NUL byte" }
            if ($message -notmatch [regex]::Escape($file) -or $message -notmatch 'NUL') {
              throw "the no-NUL gate failed for the wrong reason: $message"
            }
          } finally {
            [IO.File]::WriteAllBytes($file, $original)
          }
          exit 0

      # A binary exemption is a live statement about one tracked path, not a
      # permanent extension exclusion. Require both kinds of stale row to fail.
      - name: a stale binary exemption can actually fail
        shell: pwsh
        run: |
          $list = "scripts/ci/tracked-binary-files.tsv"
          $original = [IO.File]::ReadAllBytes($list)
          try {
            [IO.File]::AppendAllText($list, "planted-missing.bin`tcanary path is absent`n")
            $failed = $false
            $message = ""
            try { & ./scripts/ci/check-no-nul.ps1 *> $null } catch {
              $failed = $true
              $message = $_.Exception.Message
            }
            if (-not $failed -or $message -notmatch 'planted-missing.bin' -or $message -notmatch 'not a tracked readable file') {
              throw "the binary list did not refuse its missing row: $message"
            }

            [IO.File]::WriteAllBytes($list, $original)
            [IO.File]::AppendAllText($list, "README.md`tcanary bytes are text`n")
            $failed = $false
            $message = ""
            try { & ./scripts/ci/check-no-nul.ps1 *> $null } catch {
              $failed = $true
              $message = $_.Exception.Message
            }
            if (-not $failed -or $message -notmatch 'README.md' -or $message -notmatch 'strict UTF-8 text') {
              throw "the binary list did not refuse its now-text row: $message"
            }
          } finally {
            [IO.File]::WriteAllBytes($list, $original)
          }
          exit 0

      # An already committed conflict marker has no unmerged index entry. Plant
      # one after a first-line UTF-8 BOM and require the byte gate to name it.
      - name: the conflict-marker gate can actually fail
        shell: pwsh
        run: |
          $file = "README.md"
          $original = [IO.File]::ReadAllBytes($file)
          try {
            $body = [Text.Encoding]::UTF8.GetBytes("<<<<<<< planted`n=======`n>>>>>>> planted`n")
            $planted = [byte[]]::new(3 + $body.Length)
            [Array]::Copy([Text.Encoding]::UTF8.GetPreamble(), $planted, 3)
            [Array]::Copy($body, 0, $planted, 3, $body.Length)
            [IO.File]::WriteAllBytes($file, $planted)
            $failed = $false
            $message = ""
            try {
              & ./scripts/ci/check-conflict-markers.ps1 *> $null
            } catch {
              $failed = $true
              $message = $_.Exception.Message
            }
            if (-not $failed) { throw "the conflict-marker gate accepted planted markers" }
            if ($message -notmatch [regex]::Escape($file) -or $message -notmatch 'conflict marker') {
              throw "the conflict-marker gate failed for the wrong reason: $message"
            }
          } finally {
            [IO.File]::WriteAllBytes($file, $original)
          }
          exit 0

      # The crate dependency direction (docs/ARCHITECTURE.md section 3). Three planted
      # states, each of which must be refused with a message naming the planted crate
      # and the reason: an upward edge in a copy of the real metadata, an exemption
      # planted for an edge the metadata does not have, and a first-party crate with no
      # layer row.
      # The scratch-repository suite plants an added exemption and requires the
      # merge-base comparison to refuse it.
      - name: the crate-edge gate can actually fail
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $real = (cargo metadata --format-version 1 --no-deps --locked --offline) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed" }
          $fixture = Join-Path $env:RUNNER_TEMP "crate-edges-planted.json"
          function Assert-Refused([hashtable]$Arguments, [string[]]$Needles, [string]$Case) {
            $failed = $false
            $message = ""
            try { & ./scripts/ci/check-crate-edges.ps1 @Arguments *> $null } catch {
              $failed = $true
              $message = $_.Exception.Message
            }
            if (-not $failed) { throw "the crate-edge gate accepted $Case" }
            foreach ($needle in $Needles) {
              if ($message -notmatch [regex]::Escape($needle)) {
                throw "the crate-edge gate refused $Case for the wrong reason: $message"
              }
            }
          }

          $meta = $real | ConvertFrom-Json
          $app = $meta.packages | Where-Object { $_.name -eq "bt-app" }
          $unicode = $meta.packages | Where-Object { $_.name -eq "bt-unicode" }
          $unicode.dependencies = @($unicode.dependencies) + [pscustomobject]@{
            name = "bt-app"; source = $null; req = "*"; kind = $null; rename = $null
            optional = $false; uses_default_features = $true; features = @(); target = $null
            path = (Split-Path -Parent $app.manifest_path)
          }
          [IO.File]::WriteAllText($fixture, ($meta | ConvertTo-Json -Depth 64))
          Assert-Refused @{ Metadata = $fixture } @("bt-unicode -> bt-app (normal)", "must go to a lower layer") "a planted upward edge"

          # bt-term has had no bt-math edge since CC-7 (D-15 repaid), so its old row, planted
          # back into the list, names an edge the real metadata does not have.
          $exemptions = "scripts/ci/crate-edge-exemptions.tsv"
          $original = [IO.File]::ReadAllBytes($exemptions)
          try {
            $planted = [IO.File]::ReadAllText($exemptions).TrimEnd("`r", "`n") + "`nbt-term`tbt-math`tnormal`tD-15`tplanted by the canary`n"
            [IO.File]::WriteAllText($exemptions, $planted)
            Assert-Refused @{} @("bt-term -> bt-math", "no longer exists") "an exemption whose edge is gone"
          } finally {
            [IO.File]::WriteAllBytes($exemptions, $original)
          }

          $layers = "scripts/ci/crate-layers.tsv"
          $original = [IO.File]::ReadAllBytes($layers)
          try {
            $kept = [IO.File]::ReadAllLines($layers) | Where-Object { $_ -notmatch "^bt-workbench`t" }
            [IO.File]::WriteAllLines($layers, [string[]]$kept)
            Assert-Refused @{} @("bt-workbench", "missing from") "a crate with no layer"
          } finally {
            [IO.File]::WriteAllBytes($layers, $original)
          }

          & ./scripts/ci/check-crate-edges-tests.ps1
          exit 0

      # The portable core is crates listed below, which must go on compiling on the two
      # platforms this workflow has one job each on.
      # `scripts/check-portable-core.ps1` is the cheap half of that guard and
      # `core-macos` and `core-linux` are the compiling half; this proves the
      # cheap half is not decoration.
      - name: the portable-core gate can actually fail
        shell: pwsh
        run: |
          $file = "crates/bt-doc/src/lib.rs"
          $original = [IO.File]::ReadAllText($file)
          try {
            [IO.File]::AppendAllText($file, "`nuse windows::Win32::Foundation::HANDLE as _PortableCoreProbe;`n")
            $failed = $false
            try {
              & ./scripts/check-portable-core.ps1 *> $null
            } catch {
              $failed = $true
            }
            if (-not $failed) {
              throw "the portable-core check accepted a planted windows:: import"
            }
          } finally {
            [IO.File]::WriteAllText($file, $original)
          }
          exit 0

      - name: the lint gate can actually fail
        shell: pwsh
        run: |
          $file = "crates/bt-doc/src/lib.rs"
          $original = [IO.File]::ReadAllText($file)
          $clippy = $null
          try {
            [IO.File]::AppendAllText($file, "`nfn _lint_gate_probe() { todo!() }`n")
            cargo clippy -p bt-doc --locked -- -D warnings 2>&1 | Out-Null
            $clippy = $LASTEXITCODE
          } finally {
            [IO.File]::WriteAllText($file, $original)
          }
          if ($clippy -eq 0) {
            throw "clippy passed a planted todo!() - workspace lints are not reaching this crate ([lints] workspace = true missing?)"
          }
          Write-Host "clippy refused the planted todo!() with exit $clippy, which is this gate passing."
          exit 0

      # G1's canary: a call of an item that exists only under `cfg(unix)`, the
      # shape of the hole the wasm floor closed in `bt-platform`, planted in a
      # checked crate. The wasm32 check must refuse it and name that crate.
      - name: the wasm-floor gate can actually fail
        shell: pwsh
        run: |
          $file = "crates/bt-doc/src/lib.rs"
          $original = [IO.File]::ReadAllText($file)
          try {
            [IO.File]::AppendAllText($file, "`n#[cfg(unix)]`nfn _wasm_floor_probe_unix_only() {}`npub fn _wasm_floor_probe() { _wasm_floor_probe_unix_only() }`n")
            $failed = $false
            $message = ""
            try {
              & ./scripts/ci/check-wasm-lib.ps1 *> $null
            } catch {
              $failed = $true
              $message = $_.Exception.Message
            }
            if (-not $failed) { throw "the wasm32 library check accepted a planted cfg(unix)-only call" }
            if ($message -notmatch '(?m)^\s+bt-doc - ' -or $message -notmatch '_wasm_floor_probe_unix_only') {
              throw "the wasm32 library check failed for the wrong reason: $message"
            }
            Write-Host $message
          } finally {
            [IO.File]::WriteAllText($file, $original)
          }
          exit 0

      # G3's five canaries. `clock-guard` reads source text, so each plant is a
      # line appended to a file and nothing is compiled but bt-source's test. A
      # qualified `std::time::Instant::now()` and a nested `use std::{time::{…}}`
      # in a crate of the source set must each be refused by file, and so must a
      # nested import written from the crate root (`use ::std::{time::Instant}`,
      # which no qualified-path reading sees), and a qualified clock in
      # bt-compose, the composition crate, refused by its file too; the same clock in bt-platform's
      # `http` module, which is out of scope by name, must not be - the scope is
      # the stated set and nothing outside it joins silently.
      - name: the clock guard can actually fail, and its scope is the stated one
        shell: pwsh
        run: |
          $plants = @(
            @{ file = "crates/bt-doc/src/lib.rs"; line = "pub fn _clock_guard_probe() -> u128 { std::time::Instant::now().elapsed().as_nanos() }"; refused = $true },
            @{ file = "crates/bt-layout/src/lib.rs"; line = "#[allow(unused_imports)] use std::{time::{SystemTime}};"; refused = $true },
            @{ file = "crates/bt-viewport/src/lib.rs"; line = "#[allow(unused_imports)] use ::std::{time::Instant};"; refused = $true },
            @{ file = "crates/bt-compose/src/lib.rs"; line = "pub fn _clock_guard_probe() -> u128 { std::time::Instant::now().elapsed().as_nanos() }"; refused = $true },
            @{ file = "crates/bt-platform/src/http.rs"; line = "pub fn _clock_guard_probe() -> u128 { std::time::Instant::now().elapsed().as_nanos() }"; refused = $false }
          )
          foreach ($plant in $plants) {
            $original = [IO.File]::ReadAllText($plant.file)
            try {
              [IO.File]::AppendAllText($plant.file, "`n$($plant.line)`n")
              $failed = $false
              $message = ""
              try {
                & ./scripts/ci/check-clock-guard.ps1 *> $null
              } catch {
                $failed = $true
                $message = $_.Exception.Message
              }
              if ($plant.refused) {
                if (-not $failed) { throw "the clock guard accepted '$($plant.line)' in $($plant.file)" }
                if ($message -notmatch [regex]::Escape($plant.file)) {
                  throw "the clock guard failed for the wrong reason on $($plant.file): $message"
                }
                Write-Host "refused as required: $message"
              } elseif ($failed) {
                throw "the clock guard reported $($plant.file), which is out of its scope by name: $message"
              } else {
                Write-Host "not reported, as required: $($plant.file) is out of scope"
              }
            } finally {
              [IO.File]::WriteAllText($plant.file, $original)
            }
          }
          exit 0

      # **The split plan's budgets, watched where a red is information.**
      #
      # `bt-source`'s measurement runs in every ordinary `cargo test` and prints
      # its four numbers there, but it asserts only the memory budget: that one
      # is a property of the tree and the lowering, the same on an idle machine
      # and a loaded one. The two wall-clock budgets of
      # `docs/plans/bt-app-split-prep.md` §5 — 20 s to build the index, 200 ms
      # for the query set — are time-sensitive, and asserting them in the
      # ordinary run would make every suite in this repository go red for a
      # reason that is not about this code, which is the one thing a guard must
      # never do.
      #
      # So they are held here, with `continue-on-error`, which is the whole
      # point: a breach turns this step red and leaves the merge alone. §5 says
      # exceeding a budget is a finding and the design changes — the fallbacks
      # it names are serialising the lowered index under `target/` keyed by
      # content hash, and narrowing the default universe — and a finding is
      # something somebody reads, never a number somebody raises. A blocking
      # gate here would invite the second.
      #
      # This job runs on `windows-2025` with the rest of the canaries, so these
      # are Windows numbers. `core-macos` and `core-linux` run the same test
      # without the variable, so the other two platforms print their numbers on
      # every run and assert only the memory budget.
      - name: the index's cost is inside the budgets of the split plan
        shell: pwsh
        continue-on-error: true
        env:
          BT_SOURCE_MEASURE_BUDGETS: "1"
        run: cargo test -p bt-source --locked --test measure -- --nocapture

      # `docs/plans/MIGRATION-DEBT.tsv` is the list of every source reader that
      # still names a file, and its whole value is that it only shrinks. A row
      # added to it is a reader let past the tripwire; planting one proves the
      # comparison against the merge base is a comparison and not a read.
      - name: the migration-debt gate can actually fail
        shell: pwsh
        run: |
          $file = "docs/plans/MIGRATION-DEBT.tsv"
          $original = [IO.File]::ReadAllText($file)
          try {
            [IO.File]::AppendAllText($file, "crates/planted/src/lib.rs`tprobe`tinclude_str!`tnothing`tP3`tno`n")
            $failed = $false
            try {
              & ./scripts/ci/check-migration-debt.ps1
            } catch {
              $failed = $true
            }
            if (-not $failed) {
              throw "the debt list accepted a row that is not at the merge base"
            }
          } finally {
            [IO.File]::WriteAllText($file, $original)
          }
          exit 0

      # The timing-bound inventory is the same whole-row, merge-base rule. Its
      # scratch-repository suite plants growth and a duplicate and requires both
      # to fail, while no-base, unchanged and shrink cases pass.
      - name: the timing-bound gate can actually fail
        shell: pwsh
        run: ./scripts/ci/check-timing-bound-tests.ps1

      # `docs/plans/DEAD-CODE.tsv` holds the undated `dead_code` sites the tree
      # had when the gate was written, and only shrinks; every other site is
      # dated and fails on the day after its date. Planting a row proves the
      # comparison against the merge base is one; the test file runs the gate
      # against scratch trees, one case per rule (a new undated site, an expired
      # one, a stale row, a changed reason, no merge base, and the rest).
      - name: the dead-code gate can actually fail
        shell: pwsh
        run: |
          $file = "docs/plans/DEAD-CODE.tsv"
          $original = [IO.File]::ReadAllText($file)
          try {
            [IO.File]::AppendAllText($file, "bt-app`tsrc/planted.rs`tprobe`tallow`t`n")
            $failed = $false
            try {
              & ./scripts/ci/check-dead-code.ps1
            } catch {
              $failed = $true
            }
            if (-not $failed) {
              throw "the dead-code list accepted a row that is not at the merge base"
            }
          } finally {
            [IO.File]::WriteAllText($file, $original)
          }
          & ./scripts/ci/check-dead-code-tests.ps1
          exit 0

      # `docs/plans/window-thread-bare-sites.tsv` stands in for the lint on raw
      # effects until A2e, and only shrinks. A bare site added together with its
      # row passes the equality test, so the historical half is what refuses it:
      # plant the row and require red.
      - name: the bare-site inventory gate can actually fail
        shell: pwsh
        run: |
          $file = "docs/plans/window-thread-bare-sites.tsv"
          $original = [IO.File]::ReadAllText($file)
          try {
            [IO.File]::AppendAllText($file, "bt-app`t-`tcrate::planted`tstd::thread::sleep`t1`n")
            $failed = $false
            try {
              & ./scripts/ci/check-window-waits.ps1
            } catch {
              $failed = $true
            }
            if (-not $failed) {
              throw "the bare-site inventory accepted growth beyond the merge base"
            }
          } finally {
            [IO.File]::WriteAllText($file, $original)
          }
          exit 0

      # The census's unknown list is compared by whole rows with multiplicity.
      # A planted row must go red even when one old row disappears beside it,
      # leaving both the row count and the summed `sites` column unchanged. The
      # same script refuses an annotation row added with no owner or "proposed".
      - name: the census-unknowns gate fails on growth, an equal-count replacement and a proposed annotation
        shell: pwsh
        run: |
          $file = (Resolve-Path "docs/plans/design/ownership-census-unknowns.tsv").Path
          $original = [IO.File]::ReadAllText($file)
          try {
            [IO.File]::AppendAllText($file, "?.title`tcrate::planted`tprobe`ta planted row`t1`n")
            $failed = $false
            try {
              & ./scripts/ci/check-census-unknowns.ps1
            } catch {
              $failed = $true
            }
            if (-not $failed) {
              throw "the census's unknown list accepted a hand-added row"
            }
            $lines = $original -split "`r?`n"
            $header = $false
            for ($at = 0; $at -lt $lines.Count; $at++) {
              if ($lines[$at].Length -eq 0 -or $lines[$at].StartsWith("#")) { continue }
              if (-not $header) { $header = $true; continue }
              $columns = $lines[$at].Split("`t")
              $lines[$at] = "?.title`tcrate::planted`tprobe`ta planted replacement`t$($columns[4])"
              break
            }
            [IO.File]::WriteAllText($file, ($lines -join [Environment]::NewLine))
            $failed = $false
            try {
              & ./scripts/ci/check-census-unknowns.ps1
            } catch {
              $failed = $true
            }
            if (-not $failed) {
              throw "the census's unknown list accepted one removed row plus one planted row"
            }
          } finally {
            [IO.File]::WriteAllText($file, $original)
          }
          $annotations = (Resolve-Path "docs/plans/design/ownership-census-annotations.tsv").Path
          $original = [IO.File]::ReadAllText($annotations)
          try {
            [IO.File]::AppendAllText($annotations, "App.planted`t-`tVIEW`twindows`tproposed at the probe merge`n")
            $failed = $false
            try {
              & ./scripts/ci/check-census-unknowns.ps1
            } catch {
              $failed = $true
            }
            if (-not $failed) {
              throw "the census's annotations accepted an added row that says proposed"
            }
          } finally {
            [IO.File]::WriteAllText($annotations, $original)
          }
          exit 0

  # ── everything that is decided by reading, not by hardware ────────────────
  logic:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      # Whole history: see `gates-can-fail`'s checkout. The debt-list check runs
      # here for real, and a merge base is what it compares against.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The compiler and the shared cache both come from
      # `.github/actions/toolchain`, which is the one place in this repository
      # that decides what Rust a job is built with. `release.yml` calls the same
      # action, so the two files cannot drift apart again.
      - uses: ./.github/actions/toolchain

      - name: tracked text is visible to source readers
        shell: pwsh
        run: |
          ./scripts/ci/check-no-nul.ps1
          ./scripts/ci/check-conflict-markers.ps1

      # docs/ARCHITECTURE.md section 3's direction, read from `cargo metadata`:
      # every normal and build edge between first-party crates goes down a layer
      # of `scripts/ci/crate-layers.tsv`, or is a row of the exemption list,
      # which only shrinks against the merge base.
      - name: crate dependencies go down the layers
        shell: pwsh
        run: ./scripts/ci/check-crate-edges.ps1

      # Each vendored crate must stay a workspace member: its own upstream suite
      # is our regression line against our patches breaking its semantics, and it
      # only runs while it is a member. A real regression hid behind exactly this
      # gap for alacritty — see docs/reviews/claude-review-M-1-part1-rework.md —
      # and mitex-parser is the same bet with a harder stake: what Folio changed
      # there is the recursion bound that keeps a printed formula from ending the
      # process, so upstream's hundred parse snapshots are how we know the bound
      # changed nothing else.
      #
      # Asked of cargo, not of a grep: the manifest mentions each path twice
      # (members and [patch.crates-io]), so grepping it passes even with the
      # member deleted.
      - name: the vendored crates are workspace members at their pinned versions
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          foreach ($vendored in @(
            @{ name = "alacritty_terminal"; dir = "vendor/alacritty_terminal"; version = "0.26.0" },
            @{ name = "mitex";              dir = "vendor/mitex";              version = "0.2.4"  },
            @{ name = "mitex-parser";       dir = "vendor/mitex-parser";       version = "0.2.4"  },
            @{ name = "vte";                dir = "vendor/vte";                version = "0.15.0" }
          )) {
            $want = [IO.Path]::GetFullPath("$($vendored.dir)/Cargo.toml", $PWD.Path)
            $pkg = $meta.packages | Where-Object {
              $_.name -eq $vendored.name -and
              [IO.Path]::GetFullPath($_.manifest_path) -eq $want
            }
            if (-not $pkg) { throw "vendored $($vendored.name) is not in the workspace" }
            if ($pkg.id -notin $meta.workspace_members) {
              throw "vendored $($vendored.name) left workspace.members - its upstream tests would stop running"
            }
            if ($pkg.version -ne $vendored.version) {
              throw "vendored $($vendored.name) is $($pkg.version), expected $($vendored.version)"
            }
          }

      # First-party only: vendor is upstream's code in upstream's format, and
      # reformatting it would bury our patches in 300 lines of whitespace diff.
      # Every first-party package, because a crate left off this list is a crate
      # whose formatting nothing checks.
      - name: fmt
        run: >
          cargo fmt
          --package bt-term --package bt-transcript --package bt-doc
          --package bt-viewport --package bt-detect --package bt-corpus
          --package bt-layout --package bt-math --package bt-pty
          --package bt-platform --package bt-persist --package bt-unicode
          --package bt-render --package bt-winres --package bt-source
          --package bt-workbench --package bt-app --package bt-lint-probe
          --package bt-testpath --package bt-effects --package bt-compose
          -- --check

      # The two excluded packages are still *linted* — their libraries are
      # dependencies of `bt-math`, and a path dependency does not get
      # `--cap-lints allow`, so the code Folio patched inside them is held to
      # this line exactly as first-party code is. What the exclusion takes out is
      # their own test targets, which upstream wrote against upstream's lints:
      # `mitex-parser` declares `missing_docs = "warn"` and `-D warnings` turns
      # that into a demand for doc comments on test helpers nobody here wrote.
      # Holding somebody else's test fixtures to our bar buys nothing and would
      # be paid for by editing files we want byte-identical to the published
      # crate (`scripts/check-vendor-notices.ps1` reads exactly that).
      - name: clippy
        run: >
          cargo clippy --workspace --all-targets --locked
          --exclude mitex --exclude mitex-parser
          -- -D warnings

      # Ours and alacritty's upstream suite in one go, because vendor is a
      # member — minus the two crates whose tests are about hardware. `bt-pty`
      # starts real ConPTY sessions and `bt-render` asks for a real adapter;
      # each has a job of its own below, where the machine it needs is set up
      # and where a failure means something specific.
      - name: test
        run: cargo test --workspace --locked --exclude bt-pty --exclude bt-render

      # The adapter and cell_capture modules are the vendor compatibility seam. Their job is to
      # report terminal facts; importing document, detection, or viewport policy there recreates
      # the layering bug Task 00b removed. `bt_term::adapter_boundary_tests` holds the rule; the
      # canary plants the import in a temporary copy and requires the already-built test to fail.
      - name: the adapter boundary gate can actually fail
        shell: pwsh
        run: |
          $copy = Join-Path $env:RUNNER_TEMP "folio-adapter-boundary-$([Guid]::NewGuid().ToString('N'))"
          Copy-Item -LiteralPath "crates/bt-term/src" -Destination $copy -Recurse
          $file = Join-Path $copy "adapter.rs"
          [IO.File]::AppendAllText($file, "`nuse bt_doc::HistoryDocument as _AdapterBoundaryProbe;`n")
          $env:BT_ADAPTER_BOUNDARY_SOURCE_ROOT = $copy
          $said = (cargo test -p bt-term --lib --locked -- adapter_boundary_tests 2>&1 | Out-String)
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            throw "the adapter boundary test accepted a planted bt_doc import"
          }
          if ($said -notmatch 'the adapter seam names a policy crate') {
            throw "the probe failed without the adapter boundary test refusing it: $said"
          }
          exit 0

      # **A contract of every build profile, run in the one it is easiest to lose in.** A read of
      # the host names (CC-4) or of the SVG codec (CC-7) before the host installed it panics in
      # release too: this binary is a process of its own with nothing installed, and a
      # `debug_assert!` in place of the panic is green in the step above and red here. Release artefacts are a second build of
      # bt-term's graph (fat LTO) and go into the same cache.
      - name: the host-installed facts hold in release
        run: cargo test --release --locked -p bt-term --test host_capabilities

      # This canary belongs after the workspace build it needs. A leaf crate
      # makes the second harness query seconds rather than a second workspace
      # build in `gates-can-fail`.
      - name: the ignored-test gate can actually fail
        shell: pwsh
        run: |
          $file = "crates/bt-lint-probe/src/lib.rs"
          $original = [IO.File]::ReadAllText($file)
          try {
            [IO.File]::AppendAllText($file, "`n#[test]`n#[ignore = `"planted`"]`nfn _ignored_gate_probe() {}`n")
            $failed = $false
            try {
              & ./scripts/ci/check-ignored-tests.ps1
            } catch {
              $failed = $true
            }
            if (-not $failed) {
              throw "the allowlist accepted a test that is not on it"
            }
          } finally {
            [IO.File]::WriteAllText($file, $original)
          }
          exit 0

      - name: the ignored tests are exactly the ones on the list
        shell: pwsh
        run: ./scripts/ci/check-ignored-tests.ps1

      # The other list of `docs/plans/bt-app-split-prep.md` §6.1. The tripwire
      # (`crates/bt-source/tests/tripwire.rs`, run by the suite above) refuses a
      # source reader that names a file and is on neither list; this refuses a
      # row added to the list to get past it. Together they are one rule: the
      # number of readers bound to a file goes down and never up.
      - name: the migration-debt list only shrinks
        shell: pwsh
        run: ./scripts/ci/check-migration-debt.ps1

      # `docs/plans/POINTER-DEBT.tsv` (T-POINTER-CAPTURE section 4.2): every read of pointer data
      # outside the pointer module, one row per occurrence. The test
      # `every_pointer_read_is_the_routers_or_a_captures` requires the file to be
      # exactly what the index finds; this refuses a row added to it to let a new
      # reader past that test. Same whole-row, merge-base rule as the list above.
      - name: the pointer-debt list only shrinks
        shell: pwsh
        run: ./scripts/ci/check-pointer-debt.ps1

      # Gate G3: the crates a browser build reads name no clock of the standard
      # library (`scripts/ci/check-clock-guard.ps1` states the source set and what
      # is out of it by name). The workspace test above ran the same reading;
      # this is its name, its counts and its refusals on their own line.
      - name: clock-guard
        shell: pwsh
        run: ./scripts/ci/check-clock-guard.ps1

      - name: the timing-bound test list only shrinks
        shell: pwsh
        run: ./scripts/ci/check-timing-bound.ps1

      # "Built, not wired" (0.4.7 U-44): every `allow`/`expect(dead_code)` in
      # product code is on `docs/plans/DEAD-CODE.tsv`, which only shrinks
      # against the merge base (a row whose only change is its file is a move),
      # or carries `<TICKET-ID> until YYYY-MM-DD: <why>` with the date still
      # ahead, or `permanent: <why>` (`docs/CONVENTIONS.md` §八).
      - name: the dead-code list only shrinks
        shell: pwsh
        run: ./scripts/ci/check-dead-code.ps1

      # The window thread's checks (thread-door note, revision (j)): the bare-site
      # inventory has no larger effect-family total than at the merge base (the
      # equality half is a test in the suite above); the configuration fence,
      # which is also this job's assertion that
      # no clippy configuration directory is set; nothing lowers the lint outside
      # the source; no registry row is added without a ruling.
      - name: the window thread's checks
        shell: pwsh
        run: ./scripts/ci/check-window-waits.ps1

      # The positive control (thread-door note, revisions (j)4 and (j)11.3): the
      # probe is what the registry generates, and the lint reports each entry
      # assigned to this target on its line - a separate invocation from the
      # clippy line above, which stays as it is.
      - name: the lint probe's positive control
        shell: pwsh
        run: ./scripts/ci/check-lint-probe.ps1

      # The ownership census's unknown sites, the same rule across commits:
      # bt-source's `census` test holds the code to the committed list, and
      # this holds the list's total to the merge base's (or census-1's seed).
      - name: the census's unknown sites only shrink
        shell: pwsh
        run: ./scripts/ci/check-census-unknowns.ps1

      # `check-vendor-notices.ps1` reads upstream alacritty 0.26.0 out of the
      # registry to diff it against `vendor/`, so the sources have to be there.
      # A no-op after the build above; named anyway, because a job that only
      # works because of what a previous step happened to leave behind is a job
      # that breaks when the steps are reordered.
      - name: fetch the sources the notices gates read
        run: cargo fetch --locked

      # `check-notices.ps1` regenerates `THIRD-PARTY-NOTICES.md` and compares
      # bytes, and the generator is `cargo about`. Without this the gate below
      # does not report drift — it reports a missing tool, which is a different
      # failure wearing the same red. Pinned to the version the checked-in file
      # was generated with: a newer one that renders a heading differently would
      # read as drift in the licences rather than a change in the renderer.
      - name: cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      # The three gates the licensing line owns: the generated third-party
      # notices still match the lock file, no machine path or personal name is
      # tracked, and every modified vendored file carries its Apache-2.0 §4(b)
      # notice. Each says so and is skipped when it is not in the tree — this
      # branch and that one land separately, and a missing file is not a
      # violation.
      - name: the licensing line's gates
        shell: pwsh
        run: |
          $gates = @(
            "scripts/check-notices.ps1",
            "scripts/check-machine-paths.ps1",
            "scripts/check-doc-words.ps1",
            "scripts/check-vendor-notices.ps1"
          )
          $ran = 0
          foreach ($gate in $gates) {
            if (-not (Test-Path -LiteralPath $gate)) {
              Write-Warning "$gate is not in the tree yet - it did not run"
              continue
            }
            Write-Host "== $gate"
            pwsh -NoLogo -NoProfile -File $gate
            if ($LASTEXITCODE -ne 0) { throw "$gate failed with exit $LASTEXITCODE" }
            $ran++
          }
          Write-Host "$ran of $($gates.Count) licensing gates ran."

  # ── the library crates a browser build will reference (gate G1) ───────────
  #
  # `scripts/ci/check-wasm-lib.ps1` holds the list and says why each crate is on
  # it. A job of its own because it builds every dependency of those crates a
  # second time, for `wasm32-unknown-unknown`, and nothing else here can share
  # that build.
  wasm-lib-check:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/toolchain
        with:
          targets: wasm32-unknown-unknown
      - name: the library crates check for wasm32
        shell: pwsh
        run: ./scripts/ci/check-wasm-lib.ps1

  # ── real ConPTY, real child processes ─────────────────────────────────────
  conpty:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The compiler and the shared cache both come from
      # `.github/actions/toolchain`, which is the one place in this repository
      # that decides what Rust a job is built with. `release.yml` calls the same
      # action, so the two files cannot drift apart again.
      - uses: ./.github/actions/toolchain

      # These spawn cmd.exe and powershell.exe through the sidecar ConPTY that
      # `crates/bt-pty/build.rs` extracts, and read what comes back. They are
      # the only tests in this workspace that can fail because of what the
      # operating system did.
      #
      # One of them is selected out by name: the keyboard protocol's case 4,
      # a native Node reader (`keyboard_protocol_through_conpty.rs`). It needs
      # `node` on PATH and fails, rather than skipping, when there is none, so
      # that a green result means the reader ran; it runs in the ticket's
      # acceptance on the release machine instead of on a runner whose Node is
      # whatever the image carries (design note keyboard-protocol-2026-09-29, §6.3).
      - name: test bt-pty against real child processes
        shell: pwsh
        run: |
          cargo test -p bt-pty --locked -- --skip a_native_node_reader 2>&1 | Tee-Object -FilePath conpty-tests.log
          if ($LASTEXITCODE -ne 0) { throw "bt-pty tests failed" }

      - name: the sidecar is the one that was extracted
        shell: pwsh
        run: |
          foreach ($name in @("conpty.dll", "OpenConsole.exe")) {
            $path = "target/debug/$name"
            if (-not (Test-Path -LiteralPath $path)) { throw "$path was not extracted" }
            "{0,12:N0}  {1}" -f (Get-Item $path).Length, $path | Write-Host
          }

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conpty-failure
          path: conpty-tests.log
          if-no-files-found: ignore

  # ── a real adapter, which a runner does not have until one is installed ────
  gpu:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The compiler and the shared cache both come from
      # `.github/actions/toolchain`, which is the one place in this repository
      # that decides what Rust a job is built with. `release.yml` calls the same
      # action, so the two files cannot drift apart again.
      - uses: ./.github/actions/toolchain

      # The test binaries have to exist before WARP can be put beside them:
      # DXGI prefers a `d3d10warp.dll` in the loading binary's own directory,
      # which is `target/debug/deps`.
      - name: build the render tests
        run: cargo test -p bt-render --locked --no-run

      - name: install WARP
        shell: pwsh
        run: ./scripts/ci/install-warp.ps1 -TargetDir target/debug

      - name: test bt-render on a real device
        run: cargo test -p bt-render --locked

  # ── the executable, started ───────────────────────────────────────────────
  #
  # Every gate above runs against a library. This one runs `folio.exe`: the
  # front door's exit codes, a cold launch that opens a window and gets text
  # onto it, the ConPTY it actually loaded, and whether it agrees with Windows
  # about its own DPI. A runner has no WebView2 Runtime, which makes it exactly
  # the machine the preview's degrade path has to be right on.
  smoke:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The compiler and the shared cache both come from
      # `.github/actions/toolchain`, which is the one place in this repository
      # that decides what Rust a job is built with. `release.yml` calls the same
      # action, so the two files cannot drift apart again.
      - uses: ./.github/actions/toolchain

      - name: build folio.exe
        run: cargo build -p bt-app --locked

      # `package.ps1` and `smoke.ps1 -ArchiveOnly` against the release manifest,
      # on a real archive packed from the debug build above with the runner's
      # Windows SDK `makeappx` (no `-Sign`, nothing started). It is what holds
      # "package.ps1 packs from archive-members.txt": its
      # `the_manifest_lists_every_member_but_the_two_signed_ones` packs and
      # refuses a member the list does not name.
      - name: package.ps1 against the release manifest
        shell: pwsh
        run: ./scripts/release/package-tests.ps1 -Binaries target/debug

      - name: install WARP
        shell: pwsh
        run: ./scripts/ci/install-warp.ps1 -TargetDir target/debug

      - name: start it
        shell: pwsh
        run: ./scripts/release/smoke.ps1 -Exe target/debug/folio.exe -Artifacts target/smoke -TimeoutSeconds 300 -Updater off

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke
          path: target/smoke
          if-no-files-found: warn

  # ── the second platform, kept from drifting away by compiling it ──────────
  #
  # `docs/plans/port/macos-spike-2026-09-07.md` measured that about 90 % of this
  # workspace already builds on macOS, and that what stands between it and the
  # rest is one crate — `bt-platform` — plus the modules of `bt-app` that consume
  # it. A macOS port is its own milestone and it is not scheduled. **This job is
  # not that port.** It exists because the measurement has a half-life: every
  # feature landed on a Windows-only CI can add a Win32 call to a portable crate
  # and nothing will say so, and the 90 % is then a number about a day in
  # September rather than about this repository.
  #
  # So the crates are named one at a time — the portable crates,
  # `scripts/check-portable-core.ps1` names, plus the vendored terminal they are
  # all downstream of, plus `bt-platform` and `bt-app`, which that script does
  # not name because they are the two crates that *may* know what platform they
  # are on. The reason is the same for all of them: "everything" is a shape a
  # script can infer, while "these are the crates we promise compile on a second
  # platform" is a decision. A crate that joins the workspace joins this list on
  # purpose, or the promise does not cover it.
  #
  # It is required in the same sense every other job here is: nothing in this
  # file is `continue-on-error`, and `gates-can-fail` differs from its neighbours
  # by *proving itself* rather than by being optional. A red here is a red run.
  #
  # **M1-10 grew this job from thirteen crates to the whole of what compiles.**
  # The two sentences that used to stand here — "`bt-app` is deliberately absent
  # and is expected to fail: 321 errors naming 79 items missing from
  # `bt_platform`" and "moving `bt-pty` onto the test line is M1-10's job,
  # together with the `-D warnings` line" — were both true when they were
  # written and are both retired. M1-1 gave `bt_platform` the missing items and
  # `bt-app` links here; M1-6 ran `bt-pty`'s suite against real Unix children on
  # the owner's Mac mini; M1-10 fixed the last three `bt-app` targets that only
  # `--all-targets` ever compiles, and cleared the warnings the `-D warnings`
  # line tripped over.
  #
  # So what this job now proves, in the order the steps make the claims:
  #
  # ① the crates below compile on macOS with their test code, which is
  #    the promise `core-linux` makes in the same words;
  # ② **`bt-app` compiles here, every target of it** — the binary, its test
  #    target and both video probes in `examples/`. `--all-targets` is the whole
  #    point: a `#[cfg(test)]` module and an example are where a platform
  #    assumption hides most cheaply, and the three targets M1-10 fixed were
  #    exactly those;
  # ③ the portable suites run, `bt-platform`'s and `bt-pty`'s among them — the second
  #    starts real Unix children over a real pty, which is a thing no Windows job
  #    in this file can do — and, since ticket 72, `bt-render`'s against the
  #    runner's own Metal device and `bt-corpus`'s (D-63);
  # ④ **the whole workspace passes clippy with `-D warnings`** — the same line
  #    `logic` holds on Windows, held on the second platform (ticket 72, D-63).
  #    Until then only `bt-platform` was linted here, and `bt-app` carried
  #    fourteen macOS-only findings (D-67) nobody's gate saw: items whose only
  #    readers are `#[cfg(windows)]`, and two `#[must_use]` answers whose
  #    Windows signatures did not carry the attribute;
  # ⑤ that lint line can fail: a planted macOS-only dead item is refused, the
  #    `gates-can-fail` mechanism run on this platform (the Windows job cannot
  #    plant it — Windows never compiles the item).
  #
  # **`bt-term`'s suite runs here since H1 (D-83).** Its tests that asserted a
  # Windows fact on every platform now spell their fixtures the way this
  # platform roots a path, and the three whose fact exists only on Windows are
  # `#[cfg(windows)]` (docs/CONVENTIONS.md, "A test that is not limited to one
  # platform asserts a fact of every platform"). Measured on the owner's Mac mini
  # on 2026-10-08: the whole `cargo test -p bt-term` is about 40 s once its
  # dependencies are built, which the steps above have already built.
  # **`bt-app`'s whole suite is still not a step here.** H1 took it from 288
  # reds to the few that are real macOS defects (ledger, "H1"), and the
  # ignored-tests gate cannot yet hold a macOS-only ignore for them; a longer
  # command would only be a red one until those tickets land.
  core-macos:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # **The release lane's four shell scripts, parsed on every push.** They
      # are `#!/bin/sh`, they are what `release.yml`'s macOS job is made of, and
      # a syntax error in one of them is otherwise found by a tag: this job is
      # the only one in this file that is on the platform they run on, and the
      # check costs a second. It parses them and runs none of them — `sh -n`
      # reads the grammar and executes nothing.
      - name: the macOS release scripts parse
        run: |
          set -eu
          for script in scripts/release/macos/*.sh; do
            sh -n "$script"
            echo "parsed: $script"
          done
      # The same composite action every other job comes through. It reads the
      # channel out of rust-toolchain.toml and, off Windows, installs that
      # version against this runner's own host triple — the pin is the version,
      # and the triple in that file settles which of the two Windows hosts a
      # Windows machine picks.
      - uses: ./.github/actions/toolchain

      # `--all-targets`, because the test code is where a platform assumption
      # hides most cheaply: five of the seven errors this branch fixed were in
      # `#[cfg(test)]` modules that had never been compiled anywhere else.
      #
      # The same `core-linux` checks and in the same order, for the
      # reason that job's own comment gives: two lists that mean one thing
      # drift, and a diff that changes one and not the other is meant to be read
      # as the mistake it is.
      - name: check the portable crates
        run: >
          cargo check --locked --all-targets
          -p bt-unicode -p bt-doc -p bt-detect -p bt-layout -p bt-persist
          -p bt-winres -p bt-math -p bt-transcript -p bt-viewport
          -p bt-render -p bt-term -p bt-pty -p bt-corpus -p bt-platform
          -p bt-source -p bt-testpath -p bt-effects -p bt-workbench -p bt-compose -p alacritty_terminal

      # **The application, every target of it** (M1-10). A step of its own and
      # not a name on the line above, because the claim is a different one: the
      # list above is "the core still compiles somewhere that is not Windows"
      # and this is "the product does". It is also the step whose red is worth
      # reading on its own — `bt-app` is where the port actually happens, and a
      # failure buried in a fifteen-crate command names a crate rather than a
      # milestone.
      #
      # `--all-targets` reaches three targets nothing else compiles: the bin's
      # own `#[cfg(test)]` modules and the two probes in `examples/`, which name
      # DirectComposition and Media Foundation and are `#[cfg(windows)]` per item
      # with a portable `main` beside them. Those three were the whole of what
      # M1-1 left failing here.
      - name: check the application, every target of it
        run: cargo check --locked --all-targets -p bt-app

      # The application suite still contains Windows-fact fixtures, but these updater modules are
      # macOS product code and must not wait for a manual re-entry run to compile and execute. Each
      # filter is required to select at least one test so a renamed module cannot turn this step
      # green by running nothing. E-12 is the one test that deliberately launches `/usr/bin/open`;
      # CI keeps the deterministic fake-launch coverage and leaves that real launch to the owner.
      # The uninstall door runs here too: its bundle, LaunchAgents and Application Support rows are
      # macOS product code, and its per-platform labels were red here with nothing running them.
      # The launch wire runs here too (0.4.8 D3): its two-copy tests start two copies of the test
      # binary over one data directory, and the refusal they pin was a macOS-only defect.
      - name: test the macOS updater modules
        run: |
          set -euo pipefail
          skip=the_trial_is_launched_through_launch_services_and_found_by_its_image
          skip_log="$RUNNER_TEMP/macos-updater-skip-list.log"
          cargo test --locked -p bt-app --bin folio -- --list | tee "$skip_log"
          grep -Eq "(^|::)${skip}: test$" "$skip_log" || {
            echo "the macOS updater skip '$skip' names no test"
            exit 1
          }
          run_app_filter() {
            filter="$1"
            log="$RUNNER_TEMP/macos-updater-${filter//[^a-zA-Z0-9]/-}.log"
            cargo test --locked -p bt-app --bin folio "$filter" -- \
              --skip "$skip" | tee "$log"
            grep -Eq '^running [1-9][0-9]* tests?$' "$log" || {
              echo "the macOS updater filter '$filter' selected no tests"
              exit 1
            }
          }
          run_app_filter update_apply_macos
          run_app_filter update_apply::
          run_app_filter update_recover
          run_app_filter update_handoff
          run_app_filter update_trial
          run_app_filter update_startup
          run_app_filter uninstall::
          run_app_filter launch_wire
          log="$RUNNER_TEMP/macos-updater-install-flip.log"
          cargo test --locked -p bt-platform install_flip | tee "$log"
          grep -Eq '^running [1-9][0-9]* tests?$' "$log" || {
            echo "the macOS updater filter 'install_flip' selected no tests"
            exit 1
          }

      # The eight suites the spike's own table records as green here, plus the
      # two M1-1's branch made green — `bt-transcript` and `bt-viewport`, whose
      # seven failures were all one cause: a path grammar that only knew Windows
      # — plus the two M1-10 added.
      #
      # **`bt-platform` and `bt-pty` are the two this ticket moved from `check`
      # to `test`, and they are the two that matter most here.** `bt-platform`
      # off Windows is mostly refusals, and a refusal that is never called is a
      # claim nobody has read back: `portable_impl::refusal_tests` calls every
      # door, and the four fixture-gated rules M1-10 mirrored (the trailing-dot
      # trim, the reveal argument, where a program is looked for, the Explorer
      # registration) each have a POSIX twin that only runs here and on Linux.
      # `bt-pty` starts real Unix children over a real pty — spawn, resize, exit
      # and reap — which M1-6 measured on the owner's Mac mini and which no
      # Windows job in this file can do.
      - name: test the portable crates
        run: >
          cargo test --locked
          -p bt-unicode -p bt-doc -p bt-detect -p bt-layout -p bt-persist
          -p bt-winres -p bt-math -p bt-transcript -p bt-viewport
          -p bt-platform -p bt-pty -p bt-source -p bt-testpath -p bt-effects -p bt-workbench -p alacritty_terminal
          -p bt-render -p bt-corpus -p bt-term

      # **The lint line, held on the second platform** — `logic`'s own clippy
      # line, word for word (ticket 72, D-63). M1-10 started it on `bt-platform`
      # alone and left widening it as "a decision somebody should take on
      # purpose"; ticket 72 took it once `bt-app` was clean here (D-67). The
      # findings this line exists for are the ones Windows cannot see: an item
      # whose only readers are `#[cfg(windows)]` is dead code on this platform,
      # and a `#[must_use]` that only the non-Windows arm of a door carries is an
      # ignored answer only here.
      - name: clippy
        run: >
          cargo clippy --workspace --all-targets --locked
          --exclude mitex --exclude mitex-parser
          -- -D warnings

      # The lint probe's positive control on this target: the macOS entries
      # (`libc::write`, `libc::close`) are proven here and only here.
      - name: the lint probe's positive control
        shell: pwsh
        run: ./scripts/ci/check-lint-probe.ps1

      # **The macOS lint line can actually fail** — `gates-can-fail`'s mechanism
      # (plant, demand red, put the file back), run here because the violation
      # it plants exists only on this platform: an item compiled only on macOS
      # that nothing reads. Windows never compiles it, so the Windows canary
      # cannot stand in for this one. The refusal must name the planted item, so
      # a red for any other reason is not mistaken for this proof, and the file
      # is compared with the checkout afterwards.
      - name: the macOS lint gate can actually fail
        run: |
          file=crates/bt-app/src/explorer_menu.rs
          original="$RUNNER_TEMP/lint-gate-original.rs"
          log="$RUNNER_TEMP/lint-gate.log"
          cp "$file" "$original"
          printf '\n#[cfg(target_os = "macos")]\nfn macos_lint_gate_probe() {}\n' >> "$file"
          set +e
          cargo clippy --locked -p bt-app -- -D warnings > "$log" 2>&1
          clippy=$?
          set -e
          cp "$original" "$file"
          git diff --exit-code -- "$file"
          if [ "$clippy" -eq 0 ]; then
            echo "clippy passed a planted macOS-only dead item - the macOS lint line is not a gate"
            exit 1
          fi
          if ! grep -q "macos_lint_gate_probe" "$log"; then
            cat "$log"
            echo "clippy failed with exit $clippy, but not on the planted item"
            exit 1
          fi
          grep -m1 -B1 -A3 "macos_lint_gate_probe" "$log"
          echo "clippy refused the planted macOS-only item with exit $clippy, which is this gate passing."

  # ── the platform the remote work runs on ──────────────────────────────────
  #
  # `docs/plans/remote/research-2026-09-10.md` §1 puts 0.4 on a Unix box: the
  # Folio that owns the shells lives there and the local one drives it, and what
  # that server takes from this workspace is the portable core plus `bt-pty` —
  # "everything — spawn, write, resize, read, wait, the output ring" (§1's
  # table). `core-macos` above proves the core still compiles somewhere that is
  # not Windows; this proves it where the next milestone's code will actually
  # run, and it does so before that code exists rather than after.
  #
  # The label floats, as it does on the mac job and unlike `windows-2025`. The
  # rule at the top of this file is about a *Windows version*, because that is
  # what a terminal emulator's behaviour is a statement about; this job's claim
  # is "a Linux userland compiles and runs this", which no Ubuntu release number
  # narrows usefully.
  #
  # **The one thing this job does that `core-macos` does not is test `bt-pty`,
  # and Linux is why it can.** The reason that crate is off the mac test line —
  # and off the `logic` job's — is that its suite "starts real child processes
  # through a ConPTY that does not exist off Windows". That is two claims wearing
  # one coat, and Linux takes them apart: it has no ConPTY either, but it has a
  # *real pty*, and `vendor/conpty/portable-pty` still carries the `#[cfg(unix)]`
  # `UnixPtySystem` over `libc::openpty` that `bt-pty` reaches through
  # `native_pty_system()` (research §2). So the crate's portable half runs here
  # for the first time: the output ring and its backpressure, the input ring and
  # the writer thread that is the only thing allowed to meet the pipe, the reader
  # that drains a closed ring so a shutdown cannot deadlock, the bounded reap,
  # the recorder and its chunk sidecar, and the interpreter grammar.
  #
  # What does **not** run here is the half that needs a Windows child —
  # `cmd.exe`, `powershell.exe`, and the shell resolution whose whole answer is
  # `pwsh.exe` or `powershell.exe`. Those tests carry `#[cfg(windows)]` and the
  # `conpty` job above is where they run; a fixture in them is a Windows path and
  # a `PATH` a Unix `join_paths` refuses, so they were never platform-neutral
  # tests that happened to be run in one place.
  #
  # **This job starts processes now** (M1-6, which is also remote T2).
  # `resolve_default_shell` has the Unix rule the remote server needs — `$SHELL`
  # when it names a program this machine can start, then the system shells this
  # platform is probed for, then `/bin/sh`, interactive and non-login — and the
  # PowerShell arguments and the PowerShell retry are `#[cfg(windows)]` and
  # unreachable from here. So the `#[cfg(unix)]` half of `bt-pty`'s suite spawns
  # `/bin/sh` over a real pty and asks this runner's own kernel the five
  # questions nobody had asked it: that a child's output reaches the output ring,
  # that its chosen exit code survives the trip and the process is reaped rather
  # than left a zombie (read back out of `ps`, not out of our own bookkeeping),
  # that a resize is a real `TIOCSWINSZ` the child sees in its own `stty size`,
  # that a child which has trapped `SIGHUP` away and carried that disposition
  # through an `exec` is ended anyway when its session goes, and that shutting a
  # session down hands the child a newline before any of that — which is the
  # vendored backend's `UnixMasterWriter::drop`, has no Windows counterpart, and
  # was found by this ticket rather than known. Ubuntu has `/bin/sh`,
  # `/bin/bash`, `sleep`, `stty` and `ps`, which is the whole of what they need.
  core-linux:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # **The static C runtime is a Windows shipping rule and this job ships
    # nothing.** `.cargo/config.toml` puts `-C target-feature=+crt-static` on
    # every build so that `folio.exe` carries its own CRT rather than asking a
    # clean machine for the Visual C++ redistributable, and it says `[build]`
    # rather than a target table on purpose — the flag has to reach build
    # scripts and proc macros there too. macOS ignores the feature. Linux does
    # not: glibc honours it, and a statically linked host cannot load a dynamic
    # library, so the first proc macro in the graph stops the compile with
    # "cannot produce proc-macro for `bytecheck_derive` as the target
    # x86_64-unknown-linux-gnu does not support these crate types". `RUSTFLAGS`
    # outranks the config file, and it says the opposite here rather than
    # nothing, so that a reader sees a decision instead of an omission.
    env:
      RUSTFLAGS: -C target-feature=-crt-static
      # `bt-platform`'s Linux tests never open the desktop audio device; a sink
      # that discards its input keeps any future playback probe honest too.
      GST_AUDIO_SINK: fakesink
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The same composite action every other job comes through, and off Windows
      # it installs the pinned *version* against this runner's own host triple.
      - uses: ./.github/actions/toolchain

      # Linux-only runtime checks below exercise installed fonts, GStreamer
      # playback and two private display servers. The app build links its own
      # Rust code, while wgpu, Weston and Xvfb use Mesa's software drivers here.
      - name: install Linux desktop test runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            xvfb weston libgl1-mesa-dri mesa-vulkan-drivers libxkbcommon-x11-0 \
            xfce4-clipman dbus-x11 python3-xlib \
            fonts-noto-cjk fonts-noto-mono fonts-dejavu-core \
            ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - name: check the GStreamer elements used by Linux playback
        run: |
          for element in appsink fakesink playbin qtdemux tsdemux avdec_h264; do
            gst-inspect-1.0 "$element" >/dev/null
          done

      # The same fifteen crates `core-macos` checks and in the same order,
      # because they are the same promise: `scripts/check-portable-core.ps1`'s
      # thirteen, plus the vendored terminal they are all downstream of, plus
      # `bt-platform` (M1-10). Two lists that mean one thing drift; a diff that
      # changes one and not the other is meant to be read as the mistake it is.
      #
      # The portable core and Linux desktop build are checked separately.
      - name: check the portable crates
        run: >
          cargo check --locked --all-targets
          -p bt-unicode -p bt-doc -p bt-detect -p bt-layout -p bt-persist
          -p bt-winres -p bt-math -p bt-transcript -p bt-viewport
          -p bt-render -p bt-term -p bt-pty -p bt-corpus -p bt-platform
          -p bt-source -p bt-testpath -p bt-effects -p bt-workbench -p bt-compose -p alacritty_terminal

      # `core-macos`'s ten, plus `bt-pty` for the reason above and minus
      # `bt-math` for one of the same shape. `bt-render` is still checked and not
      # tested: it asks for a real adapter, and a runner without one is a
      # different failure wearing the same red. `bt-term` and `bt-corpus` stay
      # off: nobody has measured their suites on Linux, and a list of what we
      # have measured is worth more than a list of what we hope.
      #
      # **`bt-math` asks the machine for fonts, and this one has none worth the
      # name.** Three of its tests are deliberately about real installed faces
      # rather than a fixture: one rasterizes `<text font-family="Arial,
      # sans-serif">` and two ask for CJK coverage. A GitHub Linux runner ships
      # neither a CJK face nor anything called `Arial` — and `fontdb` resolves a
      # family by name, so fontconfig's metric aliases do not stand in for one.
      # Installing a CJK package would answer two of the three and leave the
      # third failing for a font whose licence keeps it off this image. Windows
      # and macOS both have those faces, both run this suite, and neither is
      # weakened by a Linux runner that cannot.
      - name: test the portable crates
        run: >
          cargo test --locked
          -p bt-unicode -p bt-doc -p bt-detect -p bt-layout -p bt-persist
          -p bt-winres -p bt-transcript -p bt-viewport
          -p bt-pty -p bt-source -p bt-testpath -p bt-effects -p bt-workbench -p alacritty_terminal

      # The Linux platform providers get the same lint bar the `gates` job
      # holds the workspace to: the Linux arms are compiled only here, so this
      # is the one place a warning in them could hide.
      - name: clippy the Linux platform crate
        run: cargo clippy -p bt-platform --all-targets --locked -- -D warnings

      - name: build the Linux desktop application
        run: cargo build -p bt-app --locked -j 2

      - name: test Linux platform providers and installed fonts
        run: cargo test -p bt-platform --locked -j 2

      # The Wayland suite uses Linux epoll, so these path dependencies stay
      # outside the cross-platform workspace. Both upstream suites run here;
      # X11 persistence is tested with a real manager on an owned display.
      - name: test the patched clipboard crates on private displays
        run: python3 scripts/ci/linux-vendor-clipboard-tests.py

      - name: recover Linux rendering after real device loss
        run: cargo test -p bt-render --lib --locked -j 2 a_lost_device -- --test-threads=1

      - name: test the Linux application
        run: cargo test -p bt-app --bin folio --locked -j 2

      - name: present terminal text on a private X11 display
        run: python3 scripts/ci/linux-smoke.py x11 --exe target/debug/folio

      - name: present terminal text on a private Wayland display
        run: python3 scripts/ci/linux-smoke.py wayland --exe target/debug/folio
