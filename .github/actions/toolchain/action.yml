name: toolchain
description: >
  Install the compiler rust-toolchain.toml names, and — for the jobs that want
  one — the shared build cache. Every job in every workflow of this repository
  comes through here, so that "which compiler is this project built with" has one
  answer and not one answer per file. The release workflow spent three tags red
  because it did not: it still carried a third-party action asked for a toolchain
  called `none`, months after CI had stopped doing that.

inputs:
  cache:
    description: >
      "true" restores and saves the shared build cache; "false" leaves the job
      with an empty target directory. A job that produces the archive people
      download passes "false", because a cache is a set of files from another run
      that nothing in that job verifies.
    required: false
    default: "true"
  targets:
    description: >
      Extra compilation targets to install beside the host's, space-separated
      (`wasm32-unknown-unknown` for the jobs that check the library crates for a
      browser). Empty installs the host target only.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # rust-toolchain.toml is the single source of truth, and the channel is read
    # out of it and named explicitly rather than left for rustup to find: the
    # runner's bare `rustup toolchain install` rejects a channel that carries a
    # host triple, and this project's channel carries one on purpose.
    #
    # **Off Windows the triple is the one thing that cannot travel.** The pin is
    # `<version>-x86_64-pc-windows-msvc`, and rustup on a Mac refuses it as a
    # channel name — not because the version is wrong but because it cannot host
    # that triple. The *version* is what this file pins; the triple only settles
    # which of the two Windows hosts (MSVC or GNU) a Windows machine picks, and
    # there is exactly one host to pick from anywhere else. So a non-Windows
    # runner installs the same version against its own default host, and
    # `RUSTUP_TOOLCHAIN` is exported for the rest of the job — without it every
    # later `cargo` reads `rust-toolchain.toml` again and asks for the Windows
    # channel a second time.
    - id: install
      shell: pwsh
      env:
        EXTRA_TARGETS: ${{ inputs.targets }}
      run: |
        $channel = (Select-String -Path rust-toolchain.toml -Pattern 'channel = "(.+)"').Matches[0].Groups[1].Value
        if (-not $IsWindows) {
          $version = ($channel -split '-', 2)[0]
          $line = rustup show | Select-String -Pattern '^Default host:\s*(\S+)$'
          if (-not $line) { throw "rustup did not report a default host, so there is no triple to install $version for" }
          $channel = "$version-$($line.Matches[0].Groups[1].Value)"
          "RUSTUP_TOOLCHAIN=$channel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        }
        Write-Host "installing $channel"
        rustup toolchain install $channel --component rustfmt --component clippy --no-self-update
        $targets = @($env:EXTRA_TARGETS -split '\s+' | Where-Object { $_ })
        if ($targets.Count -gt 0) { rustup target add --toolchain $channel @targets }
        "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    # **The cache key names the compiler the build uses, and only that one.**
    # rust-cache hashes `rustc -vV` of every toolchain `rustup toolchain list`
    # prints into the key's prefix, the part with no fallback, and the runner
    # image brings a `stable` of its own that nothing here compiles with. As
    # the image's stable moved from 1.98.1 to 1.99.0 (runners from 2026-10-15
    # on) every job's key changed with it and every restore said "No cache
    # found"; the
    # cold `logic` job then ran past its budget, a cancelled job saves no cache,
    # and `main` stayed cold for two days (T-CI-LOGIC-JOB-BUDGET). With the
    # pinned channel the only toolchain left, the key moves when
    # `rust-toolchain.toml` moves and not when the image does. The pinned
    # channel becomes the default first, so a cargo started outside the
    # workspace gets the same compiler rather than none.
    - if: ${{ inputs.cache == 'true' }}
      shell: pwsh
      env:
        CHANNEL: ${{ steps.install.outputs.channel }}
      run: |
        rustup default $env:CHANNEL
        if ($LASTEXITCODE -ne 0) { throw "rustup could not make $($env:CHANNEL) the default" }
        foreach ($other in @(rustup toolchain list --quiet | ForEach-Object { $_.Trim() } | Where-Object { $_ -and $_ -ne $env:CHANNEL })) {
          Write-Host "removing $other, which this repository does not build with"
          rustup toolchain uninstall $other
          if ($LASTEXITCODE -ne 0) { throw "rustup could not uninstall $other" }
        }
        $left = @(rustup toolchain list --quiet | ForEach-Object { $_.Trim() } | Where-Object { $_ })
        if ($left.Count -ne 1 -or $left[0] -ne $env:CHANNEL) {
          throw "the cache key would hash these toolchains, not $($env:CHANNEL) alone: $($left -join ', ')"
        }

    # Third-party, so pinned to a commit rather than to a tag its owner can
    # repoint. This action itself is referenced by path, which is this
    # repository's own file at the same commit as the workflow calling it.
    - if: ${{ inputs.cache == 'true' }}
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
