<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="316"
     viewBox="0 0 1200 316" role="img" aria-labelledby="folio-title folio-desc">
  <title id="folio-title">Folio</title>
  <desc id="folio-desc">Folio, the Windows terminal that renders math and says which
  agent is waiting for you. Beside the name, a terminal pane runs two commands; a
  rule in the left margin marks how far each one reached, and the rule beside the
  command that failed is drawn in the failure colour.</desc>

  <rect width="1200" height="316" rx="14" fill="#141414"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, Roboto, Arial, sans-serif">
    <text x="64" y="70" font-size="20" font-weight="600" letter-spacing="3.4"
          fill="#959595">WINDOWS &#183; TERMINAL &#183; WORKSPACE</text>
    <text x="64" y="154" font-size="76" font-weight="600" letter-spacing="-1.6"
          fill="#E0E0E0">Folio</text>
    <text x="64" y="202" font-size="26" fill="#E0E0E0">The Windows terminal that renders math.</text>
    <text x="64" y="236" font-size="26" fill="#E0E0E0">And says which agent is waiting for you.</text>
    <text x="64" y="278" font-family="ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, Menlo, monospace" font-size="19"
          fill="#959595">Windows 10 1809 or newer &#183; MIT or Apache-2.0</text>
  </g>

  <g id="command-marks" font-family="ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, Menlo, monospace" font-size="19">
    <text x="656" y="70" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, Roboto, Arial, sans-serif" font-size="20" font-weight="600"
          letter-spacing="3.4" fill="#959595">COMMAND MARKS</text>

    <rect x="656" y="88" width="480" height="188" rx="10"
          fill="#1B1B1B" stroke="#2E2E2E" stroke-width="1"/>

    <rect x="674" y="116" width="3" height="49" rx="1.5"
          fill="#767676"/>
    <rect x="674" y="172" width="3" height="49" rx="1.5"
          fill="#FB7185"/>

    <text x="690" y="131" xml:space="preserve"><tspan fill="#A8A8A8">PS </tspan><tspan fill="#E0E0E0" text-decoration="underline">C:\Projects\aurora&gt;</tspan><tspan fill="#E0E0E0"> cargo build</tspan></text>
    <text x="690" y="159" fill="#A8A8A8" xml:space="preserve">    Finished `release` profile</text>
    <text x="690" y="187" xml:space="preserve"><tspan fill="#A8A8A8">PS </tspan><tspan fill="#E0E0E0" text-decoration="underline">C:\Projects\aurora&gt;</tspan><tspan fill="#E0E0E0"> cargo test</tspan></text>
    <text x="690" y="215" fill="#FB7185">error: test failed</text>
    <text x="690" y="243" xml:space="preserve"><tspan fill="#A8A8A8">PS </tspan><tspan fill="#E0E0E0" text-decoration="underline">C:\Projects\aurora&gt;</tspan></text>
    <rect x="952.2" y="228" width="2.5" height="20" fill="#D4D4D4"/>
  </g>
</svg>
