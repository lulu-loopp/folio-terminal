[workspace]
# 3 is edition 2024's resolver: it takes rust-version into account when picking
# dependency versions, so a dep can't silently resolve to something our pinned
# toolchain can't build.
resolver = "3"
members = [
    "crates/bt-term",
    "crates/bt-transcript",
    "crates/bt-doc",
    "crates/bt-viewport",
    "crates/bt-detect",
    "crates/bt-layout",
    "crates/bt-math",
    "crates/bt-corpus",
    "crates/bt-pty",
    "crates/bt-platform",
    "crates/bt-persist",
    "crates/bt-unicode",
    "crates/bt-render",
    "crates/bt-winres",
    "crates/bt-app",
    "vendor/alacritty_terminal",
]

[workspace.package]
# **The version, and the only place it is written.** Four surfaces have to agree
# about it — `folio --version`, the `VERSIONINFO` block Explorer reads off
# `folio.exe`, the header of every panic log, and the header of `diagnostics.log`
# and each hang report — and all four derive from this line rather than repeating
# it: cargo turns it into `CARGO_PKG_VERSION`, `crates/bt-app/build.rs` turns
# that into the PE resource, and `bt_app::version` is the one module the other
# three read. `a_release_is_one_version_in_four_places` in that module is the
# gate; a second literal anywhere fails it.
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

# **None of these fifteen crates is a crates.io package.** They are one product
# cut into compilation units; `bt-math` and `bt-detect` would be squatting names
# that mean nothing outside this tree, and a `cargo publish` typed in the wrong
# directory is the only way any of them would ever get there. `vendor/` does not
# inherit this table, so this line says nothing about the two crates in it —
# republishing somebody else's package is a different mistake with a different
# guard.
#
# The repository field is deliberately absent until there is a repository to
# name. It goes here, once, with `repository.workspace = true` in each member.
publish = false

# Pinned here rather than left to whatever clippy happens to default to, so the
# same code gets the same verdict on every machine and in CI.
#
# Only lints the tree passes TODAY live here. CI runs -D warnings, so a "warn"
# entry is a deny wearing a disguise — there is no such thing as an advisory lint
# in this manifest. Lints we intend to adopt are staged in CONVENTIONS.md §8 with
# the cleanup each one needs first; they move here once that cleanup lands.
#
# Members must opt in with `[lints] workspace = true` — cargo does not inherit
# these automatically, and without that line this whole table is decoration.
# vendor/ deliberately does NOT opt in: it is upstream code held to upstream's
# choices, not ours.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
# exact: a 0.26.x release on crates.io would otherwise out-resolve the local
# 0.26.0 patch and quietly take our capture hooks out of the build
alacritty_terminal = "=0.26.0"
anyhow = "1"
base64 = "0.22"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.12"
# The glance card's first page (`bt_app::pdf::first_page`, §7.10 ⑥). It was
# **already in the lock file** transitively — `typst-svg` rasterises the PDFs a
# Typst document embeds with it — so naming it here costs no new package, which
# is `docs/DESIGN.md` §8's bar and the same one `regex`, `rayon` and `two-face`
# were admitted under.
#
# Exact, like every other pin in this table, and here for a reason of its own:
# hayro is young and moving fast, and what it produces is a *picture* — a 0.7.x
# that resolved on its own would change what the card draws, and what
# `the_shipped_fixture_rasters_its_first_page` measures, under a build nobody
# touched.
#
# **One feature on and one deliberately off**, which is what keeps "no new
# package" true:
#
# * `embed-fonts` carries the fourteen faces the PDF specification says every
#   reader already has. A page that names Helvetica without embedding it draws
#   its text as nothing without them, which is most of what a card would be
#   showing. It is 300KB of Foxit metric-compatible fonts inside the exe and it
#   pulls in nothing.
# * `embed-cmaps` is **off**: it carries Adobe's predefined CJK CMaps, and it
#   reaches them through brotli — four packages this lock file does not have. A
#   CJK page that embeds its own CMap (which is what every current producer
#   writes) is unaffected; one that names a predefined CMap instead will draw its
#   Latin and lose its CJK glyphs. Turn it on the day such a page turns up, and
#   accept the four packages then rather than on a guess.
hayro = { version = "=0.7.1", default-features = false, features = ["embed-fonts"] }
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
mitex = "=0.2.4"
mitex-spec-gen = "=0.2.4"
pollster = "0.4"
# Exact because a newer crates.io 0.9.x would otherwise out-resolve the local
# loader patch and silently drop BetterTerminal's strict ConPTY sidecar policy.
portable-pty = "=0.9.0"
# The transcript's pattern engine (§7.1.5d in-pane search, and the P1-2/P2-11/P3-4 consumers that
# inherit it). Already in the lock file transitively through syntect and two-face, so naming it here
# costs no new package. It is `regex` and deliberately not the `fancy-regex` those two run on:
# search needs no backreferences, and what it does need is the linear-time guarantee a backtracking
# engine cannot give — `(a+)+b` typed into the find bar must not be able to hang the window.
regex = "1"
# The picture lane's Lanczos3 resample, and nothing else in this workspace (see
# `bt_term::inline_image`). Already in the lock file transitively through
# `typst-library` and `typst-utils`, so naming it here costs no new package.
# The lane builds a pool of its own rather than using rayon's global one,
# because the pool it runs on has to stand in the background band and the global
# one belongs to the whole process — typst's layout included.
rayon = "1"
thiserror = "2"
# The user's own `~/.codex/config.toml`, which the attention block's codex
# installer adds one key to and must be able to hand back byte for byte
# (`attention_codex`). A format-preserving editor and not `toml` + a serializer:
# re-emitting a parsed document throws away every comment and every choice of
# layout the person who wrote it made, and this file is not ours. Already in the
# lock file transitively, so naming it here costs no new package.
toml_edit = "0.22"
resvg = { version = "=0.47.0", default-features = false, features = ["text"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The preview's syntax highlighter (§7.1.2 note ⑨). `default-features = false`
# on purpose: syntect's default backend is `onig`, which is a C library and a
# build-time toolchain this workspace does not have and does not want. The
# `regex-fancy` backend is pure Rust and the same grammars run on it.
#
# `default-syntaxes` is the Sublime grammar dump; there is deliberately **no**
# `default-themes`, because a colour theme is exactly the thing this window is
# not allowed to take from a library — every ink on this glass comes out of
# `ChromePalette`, and what syntect is asked for here is the *scope* of each
# span and nothing else.
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
# The grammars Sublime's default dump does not carry — TOML, TypeScript, TSX,
# Dockerfile and a hundred more (user ruling 2026-08-16: bundle them; a Rust
# project opens `Cargo.toml` every day). `two-face` is bat's curated syntax set
# behind syntect, and it was **already in this tree** through typst, on the same
# `syntect-fancy` backend, so naming it here costs no new package. Its
# `default-features = false` is the same refusal of onig as syntect's own line.
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
typst-as-lib = { version = "=0.16.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-layout = "=0.15.0"
typst-library = "=0.15.0"
typst-svg = "=0.15.0"
unicode-segmentation = "1"
unicode-script = "0.5.8"
unicode-properties = { version = "0.1", default-features = false, features = ["emoji", "general-category"] }
unicode-width = "0.2"
vte = "0.15"
wgpu = { version = "30.0.0", default-features = false, features = ["std", "dx12", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[profile.test]
opt-level = 1

# **The build people download.** Measured before it was written; the numbers are
# in `docs/DESIGN.md` §12.4 and the short version is here, because a profile
# table is exactly the place somebody adds a setting because it sounded good.
[profile.release]
# 77.45 MB → 72.62 MB, which is 4.8 MB off what a person waits for on a
# preview download, for about twice the release build time (11 → 20 minutes at
# `-j 4`). Paid once per tag by a machine; the download is paid by everybody.
#
# It costs nothing at startup, which is the thing worth checking rather than
# assuming: `folio --version` — the loader, the static initialisers and the
# front door, which is the whole of what a smaller image could have changed —
# is 53.5ms against 57.0ms at the median of 21 interleaved runs, and a whole
# window up is the same to within a noise band far wider than the difference.
lto = "fat"
codegen-units = 1
# **Deliberately no `strip`.** It was measured too, and on this target it is a
# no-op: `strip = "symbols"` produced a `folio.exe` of *exactly* the same size,
# because MSVC never put the symbols in the executable — they are in
# `folio.pdb` (6.06 MB), which the archive does not carry. A setting that
# changes nothing is not free; it is a line the next reader has to disprove.
#
# **And `panic` stays `unwind`**, which is the default and is written down
# because it is a decision. `abort` would save a little more, and it would take
# the panic hook with it — the log in `%TEMP%\folio-panic.log` and the message
# box that tells a user where to find it (`bt_app::version`, `docs/DESIGN.md`
# §12.6) both run *inside* the unwinding path. A preview whose crashes are
# silent is worse than a preview that is slightly larger.
panic = "unwind"

[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
portable-pty = { path = "vendor/conpty/portable-pty" }
