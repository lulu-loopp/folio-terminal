[workspace]
# 3 is edition 2024's resolver: it takes rust-version into account when picking
# dependency versions, so a dep can't silently resolve to something our pinned
# toolchain can't build.
resolver = "3"
members = [
    "crates/bt-term",
    "crates/bt-transcript",
    "crates/bt-doc",
    "crates/bt-viewport",
    "crates/bt-detect",
    "crates/bt-layout",
    "crates/bt-math",
    "crates/bt-corpus",
    "crates/bt-pty",
    "crates/bt-platform",
    "crates/bt-persist",
    "crates/bt-unicode",
    "crates/bt-render",
    "crates/bt-app",
    "vendor/alacritty_terminal",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

# Pinned here rather than left to whatever clippy happens to default to, so the
# same code gets the same verdict on every machine and in CI.
#
# Only lints the tree passes TODAY live here. CI runs -D warnings, so a "warn"
# entry is a deny wearing a disguise — there is no such thing as an advisory lint
# in this manifest. Lints we intend to adopt are staged in CONVENTIONS.md §8 with
# the cleanup each one needs first; they move here once that cleanup lands.
#
# Members must opt in with `[lints] workspace = true` — cargo does not inherit
# these automatically, and without that line this whole table is decoration.
# vendor/ deliberately does NOT opt in: it is upstream code held to upstream's
# choices, not ours.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
# exact: a 0.26.x release on crates.io would otherwise out-resolve the local
# 0.26.0 patch and quietly take our capture hooks out of the build
alacritty_terminal = "=0.26.0"
anyhow = "1"
base64 = "0.22"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.12"
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
mitex = "=0.2.4"
mitex-spec-gen = "=0.2.4"
pollster = "0.4"
# Exact because a newer crates.io 0.9.x would otherwise out-resolve the local
# loader patch and silently drop BetterTerminal's strict ConPTY sidecar policy.
portable-pty = "=0.9.0"
thiserror = "2"
resvg = { version = "=0.47.0", default-features = false, features = ["text"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst-as-lib = { version = "=0.16.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-layout = "=0.15.0"
typst-library = "=0.15.0"
typst-svg = "=0.15.0"
unicode-segmentation = "1"
unicode-properties = { version = "0.1", default-features = false, features = ["emoji"] }
unicode-width = "0.2"
vte = "0.15"
wgpu = { version = "30.0.0", default-features = false, features = ["std", "dx12", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[profile.test]
opt-level = 1

[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
portable-pty = { path = "vendor/conpty/portable-pty" }
