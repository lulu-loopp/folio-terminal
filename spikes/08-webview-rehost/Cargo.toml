[package]
name = "spike-webview-rehost"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace on purpose, exactly as `spikes/07-webview2` was: this is an
# experiment, it is not shipped, and it must not sit in the members list where
# the three gates would build it. It reaches into `crates/bt-platform` by path
# because the whole point is to measure **the code that ships** — a second copy
# of `put_ParentWindow` written here would prove something about this file.
[workspace]

[dependencies]
bt-platform = { path = "../../crates/bt-platform" }
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# DirectComposition and WebView2 are raw COM; a spike held to the workspace's
# `deny` could not make a window.
unsafe_code = "allow"
