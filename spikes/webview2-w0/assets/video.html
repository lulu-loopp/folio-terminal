<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>W0 moving-picture page</title>
<style>
  html, body { margin: 0; height: 100%; background: #101010; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!-- No file, no codec, no network: a canvas driven off requestAnimationFrame is
     the same thing gate 2 needs a decoded video for — a surface whose contents
     change every frame and which the compositor may or may not hand back to a
     capture. What it deliberately is NOT is a DRM-protected surface; that row
     of the matrix needs a licensed stream and is reported as untested rather
     than faked with a canvas. -->
<canvas id="canvas"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const context = canvas.getContext('2d');
  let frame = 0;
  const draw = () => {
    const { innerWidth: width, innerHeight: height } = window;
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width; canvas.height = height;
    }
    frame += 1;
    // A full-surface colour that changes every frame: two captures a frame apart
    // must differ, or the capture is handing back a stale composition.
    context.fillStyle = `hsl(${(frame * 7) % 360} 90% 45%)`;
    context.fillRect(0, 0, width, height);
    context.fillStyle = '#ffffff';
    context.font = '28px Consolas, monospace';
    context.fillText(`frame ${frame}`, 24, 48);
    window.chrome?.webview?.postMessage({ kind: 'frame', frame });
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
</script>
</body>
</html>
