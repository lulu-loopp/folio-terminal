[workspace]
resolver = "3"

[package]
name = "bt-spike-webview2-w0"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.39.1"
# `#[implement]` expands to code that names `::windows_core` directly, so the
# crate has to be in the dependency list even though every path in this probe
# goes through `windows::core`.
windows-core = "0.62.2"
wgpu = { version = "30.0.0", default-features = false, features = ["std", "dx12", "wgsl"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# This probe is nothing but raw COM: DirectComposition, WebView2, UI Automation
# and Windows.Graphics.Capture have no safe surface. The workspace-wide
# `unsafe_code = "deny"` would make the experiment impossible, exactly as the
# 2026-08-13 spike recorded. Nothing here is a dependency of any product crate.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
