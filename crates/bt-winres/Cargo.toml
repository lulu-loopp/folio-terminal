[package]
name = "bt-winres"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# No dependencies, and that is the whole point of the crate existing. What it
# does — turn an `.ico` and four numbers into the `.res` file `link.exe` embeds
# in `folio.exe` — is otherwise bought with `embed-resource` or `winres`, which
# between them add six packages to the lock file and, worse, make the build
# depend on finding `rc.exe` on the machine. The RES container and the
# `VS_VERSIONINFO` block are two documented layouts of about two hundred lines;
# `docs/DESIGN.md` §8's bar says a dependency has to be worth more than the code
# it replaces, and these are not.

[dependencies]
# **Optional, and off unless a caller asks for `inflate`** (T-INTEGRATION-INJECT-2-BUILD):
# `pinned::entry` takes one deflated entry out of a vendored package, which is what the
# two build scripts that read one (`bt-pty`'s ConPTY sidecar, `bt-app`'s PSReadLine) and
# the tests that hold them turn the feature on for. The macOS bundle script below
# compiles this crate with no feature and so still with no dependency at all. The crate
# is already in `Cargo.lock` through `flate2` and `png`, at this version, so the feature
# costs no new package.
miniz_oxide = { version = "=0.8.9", optional = true }

[features]
inflate = ["dep:miniz_oxide"]

# **The one thing in this workspace a shell script on the Mac has to be able to
# run.** M5-3's bundle script needs `Info.plist` with the workspace version in
# it before it can sign anything, and `cargo run -q -p bt-winres --bin
# render-info-plist` is a compilation of one dependency-free crate rather than
# of the whole window. Named here rather than left to `src/bin` autodiscovery so
# that the name the script types appears in a file somebody greps.
[[bin]]
name = "render-info-plist"
path = "src/bin/render-info-plist.rs"

[lints]
workspace = true
