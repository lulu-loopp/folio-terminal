[package]
name = "bt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The package keeps its `bt-` name and the binary carries the product's, which is
# the whole of the split: `bt-app` is what the other twelve crates in this
# workspace say when they mean this one, and `folio.exe` is what a person types,
# pins to a taskbar and sees in Task Manager. Declaring the target explicitly is
# the only way to have both — cargo names the binary after the package unless a
# `[[bin]]` says otherwise, and naming one target means naming its path too.
[[bin]]
name = "folio"
path = "src/main.rs"

# The icon and the `VERSIONINFO` block, plus the commit hash the diagnostic files
# carry. See `build.rs`.
[build-dependencies]
bt-winres = { path = "../bt-winres" }

[dependencies]
anyhow.workspace = true
bt-detect = { path = "../bt-detect" }
bt-doc = { path = "../bt-doc" }
bt-layout = { path = "../bt-layout" }
bt-math = { path = "../bt-math" }
bt-persist = { path = "../bt-persist" }
bt-platform = { path = "../bt-platform" }
bt-pty = { path = "../bt-pty" }
bt-render = { path = "../bt-render" }
bt-term = { path = "../bt-term" }
bt-transcript = { path = "../bt-transcript" }
bt-unicode = { path = "../bt-unicode" }
bt-viewport = { path = "../bt-viewport" }
# **The glance card's first page** (`pdf::first_page`, `docs/DESIGN.md` §7.10 ⑥).
# The pane draws a `.pdf` with WebView2's own engine and hands this process no
# pixels at all, so a card that wants to show the page has to raster one itself.
# See the workspace table for why this is hayro and not a pdfium binding.
hayro.workspace = true
# The one decoder this crate needs of its own: `ICoreWebView2::CapturePreview`
# hands a page's picture over as an encoded PNG and offers no other shape, so a
# focus card that draws a page has to decode one (W2 slice 6, `web_thumb`). The
# terminal's inline-image lane decodes on `bt-term`'s own worker and is keyed by
# file path; a page has no file.
image.workspace = true
pollster.workspace = true
syntect.workspace = true
two-face.workspace = true
winit.workspace = true
# **The attention block's two JSON documents, and neither of them is ours**
# (`attention_hooks`, `attention_wire`). One is the user's own
# `~/.claude/settings.json`, which this build adds a hook to and must hand back
# unharmed — a hand-rolled writer that reordered a key or dropped a comment-shaped
# string would be damaging a file somebody wrote. The other is the line that
# crosses the attention endpoint, which arrives from outside this process and is
# therefore the last thing that should meet a parser written here.
#
# It was already a dev-dependency and is already in the lock file, so this costs
# no new package — `docs/DESIGN.md` §8's bar, met by a dependency that was
# present and is now also compiled into the product.
serde_json.workspace = true
# **And the third document that is not ours**: `~/.codex/config.toml`
# (`attention_codex`). Same contract as the settings file above and a stronger
# reason for the crate chosen — TOML carries comments, and a round trip through
# a value model would silently delete every one of them.
toml_edit.workspace = true

# Tests only. This crate writes `session.json` through `bt-persist` and never
# touches that file's JSON itself — which is exactly why one test needs to: the
# promise that a restored session reads bytes the previous build could have
# written is a promise about the *file*, and a test that compared two Rust
# structs would go on passing through a field rename or a serde attribute that
# changed the shape.
[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
