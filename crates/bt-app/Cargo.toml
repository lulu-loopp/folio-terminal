[package]
name = "bt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The package keeps its `bt-` name and the binary carries the product's, which is
# the whole of the split: `bt-app` is what the other twelve crates in this
# workspace say when they mean this one, and `folio.exe` is what a person types,
# pins to a taskbar and sees in Task Manager. Declaring the target explicitly is
# the only way to have both — cargo names the binary after the package unless a
# `[[bin]]` says otherwise, and naming one target means naming its path too.
[[bin]]
name = "folio"
path = "src/main.rs"

# **The one target in this crate that owns the process's main thread** (M2-5).
# The Mac's glyph measurement runs a winit event loop, an event loop is the main
# thread's, and libtest does not hand a case that thread — M2-3 measured it, and
# `crates/bt-platform/tests/macos_sheet.rs` states the measurement at length.
# `harness = false` makes this file's own `main` the test, and that one really
# is the main thread. It costs an ordinary run nothing: without `BT_MAC_GUI` it
# prints one line and exits, and off macOS it has no body at all.
[[test]]
name = "macos_glyph_surface"
path = "tests/macos_glyph_surface.rs"
harness = false

# The icon and the `VERSIONINFO` block, plus the commit hash the diagnostic files
# carry, and — for a Windows target — the release manifest `folio.exe` carries of
# its own archive (`bt_winres::release_manifest`, 0.4.6 ticket U-9). See
# `build.rs`.
[build-dependencies]
bt-winres = { path = "../bt-winres" }

[dependencies]
anyhow.workspace = true
bt-detect = { path = "../bt-detect" }
bt-doc = { path = "../bt-doc" }
bt-layout = { path = "../bt-layout" }
bt-math = { path = "../bt-math" }
bt-persist = { path = "../bt-persist" }
bt-platform = { path = "../bt-platform" }
bt-pty = { path = "../bt-pty" }
bt-render = { path = "../bt-render" }
bt-term = { path = "../bt-term" }
bt-transcript = { path = "../bt-transcript" }
bt-unicode = { path = "../bt-unicode" }
# **SHA-256, and only it** (0.4.6 U-12): a start measures its own executable
# against the update's rescue copy with the one copy of the standard the
# workspace has, `bt_winres::digest` — a dependency-free first-party crate
# already this package's build dependency, so `folio.exe` gains no package.
# `version.rs`'s tests read its `plist` and `release_manifest` through it too.
bt-winres = { path = "../bt-winres" }
bt-viewport = { path = "../bt-viewport" }
# **The release manifest, SHA-256 and the zip records** (`update_archive`, 0.4.6
# ticket U-14). The updater's archive reader parses the manifest a new
# `folio.exe` carries with the grammar `build.rs` writes it with
# (`bt_winres::release_manifest`), hashes each member with the workspace's one
# SHA-256 (`bt_winres::digest`) and reads the archive's records through the one
# zip record layout (`bt_winres::zip`) `bt-pty`'s build script reads the ConPTY
# package with. The crate has no dependencies and was already this package's
# build and dev dependency, so it costs no package.
# **The archive's deflated members, inflated a bounded chunk at a time**
# (`update_archive`). Already in `Cargo.lock` through `flate2` and `png`, and
# already `bt-pty`'s build dependency at this version, so it costs no new
# package — `docs/DESIGN.md` §8's bar. Its streaming state is what lets the
# reader count the decompressor's actual output before every write.
miniz_oxide = "=0.8.9"
# **The attention ledger** (`docs/ARCHITECTURE.md` §12.1, D-57). This crate is
# its only dependent.
bt-workbench = { path = "../bt-workbench" }
# The GIF container itself, for the one thing `image` cannot do: hand back a
# decoder that crosses a thread, which is what streaming a long animation a ring
# at a time is built on (`animation`). See the workspace table.
gif.workspace = true
# **The glance card's first page** (`pdf::first_page`, `docs/DESIGN.md` §7.10 ⑥).
# The pane draws a `.pdf` with WebView2's own engine and hands this process no
# pixels at all, so a card that wants to show the page has to raster one itself.
# See the workspace table for why this is hayro and not a pdfium binding.
hayro.workspace = true
# The one decoder this crate needs of its own: `ICoreWebView2::CapturePreview`
# hands a page's picture over as an encoded PNG and offers no other shape, so a
# focus card that draws a page has to decode one (W2 slice 6, `web_thumb`). The
# terminal's inline-image lane decodes on `bt-term`'s own worker and is keyed by
# file path; a page has no file.
image.workspace = true
pollster.workspace = true
syntect.workspace = true
two-face.workspace = true
# **Which characters are punctuation**, and nothing else. CommonMark's
# left-/right-flanking rule for `*` and `_` (§6.2) is written over the
# Unicode P and S general categories, so a markdown line in Chinese — where
# every full stop and every bracket is a character no ASCII table knows — is
# read wrong by an emphasis pass that only classifies ASCII. The crate was
# already in the lock file for `bt-render`'s emoji query; this adds its
# second table.
unicode-properties.workspace = true
winit.workspace = true
# **The attention block's two JSON documents, and neither of them is ours**
# (`attention_hooks`, `attention_wire`). One is the user's own
# `~/.claude/settings.json`, which this build adds a hook to and must hand back
# unharmed — a hand-rolled writer that reordered a key or dropped a comment-shaped
# string would be damaging a file somebody wrote. The other is the line that
# crosses the attention endpoint, which arrives from outside this process and is
# therefore the last thing that should meet a parser written here.
#
# It was already a dev-dependency and is already in the lock file, so this costs
# no new package — `docs/DESIGN.md` §8's bar, met by a dependency that was
# present and is now also compiled into the product.
serde_json.workspace = true
# **The one field this build reads out of a release object** (`update`,
# `docs/DESIGN.md` §7.51). The answer to the update check is somebody else's
# JSON arriving from outside this process, and it is read into a struct with a
# `tag_name` in it and nothing else — so a response shaped like anything at all
# other than that is a parse failure, which is the silence this feature fails
# into. `serde_json::Value` would have made every one of those shapes a `None`
# indistinguishable from a missing key.
#
# Already in the lock file — `bt-persist` next door has carried it since the
# first settings file — so naming it here costs no new package, which is
# `docs/DESIGN.md` §8's bar.
serde.workspace = true
# **And the third document that is not ours**: `~/.codex/config.toml`
# (`attention_codex`). Same contract as the settings file above and a stronger
# reason for the crate chosen — TOML carries comments, and a round trip through
# a value model would silently delete every one of them.
toml_edit.workspace = true

# Tests only. This crate writes `session.json` through `bt-persist` and never
# touches that file's JSON itself — which is exactly why one test needs to: the
# promise that a restored session reads bytes the previous build could have
# written is a promise about the *file*, and a test that compared two Rust
# structs would go on passing through a field rename or a serde attribute that
# changed the shape.
[dev-dependencies]
# **The crate this package's guards ask about itself** — the mechanism of
# `docs/plans/bt-app-split-prep.md`. A guard that reads `include_str!("main.rs")`
# is bound to a file, and a fact that moves to a file beside it stops being read
# without a word; asking `bt-source` for an *item* is the binding that survives
# the move. Tests only, and `bt-source`'s own manifest says that nothing in
# `folio.exe` may ever depend on it.
bt-source = { path = "../bt-source" }
# Parse shipped source for the content-read guard; already in Cargo.lock.
syn = { version = "2", features = ["full", "visit"] }
# POSIX path literals are checked by an independent lexer already present in Cargo.lock.
shlex = "=2.0.1"
serde_json.workspace = true

# **Tests only, macOS only, and not one new package** (M2-5). The glyph
# measurement opens winit's own window — the product's window — and needs one
# thing winit does not expose: `-[NSWindow windowNumber]`, which is the only
# name `screencapture -l` answers to and therefore the only way the pixels a
# Metal swapchain presented can be read at all. Both crates are already in
# `Cargo.lock` and in `THIRD-PARTY-NOTICES.md` through `bt-platform`, which is
# `docs/DESIGN.md` §8's bar; what the features below buy is the generated
# bindings for the two classes this one file names.
#
# They are **dev**-dependencies and stay ones: `bt-app`'s own rule is that
# platform code lives behind `bt-platform`'s interface (the port plan's §4.1),
# and a window number a measurement reads is not the product reading one.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    # `-[NSView window]`, which is how the number is reached from the handle
    # winit hands over; `NSResponder`, because an `NSView` is one.
    "NSResponder",
    "NSView",
    # `-[NSWindow windowNumber]` itself.
    "NSWindow",
    # `CGFloat`, the type every AppKit rectangle is written in. Not a package.
    "objc2-core-foundation",
    "std",
] }

[lints]
workspace = true
