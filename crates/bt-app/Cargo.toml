[package]
name = "bt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The package keeps its `bt-` name and the binary carries the product's, which is
# the whole of the split: `bt-app` is what the other twelve crates in this
# workspace say when they mean this one, and `folio.exe` is what a person types,
# pins to a taskbar and sees in Task Manager. Declaring the target explicitly is
# the only way to have both — cargo names the binary after the package unless a
# `[[bin]]` says otherwise, and naming one target means naming its path too.
[[bin]]
name = "folio"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bt-doc = { path = "../bt-doc" }
bt-layout = { path = "../bt-layout" }
bt-math = { path = "../bt-math" }
bt-persist = { path = "../bt-persist" }
bt-platform = { path = "../bt-platform" }
bt-pty = { path = "../bt-pty" }
bt-render = { path = "../bt-render" }
bt-term = { path = "../bt-term" }
bt-transcript = { path = "../bt-transcript" }
bt-unicode = { path = "../bt-unicode" }
bt-viewport = { path = "../bt-viewport" }
pollster.workspace = true
syntect.workspace = true
winit.workspace = true

# Tests only. This crate writes `session.json` through `bt-persist` and never
# touches JSON itself — which is exactly why one test needs to: the promise that
# a restored session reads bytes the previous build could have written is a
# promise about the *file*, and a test that compared two Rust structs would go on
# passing through a field rename or a serde attribute that changed the shape.
[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
