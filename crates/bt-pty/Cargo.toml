[package]
name = "bt-pty"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bt-term = { path = "../bt-term" }
bt-transcript = { path = "../bt-transcript" }
portable-pty.workspace = true
thiserror.workspace = true

# `tests/` links against this crate and its dev-dependencies only, so the terminal
# an integration test has to put in front of a real ConPTY has to be named again
# here even though the library already depends on it.
[dev-dependencies]
bt-term = { path = "../bt-term" }

# The Unix child tests ask the kernel whether a pid is still in its table with `kill(pid, 0)`;
# `nix` is already in the tree through `portable-pty`, so this adds no package, and its
# safe `kill` keeps this crate free of `unsafe`, which the workspace denies.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.28", features = ["signal"] }

[lints]
workspace = true
