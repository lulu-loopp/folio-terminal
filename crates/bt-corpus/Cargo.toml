[package]
name = "bt-corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bt-detect = { path = "../bt-detect" }
bt-math = { path = "../bt-math" }
# The answers `bt-term` asks its host for (`install_host_answers`) and the door-ready resolver the
# replaying tools hand `bt_term::verify_path`: the desktop build's own, from the platform layer.
bt-platform = { path = "../bt-platform" }
bt-pty = { path = "../bt-pty" }
bt-render = { path = "../bt-render" }
bt-term = { path = "../bt-term" }
bt-transcript = { path = "../bt-transcript" }
bt-viewport = { path = "../bt-viewport" }
portable-pty.workspace = true
pollster.workspace = true
thiserror.workspace = true
vte.workspace = true
web-time.workspace = true

[dev-dependencies]
serde_json = "1"

# A developer probe, not a shipped program: it drives a real ConPTY and replays
# the bytes through a terminal, so it lives with the other tools rather than in
# `bt-pty`, whose transport owes terminal policy nothing.
[[bin]]
name = "bt-conpty-width-probe"
path = "src/bin/bt-conpty-width-probe.rs"

# The headless frame-by-frame replay of the formula pipeline: a session, its projection and the
# math and image lanes answered on one thread, printed per published frame.
[[bin]]
name = "bt-repaint-oracle"
path = "src/bin/bt-repaint-oracle.rs"

[[bin]]
name = "bt-record"
path = "src/bin/bt-record.rs"

[[bin]]
name = "bt-replay"
path = "src/bin/bt-replay.rs"

[[bin]]
name = "bt-zoom-perf"
path = "src/bin/bt-zoom-perf.rs"

[lints]
workspace = true
