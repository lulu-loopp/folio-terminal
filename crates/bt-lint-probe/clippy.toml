# **The lint probe's vocabulary** - generated by scripts/dev/generate-lint-probe.ps1 from the
# registry's # vocabulary (crates/bt-app/src/window_waits.tsv); edit the registry, never this
# file. The fifth file of the configuration fence (thread-door note, revisions (j)3 and (j)11.3):
# it is effective for this probe alone, never for a product crate.
disallowed-methods = [
    { path = "std::thread::sleep", reason = "waits for a duration" },
    { path = "std::thread::JoinHandle::join", reason = "waits for a thread to end" },
    { path = "std::sync::mpsc::Receiver::recv", reason = "waits for a message" },
    { path = "std::sync::mpsc::Receiver::recv_timeout", reason = "waits for a message, bounded" },
    { path = "std::sync::Condvar::wait", reason = "waits for a notification" },
    { path = "std::sync::Condvar::wait_timeout", reason = "waits for a notification, bounded" },
    { path = "std::fs::rename", reason = "the file system" },
    { path = "std::fs::write", reason = "the file system" },
    { path = "std::fs::copy", reason = "the file system" },
    { path = "std::fs::canonicalize", reason = "the file system" },
    { path = "std::fs::metadata", reason = "the file system" },
    { path = "std::fs::read_dir", reason = "the file system" },
    { path = "std::fs::create_dir_all", reason = "the file system" },
    { path = "std::fs::File::create", reason = "the file system" },
    { path = "std::fs::File::sync_data", reason = "the disk" },
    { path = "std::fs::File::sync_all", reason = "the disk" },
    { path = "std::io::Write::write_fmt", reason = "a write to a file (`writeln!`)" },
    { path = "std::process::Command::output", reason = "waits for a child process" },
    { path = "std::process::Command::status", reason = "waits for a child process" },
    { path = "std::process::Child::wait", reason = "waits for a child process" },
    { path = "portable_pty::Child::try_wait", reason = "counted by call site, does not wait" },
    { path = "pollster::block_on", reason = "an executor entry: waits for a future" },
    { path = "wgpu::Queue::submit", reason = "the GPU driver" },
    { path = "wgpu::Queue::present", reason = "the GPU driver and the compositor" },
    { path = "bt_render::GpuContext::open", reason = "a cross-crate entrance that waits inside" },
    { path = "bt_pty::PtySession::spawn_shell_in", reason = "a cross-crate entrance that waits inside" },
    { path = "bt_pty::PtySession::spawn_refreshed", reason = "a cross-crate entrance that waits inside after composing the fresh Windows block" },
    { path = "bt_pty::PtySession::resize", reason = "a cross-crate entrance that waits inside" },
    { path = "bt_pty::wait_for_retirements", reason = "a cross-crate entrance that waits inside" },
    { path = "bt_platform::keyboard_layout_shift_table", reason = "the worker-only keyboard-layout-table door: one registry read and one System32 DLL load, copied and freed before return" },
    { path = "windows::Win32::UI::Shell::ShellExecuteW", reason = "waits for the shell" },
    { path = "windows::Win32::UI::Shell::ShellExecuteExW", reason = "waits for the shell and its UAC surface" },
    { path = "windows::Win32::System::Threading::SetEvent", reason = "counted by call site, does not wait" },
    { path = "windows::Win32::Foundation::CloseHandle", reason = "counted by call site, does not wait" },
    { path = "libc::write", reason = "counted by call site, does not wait" },
    { path = "libc::close", reason = "counted by call site, does not wait" },
]
