    { path = "std::sync::Condvar::wait_while", reason = "waits for a notification until a predicate holds" },
    { path = "std::sync::Condvar::wait_timeout_while", reason = "waits for a notification until a predicate holds, bounded" },
    { path = "std::sync::mpsc::SyncSender::send", reason = "waits for room in a bounded channel" },
    { path = "std::sync::Barrier::wait", reason = "waits for the other threads to arrive" },
    { path = "std::thread::ScopedJoinHandle::join", reason = "waits for a scoped thread to end" },
