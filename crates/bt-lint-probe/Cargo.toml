# **The lint probe** (thread-door note 2026-09-26, revisions (j)4 and (j)11.2-(j)11.3).
#
# A development-only crate, never part of `folio.exe`: its one source file calls every entry of
# the registry's `# vocabulary` (`crates/bt-app/src/window_waits.tsv`) assigned to the target it
# is compiled for, one call per line, and its `clippy.toml` carries that vocabulary. Both files are
# generated by `scripts/dev/generate-lint-probe.ps1` and held equal to what it writes. CI's
# positive control runs `cargo clippy -p bt-lint-probe --all-targets -- --force-warn
# clippy::disallowed_methods` and requires one diagnostic per assigned entry, so a misspelled path
# or a wrong target assignment is red in a linted unit with the target's real dependencies.
#
# Its dependencies are exactly the crates the recipes name, at the versions `Cargo.lock` holds.
[package]
name = "bt-lint-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bt-pty = { path = "../bt-pty" }
bt-render = { path = "../bt-render" }
pollster.workspace = true
portable-pty.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# The recipes' foreign-function calls are `unsafe` blocks: a tool crate, outside the product's
# `unsafe_code = "deny"`. It takes no other lint table (the workspace's cannot be combined with a
# per-crate key).
[lints.rust]
unsafe_code = "allow"
