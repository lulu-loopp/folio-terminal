[package]
name = "bt-math"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The file-read ledger (`file_reads::opaque` around the system font scans).
bt-effects = { path = "../bt-effects" }
bt-doc = { path = "../bt-doc" }
mitex.workspace = true
mitex-lexer = "=0.2.4"
mitex-spec-gen.workspace = true
resvg.workspace = true
typst-as-lib.workspace = true
typst-layout.workspace = true
typst-library.workspace = true
typst-svg.workspace = true
# Already pinned transitively by Typst; parse emitted math without rewriting text literals.
typst-syntax = "=0.15.1"
web-time.workspace = true

# **The font policy, per target** (`docs/ARCHITECTURE.md`, bt-math). On the desktop the Typst book
# is typst-assets' seventeen faces followed by the machine's own (`MathEngine::new`). A browser has
# no machine fonts to scan and a download pays for every byte, so a wasm32 build compiles no face
# in and draws with exactly the faces its host hands `MathEngine::with_faces`; the wasm32 gate
# (`scripts/ci/check-wasm-lib.ps1`) refuses a wasm32 graph that turns typst-assets' fonts on.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
typst-as-lib = { workspace = true, features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }

[dev-dependencies]
# **The quiet door, for the stack-margin children** (plan row 74, 2026-10-30): the test module re-runs
# its own binary once per recursive shape, and every child process the workspace builds is built by
# `bt_platform::quiet_command` (`quiet_door_tests::no_command_is_built_outside_the_quiet_door`),
# test modules included. A dev-dependency is not a layer edge (`scripts/ci/check-crate-edges.ps1`),
# so the shipped graph keeps bt-math below bt-platform.
bt-platform = { path = "../bt-platform" }
# Every test's scratch name comes from one place (`bt_testpath`, T-TEST-HYGIENE-048).
bt-testpath = { path = "../bt-testpath" }
serde.workspace = true
serde_json.workspace = true
# The faces a test hands `MathEngine::with_faces`, read from the very crate the desktop build
# embeds them from. Already in the lock file at this version through typst, so no new package.
typst-assets = { version = "=0.15.1", features = ["fonts"] }

[lints]
workspace = true
