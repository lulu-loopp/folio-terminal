# **M4-2 adds one package, and it is the web engine** — `objc2-web-kit` 0.3.2,
# the same family and the same release as the seven crates above: generated from
# the same headers, in the same repository, against the same `objc2` 0.6.4. It is
# the one this port could not avoid. A `WKWebView` and its two delegate protocols
# are forty-odd selectors across a dozen classes, three of them taking completion
# blocks and two taking `NS_ENUM` return values; hand-declaring that against
# classes this crate does not own is forty unchecked selectors and four
# hand-written struct layouts, which is the case `docs/DESIGN.md` §8 puts a
# dependency on the other side of.
#
# **`Cargo.lock` gains exactly one package and no other line moves** — measured,
# not assumed: every crate the features below pull in (`bitflags`, `block2`,
# `objc2`, `objc2-app-kit`, `objc2-core-foundation`, `objc2-foundation`) was
# already resolved for this target. `objc2-javascript-core` is an *optional*
# dependency of this crate and no feature named here turns it on, so it does not
# resolve at all.
#
# Every class is a feature of its own name, as in every other row of this table:
# a missing one is an unresolved import rather than a silent absence.
objc2-web-kit = { version = "0.3", default-features = false, features = [
    # The three completion handlers this crate is handed — the two policy
    # decisions and the rule list compiler — and the three it passes. **Not a
    # package**: `block2` is already a dependency above.
    "block2",
    # macOS's half of the two delegate protocols: `createWebViewWithConfiguration:`,
    # the three JavaScript panels and the two permission methods are all
    # `#[cfg(target_os = "macos")]` inside this crate, and without this feature
    # the protocols compile with those methods left out. **Not a package** —
    # `objc2-app-kit` is the row below.
    "objc2-app-kit",
    # The page itself, its configuration, and the two preference objects the
    # `WEB_SETTINGS` walk reads and writes.
    "WKWebView",
    "WKWebViewConfiguration",
    "WKPreferences",
    "WKWebpagePreferences",
    # The third door: the compiled rule list, the store it is cached in, and the
    # controller it is attached to and swapped on.
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKUserContentController",
    # The first and second doors: the navigation delegate, the action and
    # response it is asked about, the frame that says whether an action is the
    # main one, and the navigation object every completion callback carries.
    "WKNavigationDelegate",
    "WKNavigationAction",
    "WKNavigationResponse",
    "WKFrameInfo",
    "WKNavigation",
    # The refusing half of the UI delegate: the window a page may not open, the
    # features it asked for, and the origin a permission is refused to.
    "WKUIDelegate",
    "WKWindowFeatures",
    "WKSecurityOrigin",
    # The cookie jar and the cache, keyed on the bundle identifier — §4.5's
    # question, and the reason the bundle is built from M1.
    "WKWebsiteDataStore",
    # Find in page: the one call, its two switches, and the result it answers
    # with — which says whether there was a match and never how many.
    "WKFindConfiguration",
    "WKFindResult",
    # `CGRect` and `CGFloat` — the frame a page's view is made at and the zoom it
    # is set to. Without this the initialiser and both zoom accessors are not
    # generated at all, which is an unresolved method rather than a silent
    # absence. **Not a package**: `objc2-core-foundation` 0.3.2 is a direct
    # dependency of this crate already.
    "objc2-core-foundation",
    "std",
