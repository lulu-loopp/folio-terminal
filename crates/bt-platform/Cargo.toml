[package]
name = "bt-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    # The three WinRT namespaces one desktop notification needs: the XML document
    # a toast is (`Data_Xml_Dom`), the handler its click arrives on
    # (`Foundation`), and the notifier that shows it (`UI_Notifications`). All
    # three are reachable from an unpackaged process — see `Notifier`, whose whole
    # registration is one `REG_SZ`.
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # `CreateFileW` and `CreateEventW` both take a `SECURITY_ATTRIBUTES`, which
    # is what pulls this one in; nothing here ever passes one.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # `AttachConsole` / `WriteConsoleW`: the only way a Windows program with no
    # console of its own can answer `--help` on the console that started it.
    "Win32_System_Console",
    "Win32_System_DataExchange",
    # `ReadDirectoryChangesW`'s three companions: the overlapped completion
    # (`Win32_System_IO`), and the events the watcher thread waits on and the
    # caller stops it with (`Win32_System_Threading`). See `DirWatch`.
    "Win32_System_IO",
    "Win32_System_Memory",
    # The Explorer verb: `RegCreateKeyExW`, `RegSetValueExW`, `RegQueryValueExW`
    # and `RegDeleteTreeW`, all against `HKEY_CURRENT_USER`. `RegCreateKeyExW`
    # also needs `Win32_Security` above, for the `SECURITY_ATTRIBUTES` it takes
    # and nothing here ever passes.
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    # `COMDLG_FILTERSPEC` and therefore `IFileDialog::SetFileTypes`, which is
    # what filters the picture chooser to the formats the decoder honours.
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# This crate is the deliberately narrow unsafe boundary for native Win32 APIs. All other
# first-party crates continue inheriting the workspace-wide `unsafe_code = "deny"` policy.
[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
