[package]
name = "bt-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# **The first dependencies this crate has ever had off Windows** (M1-9), and
# they are target-scoped so that a Linux build still links a `bt-platform` with
# no dependencies at all — `docs/plans/port/macos-plan-2026-09-12.md` §4.6, the
# rule the 0.5 remote server inherits.
#
# `objc2-app-kit` 0.3 gates every class behind a feature of its own name, so
# `NSPasteboard` is asked for by name and nothing else in AppKit is generated;
# a missing feature is an unresolved import rather than a silent absence
# (`docs/plans/port/probe-x6-cross-check-2026-09-12.md`, Probe A). The versions
# are the ones that probe resolved. `objc2` 0.6.4 and `objc2-foundation` 0.3.2
# were already in `Cargo.lock` through winit and wgpu, so the whole of what this
# edge adds to it is one package: `objc2-app-kit` 0.3.2.
#
# **M1-3 adds no package at all, only classes**: the window and screen backend
# (`src/macos_impl.rs`) names nine more AppKit classes and one more Foundation
# one, each turned on by its own feature. A feature is not a dependency — the
# crate is already in `Cargo.lock` and in `THIRD-PARTY-NOTICES.md` — and what it
# costs is the generated bindings for that class and nothing else. The
# `objc2-foundation` features a class needs come with it (`NSWindow` asks for
# `NSGeometry`, `NSDictionary` and the rest itself); the ones listed below are
# the ones this crate's own code *names*.
#
# **M2-1 adds no package either**, and this one is worth saying out loud because
# it names a crate that was not in the list before: `objc2-core-foundation`
# 0.3.2 is **already in `Cargo.lock`** and already in `THIRD-PARTY-NOTICES.md` —
# `objc2-foundation` pulls it in for `NSGeometry`, which is the same edge the
# `objc2-core-foundation` *feature* of `objc2-app-kit` above came through. Naming
# it directly moves nothing in the lock file; what it buys is the Core Foundation
# types the FSEvents arm is written in (`src/macos_watch.rs`), with their retain
# and release handled by `CFRetained` rather than by hand. FSEvents itself lives
# in **CoreServices**, which has no binding in this family and no crate in the
# lock file; its seven entry points are declared in that module, which is what
# this crate is for.
#
# **M2-3 adds one package, and it is the only one this port has added since
# M1-9.** The two choosers, the alert and the formula menu are four more AppKit
# classes and cost nothing — `NSOpenPanel` (with the two superclasses its own
# binding names, `NSSavePanel` and `NSPanel`), `NSAlert`, `NSMenu` and
# `NSMenuItem` are features of a crate already here. `block2` 0.6.2 is already
# in `Cargo.lock` too (winit carries it, and `objc2-app-kit` turns its own
# `block2` feature on for the one method that takes a completion handler), so
# naming it directly moves nothing either. The package is
# **`objc2-uniform-type-identifiers` 0.3.2**: `-[NSSavePanel
# setAllowedContentTypes:]` is typed in `UTType`, which is the modern spelling
# of the filter and the only one that is not deprecated, and 0.2.2 of the same
# crate — which is in the lock file already, through `objc2-ui-kit` — is built
# against `objc2` 0.5 and cannot hand a type to a panel bound against 0.6. The
# alternative was `-[NSSavePanel setAllowedFileTypes:]`, deprecated since macOS
# 12 and the one call in this file that would be written for a system older
# than the one Q4 fixed as the deployment target.
# **The one target in this workspace that owns the process's main thread**
# (M2-3). Everything AppKit is the main thread's, and libtest does not hand a
# case that thread: measured on this workspace's toolchain, a `#[test]` run with
# `--test-threads=1` still executes on a thread libtest spawned, where
# `MainThreadMarker::new()` is `None`. `harness = false` makes this file's own
# `main` the test, and that one really is the main thread. It costs an ordinary
# run nothing: without `BT_MAC_GUI` it prints one line and exits, and off macOS
# it has no body at all.
[[test]]
name = "macos_sheet"
path = "tests/macos_sheet.rs"
harness = false

# **The second target that owns the process's main thread** (M3-1), and it owns
# something `macos_sheet` does not: a **winit event loop**. The door this ticket
# adds hangs four selectors on the private delegate class winit registers, so a
# proof of it that did not build a winit event loop would be a proof about a
# class that does not exist. `harness = false` for the reason above, and for a
# second one — the exercise is a script over a real application (a reopen, an
# opened document, a quit) driven from inside its own run loop, which is a
# `main` rather than a set of cases.
#
# It costs an ordinary run nothing for `macos_sheet`'s reason with one word
# changed: the body runs only when this binary finds itself **inside a bundle**
# the launcher assembled, so a plain `cargo test -p bt-platform` — where it runs
# out of `target/debug/deps` — prints one line and exits, on every platform.
[[test]]
name = "macos_app_delegate"
path = "tests/macos_app_delegate.rs"
harness = false

# **The sixth target that owns the process's main thread** (M4-9), and it needs
# two things none of the others does: a **registered bundle**, because
# LaunchServices reads `NSServices` out of one and will not deliver to a binary
# it has never seen, and a **second bundle**, because X-4 measured that a
# Service sent from the receiving application's own executable is refused as a
# self-collision. This one file is both halves — `--send-service` makes it the
# sender — and the launcher puts it inside two `.app`s with two identifiers.
#
# `harness = false` for the reason above, and the gate is `macos_app_delegate`'s:
# the run that wants this is the run that is inside a `.app`, so a plain `cargo
# test -p bt-platform` prints one line and exits, on every platform.
[[test]]
name = "macos_services"
path = "tests/macos_services.rs"
harness = false

# **The second target that owns the process's main thread** (M4-1), and it is a
# second one rather than two more functions in the first because the two ask
# different things of the machine: `macos_sheet` puts a panel in front of a
# reader and waits, and this one builds a composition on a real window at
# backing scale 2 and reads the window server's own pixels back. Everything in
# the note above applies unchanged — `harness = false` because libtest does not
# hand a case the main thread, `BT_MAC_GUI` because these cases open windows,
# nothing at all off macOS.
[[test]]
name = "macos_compose"
path = "tests/macos_compose.rs"
harness = false

# **Another target that owns the process's main thread** (M3-2), and for the
# others' reason word for word: `NSApplication`, `NSMenu` and every key
# equivalent on the bar are AppKit's, and `bt_platform::menu::install` refuses
# off the main thread by design — so a `#[test]` could only ever assert its own
# refusal. It is a target of its own rather than another case in either of them
# because it is about a different thing and needs less than both: it opens no
# window, posts no key and builds no event loop — a menu bar is the
# application's, and a press is delivered by handing
# `-[NSMenu performKeyEquivalent:]` an `NSEvent` the file makes.
[[test]]
name = "macos_menu_bar"
path = "tests/macos_menu_bar.rs"
harness = false

# **The fourth target that owns the process's main thread** (M4-6), and its gate
# is `macos_app_delegate`'s rather than `macos_sheet`'s: the notification centre
# refuses a process with no bundle identifier, so the run that wants this one is
# the run that is **inside a `.app`**, and an ordinary `cargo test -p
# bt-platform` prints one line and exits on every platform. `harness = false`
# for the reason above — the delegate is set from the main thread and the Dock
# tile is written from it.
[[test]]
name = "macos_notifications"
path = "tests/macos_notifications.rs"
harness = false

# **The fourth target that owns the process's main thread** (M4-2), and it needs
# one thing none of the three above does: a **bundle identifier**.
# `+[WKWebsiteDataStore defaultDataStore]` is the application's own store and the
# identifier is what makes it the application's (plan §4.5), so a proof taken out
# of `target/debug/deps` would be a proof about a different store than the one the
# product uses. `harness = false` for `macos_sheet`'s reason — libtest does not
# hand a case the main thread — and the gate is `macos_app_delegate`'s rather than
# `BT_MAC_GUI`: `open` passes none of the shell's environment, so the thing that
# is already true of the run that wants this is that the binary is inside a
# `.app`. An ordinary `cargo test -p bt-platform` prints one line and exits, on
# every platform.
[[test]]
name = "macos_webview"
path = "tests/macos_webview.rs"
harness = false

# **The one target that owns the process's main thread for a reason that is not
# AppKit's** (M4-5, `docs/DESIGN.md` §13.35 ⑤). Nothing in it touches AppKit and
# it opens no window; what it needs the main thread for is that `AVPlayer`
# serializes its own state changes onto a dispatch queue its header says "by
# default … is the main queue", and **only a live main run loop drains that
# queue**. Measured on the venue machine: under libtest an `AVPlayerItem` stays
# `AVPlayerItemStatusUnknown` for ever, `play` sets the rate, `currentTime` never
# leaves zero and not one picture arrives.
#
# It is therefore the one `harness = false` target here with **no environment
# gate at all**: it runs on every `cargo test -p bt-platform`, on every platform,
# and it is the M4-5 proof on both arms. Running from one `main` also makes the
# process-wide engine ledger a statement about one case rather than about eight.
[[test]]
name = "video_playback"
path = "tests/video_playback.rs"
harness = false

# **The fifth target that owns the process's main thread** (M3-4), on
# `macos_sheet`'s gate rather than the notification centre's: what it needs is a
# window server and a desk to put a window on, not a bundle identifier. It is a
# file of its own rather than more cases in `macos_compose.rs` because the two
# need windows of different shapes — that one is borderless so that its capture
# is the content area, and this one is **titled**, which is the whole subject:
# AppKit constrains the frame of a window that has a title bar and constrains
# nothing about one that has not.
[[test]]
name = "macos_window_restore"
path = "tests/macos_window_restore.rs"
harness = false

# **M2-2 adds no package either**, and it is worth saying because it looks like
# it should: the process door (`src/handoff.rs`'s macOS arm) is `NSWorkspace`,
# which is already on, and the trash (`src/macos_files.rs`) is `NSFileManager`,
# `NSURL` and `NSError` — three Foundation classes the `NSWorkspace` feature
# already turns on for its own methods. They are named below anyway, because a
# feature that arrives by union is a feature nobody declared.
#
# **M2-4 adds one package, and it is the only one either ticket adds**:
# `objc2-core-text` 0.3.2, for the font enumeration in `src/macos_fonts.rs`.
# CoreText is the opposite case to M2-1's CoreServices — it *has* a binding in
# this family, from the same repository and the same release as the three crates
# above, generated from the same headers — so the choice was between one line in
# `Cargo.lock` and `THIRD-PARTY-NOTICES.md` and four hand-declared entry points
# whose returns are all `Copy`/`Create`, i.e. four retains and releases written
# by hand. `docs/DESIGN.md` §8's bar is that a dependency is a line somebody
# reads; this is that line. With `default-features = false` and the three
# feature sets its code names, the only crates it pulls are `bitflags` and
# `objc2-core-foundation`, both already in the lock file.
#
# **M4-4 turns one crate on that costs nothing and adds two that are compiled,
# and the two are one decision rather than two.**
#
# The free one first: `objc2-core-graphics` 0.3.2 is **already in `Cargo.lock`**,
# pulled in by `objc2-io-surface` under wgpu's Metal backend, so naming it moves
# nothing in the lock file. What it buys is the bitmap context the first frame's
# pixels are drawn into (`src/macos_video.rs`) — a `CGImage` is an opaque handle
# and the only supported way to read one is to draw it, which is one call rather
# than four hand-declared entry points with a retain and a release each.
#
# The two this crate *names* are `objc2-av-foundation` 0.3.2, where
# `AVAssetImageGenerator` is, and `objc2-core-media` 0.3.2, because the two
# methods that matter are typed in `CMTime` — the time a frame is asked for, and
# the tolerances that say the generator may not answer with a neighbouring key
# frame instead. Both are the same family and the same release as the five
# crates above: generated from the same headers, in the same repository, against
# the same `objc2` 0.6.4.
#
# **`Cargo.lock` gains five lines and the build gains two**, and both numbers
# are true, so this file states both. The three extra lines are
# `objc2-core-audio` 0.3.2, `objc2-core-audio-types` 0.3.2 and
# `objc2-core-video` 0.3.2: CoreMedia declares all three as **optional**
# dependencies, and no feature named here turns any of them on, so they resolve
# into the lock file and into nothing else. `scripts/generate-notices.ps1` says
# it in its own words — the attributed list gains the two that are linked, and
# those three appear under *In the lock file, not in any resolved build*, the
# section that exists so the two counts a reader might compare are reconciled
# rather than left as a gap.
#
# So **two packages compiled, from one repository and one release**, which is
# `docs/DESIGN.md` §8's bar. The alternative was hand-declaring
# `copyCGImageAtTime:actualTime:error:`, `tracksWithMediaType:` and `CMTime`
# against classes this crate does not own — unchecked selectors and a
# hand-written struct layout in place of a generated binding.
#
# **M4-10 adds no package either, and it is the cheapest edge in the port**: the
# update check's one `GET` is `NSURLSession`, which is *Foundation* — five more
# classes of a crate that is already here (`NSURLSession`, `NSURLRequest`,
# `NSURLResponse`, `NSData`, `NSOperation`) and `objc2-foundation`'s own
# `block2` feature, for the two completion handlers a session delegate is
# handed. **No package**, which is `docs/DESIGN.md` §8's bar and the same door
# `Win32_Networking_WinHttp` came through on the other platform: the one line
# `Cargo.lock` gains is `block2 0.6.2` appearing in `objc2-foundation`'s
# dependency list, a crate already in that file and already in
# `THIRD-PARTY-NOTICES.md`, which therefore does not move at all. A blocking
# Rust HTTP client is roughly forty packages once its TLS stack and its
# certificate store are counted.
#
# **M4-6 adds one package, `objc2-user-notifications` 0.3.2, and turns one
# AppKit feature on that costs nothing.**
#
# The package is the notification centre (`src/macos_notify.rs`):
# `UNUserNotificationCenter` with its authorization request and its delegate
# protocol, the mutable content a request is built out of, the request itself,
# the response a click arrives as, and the default sound. It is the same family
# and the same release as the crates above — generated from the same headers, in
# the same repository, against the same `objc2` 0.6.4 — and it is **already in
# `Cargo.lock`**, pulled in as an optional dependency of `objc2-ui-kit`, so what
# this edge really moves is one line in `THIRD-PARTY-NOTICES.md`: a crate that
# resolved into the lock file and into no build now resolves into this one.
# `docs/DESIGN.md` §8's bar is that a dependency is a line somebody reads; this
# is that line. The alternative was hand-declaring
# `+[UNUserNotificationCenter currentNotificationCenter]`, a protocol with two
# block-taking methods and a class built against it — unchecked selectors and
# two block signatures written by hand, for the one API in this port whose
# mistakes are Objective-C exceptions rather than wrong answers.
#
# It pulls **nothing new of its own**: `bitflags`, `block2` and
# `objc2-foundation` are all here already, and `objc2-core-location` — its one
# other optional dependency — stays off, because `default-features = false` and
# no feature named below asks for it.
#
# The free half: `NSDockTile` is a feature of `objc2-app-kit`, a dependency of
# long standing, and it is what `-[NSApplication dockTile]` answers with.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The completion handlers this crate passes to AppKit and to Foundation:
# `-[NSSavePanel beginSheetModalForWindow:completionHandler:]`, which is how a
# panel is a sheet on a window rather than a nested modal loop inside a winit
# callback (M2-3); and the two a `NSURLSessionDataDelegate` is handed — the
# redirect decision and the response disposition (M4-10).
block2 = "0.6"
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = [
    # `UTType` itself, and `+[UTType typeWithFilenameExtension:]` — the only
    # two names this crate reads out of the framework.
    "UTType",
] }
objc2-core-text = { version = "0.3", default-features = false, features = [
    # `CTFontCollectionCreateFromAvailableFonts` and
    # `CTFontCollectionCreateMatchingFontDescriptors` — the database and its
    # contents.
    "CTFontCollection",
    # `CTFontDescriptorCopyAttribute`, `kCTFontFamilyNameAttribute` and
    # `kCTFontTraitsAttribute` — one face's family and its traits dictionary.
    "CTFontDescriptor",
    # `kCTFontSymbolicTrait` and `kCTFontTraitMonoSpace`, which is the whole of
    # the filter.
    "CTFontTraits",
    "std",
] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    # M4-5: the player itself — `play`, `pause`, `seekToTime:`, `rate`,
    # `defaultRate`, `volume`, `muted`, `currentTime` and
    # `actionAtItemEnd` — which is the HTML5 media element one verb for one
    # verb, and the audio output this ticket never had to build.
    "AVPlayer",
    # M4-5: the item the player plays, its `status`, its `error`, its
    # `duration`, its `presentationSize`, the outputs hung on it, and the
    # notification it posts when it has played to its end.
    "AVPlayerItem",
    # M4-5: `AVPlayerItemVideoOutput` — the pull the pictures come out of, and
    # `hasNewPixelBufferForItemTime:` / `copyPixelBufferForItemTime:`, which are
    # the two calls that make a frame this window's rather than a layer's.
    "AVPlayerItemOutput",
    # M4-5: `AVAudioTimePitchAlgorithmTimeDomain`, which is what keeps a voice a
    # voice at one-and-a-half speed. macOS 12 and later default to it; named
    # because a default is not a decision anybody wrote down.
    "AVAudioProcessingSettings",
    # M4-5: the codes a failed item's `NSError` carries, so that "this machine
    # cannot open this file" and "this file is protected" are two sentences
    # rather than one number.
    "AVError",
    # M4-5: **a package, and one already in `Cargo.lock`** — see the note above
    # the table. `copyPixelBufferForItemTime:` answers a `CVPixelBuffer`, and
    # without this feature that method is not generated at all.
    "objc2-core-video",
    # M4-4: `AVURLAsset` — the file, opened — and the `AVAsset` it is one of,
    # whose declared length is what [`video::SEEK_FRACTION`] is a fraction of.
    "AVAsset",
    # M4-4: the generator itself, its `maximumSize`, its two tolerances, its
    # `appliesPreferredTrackTransform` and the one call that decodes.
    "AVAssetImageGenerator",
    # M4-4: the video track, for the pair the fact line prints — a frame's
    # `naturalSize` turned by its `preferredTransform`, which is the video's own
    # size and not the raster's.
    "AVAssetTrack",
    # M4-4: `AVMediaTypeVideo`, which is how the track above is asked for.
    "AVMediaFormat",
    # M4-4: `CMTime`, which every time in this framework is written in. **A
    # feature, and a package** — see the note above the table.
    "objc2-core-media",
    # M4-4: `CGImage`, which is what a generated frame comes back as. **A
    # feature and not a package**: `objc2-core-graphics` 0.3.2 is already in
    # `Cargo.lock`.
    "objc2-core-graphics",
    # M4-4: `CGSize` and `CGAffineTransform` — the cap the generator is given and
    # the turn a track asks its pixels be displayed with. Not a package either:
    # both live in `objc2-core-foundation`, which is named below in its own
    # right.
    "objc2-core-foundation",
    "std",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    # M4-4: the whole of what this crate reads out of CoreMedia — a time made
    # from a fraction of a declared length, and the zero tolerance that says the
    # generator may not answer with a neighbouring key frame instead.
    # M4-5 adds no feature here and reads three more things off the same type:
    # the playhead, the item's length, and the time a seek is asked for.
    "CMTime",
    "std",
] }
# **M4-5 names one more package and it is already in `Cargo.lock`** — it has been
# there since M4-4, under *In the lock file, not in any resolved build*, because
# CoreMedia declares `objc2-core-video` 0.3.2 optional and nothing turned it on.
# This ticket turns it on, so the crate moves out of that section of
# `THIRD-PARTY-NOTICES.md` and into the attributed list — 534 resolved packages
# become 535 and the 38 unreached become 37. **No new package**: the two lines
# `Cargo.lock` gains are its name appearing in this crate's dependency list and
# in `objc2-av-foundation`'s, and it is the same family and the same release as
# every objc2 crate above.
#
# What it buys is the six accessors a decoded frame is read through
# (`src/macos_player.rs`): the lock and unlock that make a buffer's base address
# legal to read, the width, the height, the **row stride** — which is padded to
# the decoder's alignment and is the whole reason that copy is row-wise — and the
# pixel format, checked rather than trusted. `objc2-av-foundation`'s own
# `objc2-core-video` feature is what generates
# `copyPixelBufferForItemTime:itemTimeForDisplay:` and turns on four of the five
# features below; `CVReturn` and `std` are this crate's own, because the lock and
# unlock answer one and this crate is not `no_std`.
objc2-core-video = { version = "0.3", default-features = false, features = [
    # `CVPixelBufferLockFlags`, which is how a read-only lock says so.
    "CVBase",
    # `CVBuffer`, which `CVPixelBuffer` is a name for, and the image buffer in
    # between.
    "CVBuffer",
    "CVImageBuffer",
    # The six accessors themselves, and `kCVPixelBufferPixelFormatTypeKey` —
    # the one key in the dictionary the output is created with.
    "CVPixelBuffer",
    # What the lock and the unlock answer. **Not turned on by
    # `objc2-av-foundation`**, which needs neither.
    "CVReturn",
    # The `Retained<CVPixelBuffer>` the player's output hands back: a CoreVideo
    # buffer is message-able in the Objective-C runtime, and this is the feature
    # that says so.
    "objc2",
    "std",
] }
# **M4-1 adds no package either, and the two rows below are the reason it is
# worth saying.** The `CALayer` composition (`src/macos_compose.rs`) names two
# crates this file has not named before, and **both are already in
# `Cargo.lock` and already in `THIRD-PARTY-NOTICES.md`**: `objc2-quartz-core`
# 0.3.2 arrives through wgpu's own Metal backend and through
# `raw-window-metal`, and `objc2-core-graphics` 0.3.2 arrives through
# `objc2-quartz-core` itself. Naming them directly moves not one line in either
# file — `docs/DESIGN.md` §8's bar — and it is the same door
# `objc2-core-foundation` came through in M2-1. What it buys is the two
# statements this arm is: a page's floor is a layer's background colour, and
# nothing it does animates.
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    # `-[CALayer setBackgroundColor:]`, which is a page's floor, and the
    # `sublayers` pair M1-4's `clear_surface_layers` already reaches through
    # `objc2-app-kit`'s own feature of this crate's name.
    "CALayer",
    # `CATransaction`'s `begin` / `setDisableActions:` / `commit` — the one
    # scope in which a frame can be written without CoreAnimation animating it.
    "CATransaction",
    # The feature that generates `setBackgroundColor:` at all: without it
    # `CALayer` is compiled with every `CGColor`-typed method left out, which is
    # an unresolved method rather than a silent absence.
    "objc2-core-graphics",
    # And the same door one type over: `-[CALayer setFrame:]` is typed in
    # `CGRect` and `-[CALayer setContentsScale:]` in `CGFloat`, so without this
    # a `CALayer` has no settable geometry at all. `tests/macos_compose.rs` is
    # what lays a layer out by hand — it stands a frame where wgpu's
    # `CAMetalLayer` would be — and **not a package**: `objc2-core-foundation`
    # 0.3.2 is a direct dependency of this crate already, three rows down.
    "objc2-core-foundation",
    "std",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    # M4-4: the frame the generator hands back, and the width and height it
    # really came out at — read off the image rather than assumed from the ask,
    # for the reason the Windows arm reads its media type back.
    "CGImage",
    # M4-4: the one call that turns an opaque `CGImage` into bytes.
    "CGContext",
    "CGBitmapContext",
    # M4-4: sRGB by name, which is the colour space every other picture in this
    # window reaches the renderer in.
    "CGColorSpace",
    # `CGColorCreateSRGB` and nothing else. **sRGB by name**: X-1 measured that
    # CoreAnimation blends on the encoded bytes rather than in linear light, so
    # the numbers `bt-render` computed have to be handed over in the space they
    # were computed in — a generic or device space would be a second encoding of
    # the same colour.
    "CGColor",
    # M3-4: `CGDirectDisplayID`, which is the type a display number is, and
