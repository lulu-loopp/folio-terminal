    "Win32_System_ProcessStatus",
    # The Explorer verb: `RegCreateKeyExW`, `RegSetValueExW`, `RegQueryValueExW`
    # and `RegDeleteTreeW`, all against `HKEY_CURRENT_USER`. `RegCreateKeyExW`
    # also needs `Win32_Security` above, for the `SECURITY_ATTRIBUTES` it takes
    # and nothing here ever passes.
    "Win32_System_Registry",
    "Win32_System_Threading",
    # `OSVERSIONINFOW`, which is the only thing `RtlGetVersion` below writes
    # into.
    "Win32_System_SystemInformation",
    # The `PROPVARIANT` conversions `IMFSourceReader::GetPresentationAttribute`
    # and `SetCurrentPosition` are typed in terms of: a video's declared length
    # comes back as one and its seek target goes in as one. The generated
    # bindings for both methods are gated on this namespace *and* on
    # `Win32_System_Com_StructuredStorage` above, which was already here for the
    # memory stream a page's thumbnail is captured into.
    "Win32_System_Variant",
    # `RtlGetVersion` — the build number the compatibility shims do not touch.
    # `GetVersionExW` answers "Windows 8" for a process with no application
    # manifest, and `folio.exe` has none; this decides whether the machine has a
    # first-page context menu at all (`src/msix.rs`).
    "Wdk_System_SystemServices",
    "Win32_UI_HiDpi",
    # `ImmGetContext` / `ImmNotifyIME` / `ImmReleaseContext`: the one call that
    # ends a composition the field it was typed into no longer exists for
    # (`cancel_composition`, DESIGN §7.1.5a″). A **feature**, not a package —
    # `windows` is already in the lock file, so turning the namespace on adds
    # not one line to it or to `THIRD-PARTY-NOTICES.md`, which is
    # `docs/DESIGN.md` §8's bar.
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    # `COMDLG_FILTERSPEC` and therefore `IFileDialog::SetFileTypes`, which is
    # what filters the picture chooser to the formats the decoder honours.
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# **M3-7 adds one line and no package, and it is the first dependency this crate
# has that a Linux build also links.** `dup2` is the whole of the stdio door —
# moving `stdout` and `stderr` onto a log file, or onto `/dev/null`, for the rest
# of a run — and Rust's standard library has no spelling for it: `std::os::fd`
# owns descriptors and never renumbers one. `libc` 0.2.186 is **already in
# `Cargo.lock`** and already in `THIRD-PARTY-NOTICES.md` (winit, wgpu and
# `portable-pty` all carry it), so naming it here moves neither file's contents;
# what it costs is the declaration below.
#
# `cfg(unix)` and not `cfg(target_os = "macos")`, because the three calls this
# crate makes — `dup`, `dup2` and `close` — are POSIX and are the same two
# sentences on a Mac and on the Linux server §4.6 of the plan keeps possible. The
# arm that uses them is `portable_impl`'s own `#[cfg(unix)]` pair, beside the one
# `same_file` already has.
#
# `nix` was the other candidate and is already a `bt-pty` dev-dependency. It was
# not taken: its `dup2` is typed in `OwnedFd`/`BorrowedFd` and would have this
# crate constructing an `OwnedFd` for descriptor 1 — a value whose `Drop` closes
# the process's own standard output — to hand to a call that is defined as *not*
# taking ownership of it. The raw call says what is happening; the safe wrapper
# would need a `ManuallyDrop` around every argument to mean the same thing.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# This crate is the deliberately narrow unsafe boundary for native Win32 APIs. All other
# first-party crates continue inheriting the workspace-wide `unsafe_code = "deny"` policy.
[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
