[package]
name = "bt-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

# This crate is the deliberately narrow unsafe boundary for native presentation APIs. All other
# first-party crates continue inheriting the workspace-wide `unsafe_code = "deny"` policy.
[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
