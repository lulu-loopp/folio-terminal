[package]
name = "bt-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # `CreateFileW` and `CreateEventW` both take a `SECURITY_ATTRIBUTES`, which
    # is what pulls this one in; nothing here ever passes one.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    # `ReadDirectoryChangesW`'s three companions: the overlapped completion
    # (`Win32_System_IO`), and the events the watcher thread waits on and the
    # caller stops it with (`Win32_System_Threading`). See `DirWatch`.
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# This crate is the deliberately narrow unsafe boundary for native Win32 APIs. All other
# first-party crates continue inheriting the workspace-wide `unsafe_code = "deny"` policy.
[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
