[package]
name = "bt-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# **The first dependencies this crate has ever had off Windows** (M1-9), and
# they are target-scoped so that a Linux build still links a `bt-platform` with
# no dependencies at all — `docs/plans/port/macos-plan-2026-09-12.md` §4.6, the
# rule the 0.5 remote server inherits.
#
# `objc2-app-kit` 0.3 gates every class behind a feature of its own name, so
# `NSPasteboard` is asked for by name and nothing else in AppKit is generated;
# a missing feature is an unresolved import rather than a silent absence
# (`docs/plans/port/probe-x6-cross-check-2026-09-12.md`, Probe A). The versions
# are the ones that probe resolved. `objc2` 0.6.4 and `objc2-foundation` 0.3.2
# were already in `Cargo.lock` through winit and wgpu, so the whole of what this
# edge adds to it is one package: `objc2-app-kit` 0.3.2.
#
# **M1-3 adds no package at all, only classes**: the window and screen backend
# (`src/macos_impl.rs`) names nine more AppKit classes and one more Foundation
# one, each turned on by its own feature. A feature is not a dependency — the
# crate is already in `Cargo.lock` and in `THIRD-PARTY-NOTICES.md` — and what it
# costs is the generated bindings for that class and nothing else. The
# `objc2-foundation` features a class needs come with it (`NSWindow` asks for
# `NSGeometry`, `NSDictionary` and the rest itself); the ones listed below are
# the ones this crate's own code *names*.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    # The appearance a window and the application wear — light or dark, read
    # for the theme and stated for the chrome (`set_window_dark_mode`,
    # `system_uses_light_apps`).
    "NSAppearance",
    # `NSApp` itself: the application's effective appearance, and the window a
    # window number belongs to.
    "NSApplication",
    # M3-3: `-[NSWindow standardWindowButton:]` answers an `NSButton`, and an
    # `NSButton` is an `NSControl`. Two classes and no package — what the
    # traffic-light inset is measured off.
    "NSButton",
    "NSControl",
    # The window's backing colour, which is the class brush's twin.
    "NSColor",
    # `+[NSEvent mouseLocation]` — where the pointer is, for the summon.
    "NSEvent",
    "NSPasteboard",
    # `NSResponder`, because a window is one and `makeFirstResponder:` takes
    # one; `NSView`, because that is what a `NativeWindow` holds.
    "NSResponder",
    # The displays: their frames, their work areas, their backing scales and
    # their identities.
    "NSScreen",
    "NSView",
    # The window itself — the whole of the geometry group.
    "NSWindow",
    # Reduce Motion, and the notification that says it moved.
    "NSAccessibility",
    "NSWorkspace",
    # A screen's device description, which is where its `CGDirectDisplayID` is.
    "NSGraphics",
    # `CGFloat` — the type every backing scale and every rectangle in AppKit is
    # written in. **Not a package**: `objc2-core-foundation` 0.3.2 is already in
    # `Cargo.lock`, pulled in by `objc2-foundation`'s own `NSGeometry`, and this
    # feature only turns on the AppKit methods that are typed in terms of it.
    "objc2-core-foundation",
    "std",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    # The array of screens and the array of preferred languages.
    "NSArray",
    # The change dictionary a KVO callback is handed, and a screen's device
    # description.
    "NSDictionary",
    # The appearance is observed rather than polled.
    "NSKeyValueObserving",
    # `NSLocale.preferredLanguages` — the language the system is read in.
    "NSLocale",
    # The notification an accessibility-display change arrives as.
    "NSNotification",
    "NSString",
    # `NSNumber`, which is what `NSScreenNumber` comes back as.
    "NSValue",
    "std",
] }

[target.'cfg(windows)'.dependencies]
# One spelling of "a path as a `file:` URI", shared with every other place this
# workspace writes one (`bt_transcript::paths::local_path_to_file_uri`). It is
# here for `src/msix.rs`, where the package location crosses into the deployment
# API as a URI: a second, hand-rolled encoder is where a folder with a `#`, a
# `?` or a `%` in its name becomes a registration that names a different folder
# — R2-11, and the reason this edge exists at all. The crate is portable, has
# `bt-unicode` as its only dependency of its own, and both are already in this
# build.
bt-transcript = { path = "../bt-transcript" }
# The web preview's engine (`src/webview.rs`). It is a thin, generated binding
# over the WebView2 SDK's COM interfaces on top of the same `windows` 0.62 this
# crate already carries — three new packages (`webview2-com`,
# `webview2-com-macros`, `webview2-com-sys`) and no second copy of anything.
webview2-com = "0.39.1"
# `#[implement]` in `webview2-com`'s generated callbacks expands to code that
# names `::windows_core` directly, so the crate has to be in the dependency list
# even though every path this crate writes goes through `windows::core`.
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    # `Package.Id.FullName` and `Package.EffectiveExternalPath`: what a
    # registration of `packaging/msix/AppxManifest.xml` is called, and which
    # folder it points its content at. See `src/msix.rs`.
    "ApplicationModel",
    # The three WinRT namespaces one desktop notification needs: the XML document
    # a toast is (`Data_Xml_Dom`), the handler its click arrives on
    # (`Foundation`), and the notifier that shows it (`UI_Notifications`). All
    # three are reachable from an unpackaged process — see `Notifier`, whose whole
    # registration is one `REG_SZ`.
    "Data_Xml_Dom",
    "Foundation",
    # Iterating what `PackageManager` finds. A **feature**, not a package:
    # `windows-collections` and `windows-future` are already unconditional
    # dependencies of `windows`, so neither `Cargo.lock` nor
    # `THIRD-PARTY-NOTICES.md` gains a line — DESIGN §8's bar, and the same door
    # `Win32_Networking_WinHttp` came through.
    "Foundation_Collections",
    # `PackageManager` and `AddPackageOptions`: registering the sparse package
    # that puts Folio on Windows 11's first-page right-click menu, with the
    # external location that says where `folio.exe` actually is.
    "Management_Deployment",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Globalization",
    # `WinHttpOpen` and the eight calls beside it: the update check's one `GET`
    # (`src/http.rs`, DESIGN §7.51). A **feature**, not a package — `windows` is
    # already here, so turning the namespace on adds not one line to
    # `Cargo.lock` or to `THIRD-PARTY-NOTICES.md`, which is `docs/DESIGN.md`
    # §8's bar and the same door `Win32_Media_MediaFoundation` below came
    # through. What it buys is the operating system's own TLS, certificate
    # store and proxy configuration — including the PAC file a managed laptop
    # is handed — rather than a Rust HTTP client and the forty packages its own
    # trust store arrives with.
    "Win32_Networking_WinHttp",
    # `IMFSourceReader` and the platform under it: the first frame of a video,
    # for the hover card and the preview pane (`src/video.rs`, DESIGN §7.23).
    # This is a **feature**, not a package — `windows` is already in the lock
    # file, so turning the namespace on adds not one line to it, which is
    # `docs/DESIGN.md` §8's bar and the same door `hayro` and `serde_json` came
    # through. What it costs is a batch of generated bindings at compile time.
    "Win32_Media_MediaFoundation",
    # The four that let the composition device rasterize **one** thing: the
    # 1×1 premultiplied surface every web pane's ground is scaled out of
    # (`page_ground`). A composition device built on a null rendering device
    # cannot create surfaces at all, so the ground goes through
    # `CreateSurfaceFactory`, which takes a rendering device of its own — a
    # D3D11 one, because that is the only kind `IDXGIDevice` comes on and
    # `Direct2D` is a second stack for a call `ClearView` already makes.
    # `Direct2D_Common` is here for `D2D_MATRIX_3X2_F` alone, which is the type
    # `IDCompositionVisual::SetTransform` takes.
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # `CreateFileW` and `CreateEventW` both take a `SECURITY_ATTRIBUTES`, which
    # is what pulls this one in. The attention endpoint is the one caller that
    # actually passes one: `GetTokenInformation` / `TOKEN_GROUPS` (this
    # namespace) find the logon SID, and `Win32_Security_Authorization` below
    # turns it into the descriptor. See `src/attention_pipe.rs` for why a
    # default descriptor is not an option there.
    "Win32_Security",
    # `ConvertStringSecurityDescriptorToSecurityDescriptorW` and
    # `ConvertSidToStringSidW`: SDDL in, kernel descriptor out.
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # `CreateStreamOnHGlobal`: the buffer `ICoreWebView2::CapturePreview` writes
    # a page's picture into (W2 slice 6). A memory stream and not a file, because
    # a thumbnail routed through the disk would be measuring the disk.
    "Win32_System_Com_StructuredStorage",
    # `AttachConsole` / `WriteConsoleW`: the only way a Windows program with no
    # console of its own can answer `--help` on the console that started it.
    "Win32_System_Console",
    "Win32_System_DataExchange",
    # `GetThreadContext` and `ReadProcessMemory`: the two kernel calls the hang
    # reporter makes while the window thread is suspended (`src/hang.rs`). The
    # namespace is called `Diagnostics::Debug` because a debugger is the other
    # thing that makes them; nothing here attaches to anything.
    "Win32_System_Diagnostics_Debug",
    # `GetThreadContext` alone, which the `windows` crate files under `Kernel`
    # even though it sits beside `ReadProcessMemory` in `Diagnostics::Debug`.
    "Win32_System_Kernel",
    # `ReadDirectoryChangesW`'s three companions: the overlapped completion
    # (`Win32_System_IO`), and the events the watcher thread waits on and the
    # caller stops it with (`Win32_System_Threading`). See `DirWatch`.
    "Win32_System_IO",
    "Win32_System_Memory",
    # `CreateNamedPipeW` / `ConnectNamedPipe` / `DisconnectNamedPipe` /
    # `WaitNamedPipeW`: the attention endpoint and the `folio attention` verb's
    # two ends.
    "Win32_System_Pipes",
    # `EnumProcessModulesEx` / `GetModuleInformation` / `GetModuleBaseNameW`:
    # the module map that turns a raw return address into `folio.exe+0x…`. Built
    # before the suspend, because it takes the loader lock — see `src/hang.rs`.
    "Win32_System_ProcessStatus",
    # The Explorer verb: `RegCreateKeyExW`, `RegSetValueExW`, `RegQueryValueExW`
    # and `RegDeleteTreeW`, all against `HKEY_CURRENT_USER`. `RegCreateKeyExW`
    # also needs `Win32_Security` above, for the `SECURITY_ATTRIBUTES` it takes
    # and nothing here ever passes.
    "Win32_System_Registry",
    "Win32_System_Threading",
    # `OSVERSIONINFOW`, which is the only thing `RtlGetVersion` below writes
    # into.
    "Win32_System_SystemInformation",
    # The `PROPVARIANT` conversions `IMFSourceReader::GetPresentationAttribute`
    # and `SetCurrentPosition` are typed in terms of: a video's declared length
    # comes back as one and its seek target goes in as one. The generated
    # bindings for both methods are gated on this namespace *and* on
    # `Win32_System_Com_StructuredStorage` above, which was already here for the
    # memory stream a page's thumbnail is captured into.
    "Win32_System_Variant",
    # `RtlGetVersion` — the build number the compatibility shims do not touch.
    # `GetVersionExW` answers "Windows 8" for a process with no application
    # manifest, and `folio.exe` has none; this decides whether the machine has a
    # first-page context menu at all (`src/msix.rs`).
    "Wdk_System_SystemServices",
    "Win32_UI_HiDpi",
    # `ImmGetContext` / `ImmNotifyIME` / `ImmReleaseContext`: the one call that
    # ends a composition the field it was typed into no longer exists for
    # (`cancel_composition`, DESIGN §7.1.5a″). A **feature**, not a package —
    # `windows` is already in the lock file, so turning the namespace on adds
    # not one line to it or to `THIRD-PARTY-NOTICES.md`, which is
    # `docs/DESIGN.md` §8's bar.
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    # `COMDLG_FILTERSPEC` and therefore `IFileDialog::SetFileTypes`, which is
    # what filters the picture chooser to the formats the decoder honours.
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# This crate is the deliberately narrow unsafe boundary for native Win32 APIs. All other
# first-party crates continue inheriting the workspace-wide `unsafe_code = "deny"` policy.
[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
