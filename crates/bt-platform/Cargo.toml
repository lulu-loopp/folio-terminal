[package]
name = "bt-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# **The first dependencies this crate has ever had off Windows** (M1-9), and
# they are target-scoped so that a Linux build still links a `bt-platform` with
# no dependencies at all — `docs/plans/port/macos-plan-2026-09-12.md` §4.6, the
# rule the 0.5 remote server inherits.
#
# `objc2-app-kit` 0.3 gates every class behind a feature of its own name, so
# `NSPasteboard` is asked for by name and nothing else in AppKit is generated;
# a missing feature is an unresolved import rather than a silent absence
# (`docs/plans/port/probe-x6-cross-check-2026-09-12.md`, Probe A). The versions
# are the ones that probe resolved. `objc2` 0.6.4 and `objc2-foundation` 0.3.2
# were already in `Cargo.lock` through winit and wgpu, so the whole of what this
# edge adds to it is one package: `objc2-app-kit` 0.3.2.
#
# **M1-3 adds no package at all, only classes**: the window and screen backend
# (`src/macos_impl.rs`) names nine more AppKit classes and one more Foundation
# one, each turned on by its own feature. A feature is not a dependency — the
# crate is already in `Cargo.lock` and in `THIRD-PARTY-NOTICES.md` — and what it
# costs is the generated bindings for that class and nothing else. The
# `objc2-foundation` features a class needs come with it (`NSWindow` asks for
# `NSGeometry`, `NSDictionary` and the rest itself); the ones listed below are
# the ones this crate's own code *names*.
#
# **M2-1 adds no package either**, and this one is worth saying out loud because
# it names a crate that was not in the list before: `objc2-core-foundation`
# 0.3.2 is **already in `Cargo.lock`** and already in `THIRD-PARTY-NOTICES.md` —
# `objc2-foundation` pulls it in for `NSGeometry`, which is the same edge the
# `objc2-core-foundation` *feature* of `objc2-app-kit` above came through. Naming
# it directly moves nothing in the lock file; what it buys is the Core Foundation
# types the FSEvents arm is written in (`src/macos_watch.rs`), with their retain
# and release handled by `CFRetained` rather than by hand. FSEvents itself lives
# in **CoreServices**, which has no binding in this family and no crate in the
# lock file; its seven entry points are declared in that module, which is what
# this crate is for.
#
# **M2-3 adds one package, and it is the only one this port has added since
# M1-9.** The two choosers, the alert and the formula menu are four more AppKit
# classes and cost nothing — `NSOpenPanel` (with the two superclasses its own
# binding names, `NSSavePanel` and `NSPanel`), `NSAlert`, `NSMenu` and
# `NSMenuItem` are features of a crate already here. `block2` 0.6.2 is already
# in `Cargo.lock` too (winit carries it, and `objc2-app-kit` turns its own
# `block2` feature on for the one method that takes a completion handler), so
# naming it directly moves nothing either. The package is
# **`objc2-uniform-type-identifiers` 0.3.2**: `-[NSSavePanel
# setAllowedContentTypes:]` is typed in `UTType`, which is the modern spelling
# of the filter and the only one that is not deprecated, and 0.2.2 of the same
# crate — which is in the lock file already, through `objc2-ui-kit` — is built
# against `objc2` 0.5 and cannot hand a type to a panel bound against 0.6. The
# alternative was `-[NSSavePanel setAllowedFileTypes:]`, deprecated since macOS
# 12 and the one call in this file that would be written for a system older
# than the one Q4 fixed as the deployment target.
# **The one target in this workspace that owns the process's main thread**
# (M2-3). Everything AppKit is the main thread's, and libtest does not hand a
# case that thread: measured on this workspace's toolchain, a `#[test]` run with
# `--test-threads=1` still executes on a thread libtest spawned, where
# `MainThreadMarker::new()` is `None`. `harness = false` makes this file's own
# `main` the test, and that one really is the main thread. It costs an ordinary
# run nothing: without `BT_MAC_GUI` it prints one line and exits, and off macOS
# it has no body at all.
[[test]]
name = "macos_sheet"
path = "tests/macos_sheet.rs"
harness = false

# **The second target that owns the process's main thread** (M3-1), and it owns
# something `macos_sheet` does not: a **winit event loop**. The door this ticket
# adds hangs four selectors on the private delegate class winit registers, so a
# proof of it that did not build a winit event loop would be a proof about a
# class that does not exist. `harness = false` for the reason above, and for a
# second one — the exercise is a script over a real application (a reopen, an
# opened document, a quit) driven from inside its own run loop, which is a
# `main` rather than a set of cases.
#
# It costs an ordinary run nothing for `macos_sheet`'s reason with one word
# changed: the body runs only when this binary finds itself **inside a bundle**
# the launcher assembled, so a plain `cargo test -p bt-platform` — where it runs
# out of `target/debug/deps` — prints one line and exits, on every platform.
[[test]]
name = "macos_app_delegate"
path = "tests/macos_app_delegate.rs"
harness = false

# **M2-2 adds no package either**, and it is worth saying because it looks like
# it should: the process door (`src/handoff.rs`'s macOS arm) is `NSWorkspace`,
# which is already on, and the trash (`src/macos_files.rs`) is `NSFileManager`,
# `NSURL` and `NSError` — three Foundation classes the `NSWorkspace` feature
# already turns on for its own methods. They are named below anyway, because a
# feature that arrives by union is a feature nobody declared.
#
# **M2-4 adds one package, and it is the only one either ticket adds**:
# `objc2-core-text` 0.3.2, for the font enumeration in `src/macos_fonts.rs`.
# CoreText is the opposite case to M2-1's CoreServices — it *has* a binding in
# this family, from the same repository and the same release as the three crates
# above, generated from the same headers — so the choice was between one line in
# `Cargo.lock` and `THIRD-PARTY-NOTICES.md` and four hand-declared entry points
# whose returns are all `Copy`/`Create`, i.e. four retains and releases written
# by hand. `docs/DESIGN.md` §8's bar is that a dependency is a line somebody
# reads; this is that line. With `default-features = false` and the three
# feature sets its code names, the only crates it pulls are `bitflags` and
# `objc2-core-foundation`, both already in the lock file.
#
# **M4-4 turns one crate on that costs nothing and adds two that are compiled,
# and the two are one decision rather than two.**
#
# The free one first: `objc2-core-graphics` 0.3.2 is **already in `Cargo.lock`**,
# pulled in by `objc2-io-surface` under wgpu's Metal backend, so naming it moves
# nothing in the lock file. What it buys is the bitmap context the first frame's
# pixels are drawn into (`src/macos_video.rs`) — a `CGImage` is an opaque handle
# and the only supported way to read one is to draw it, which is one call rather
# than four hand-declared entry points with a retain and a release each.
#
# The two this crate *names* are `objc2-av-foundation` 0.3.2, where
# `AVAssetImageGenerator` is, and `objc2-core-media` 0.3.2, because the two
# methods that matter are typed in `CMTime` — the time a frame is asked for, and
# the tolerances that say the generator may not answer with a neighbouring key
# frame instead. Both are the same family and the same release as the five
# crates above: generated from the same headers, in the same repository, against
# the same `objc2` 0.6.4.
#
# **`Cargo.lock` gains five lines and the build gains two**, and both numbers
# are true, so this file states both. The three extra lines are
# `objc2-core-audio` 0.3.2, `objc2-core-audio-types` 0.3.2 and
# `objc2-core-video` 0.3.2: CoreMedia declares all three as **optional**
# dependencies, and no feature named here turns any of them on, so they resolve
# into the lock file and into nothing else. `scripts/generate-notices.ps1` says
# it in its own words — the attributed list gains the two that are linked, and
# those three appear under *In the lock file, not in any resolved build*, the
# section that exists so the two counts a reader might compare are reconciled
# rather than left as a gap.
#
# So **two packages compiled, from one repository and one release**, which is
# `docs/DESIGN.md` §8's bar. The alternative was hand-declaring
# `copyCGImageAtTime:actualTime:error:`, `tracksWithMediaType:` and `CMTime`
# against classes this crate does not own — unchecked selectors and a
# hand-written struct layout in place of a generated binding.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The one completion handler this crate passes to AppKit:
# `-[NSSavePanel beginSheetModalForWindow:completionHandler:]`, which is how a
# panel is a sheet on a window rather than a nested modal loop inside a winit
# callback.
block2 = "0.6"
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = [
    # `UTType` itself, and `+[UTType typeWithFilenameExtension:]` — the only
    # two names this crate reads out of the framework.
    "UTType",
] }
objc2-core-text = { version = "0.3", default-features = false, features = [
    # `CTFontCollectionCreateFromAvailableFonts` and
    # `CTFontCollectionCreateMatchingFontDescriptors` — the database and its
    # contents.
    "CTFontCollection",
    # `CTFontDescriptorCopyAttribute`, `kCTFontFamilyNameAttribute` and
    # `kCTFontTraitsAttribute` — one face's family and its traits dictionary.
    "CTFontDescriptor",
    # `kCTFontSymbolicTrait` and `kCTFontTraitMonoSpace`, which is the whole of
    # the filter.
    "CTFontTraits",
    "std",
] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    # M4-4: `AVURLAsset` — the file, opened — and the `AVAsset` it is one of,
    # whose declared length is what [`video::SEEK_FRACTION`] is a fraction of.
    "AVAsset",
    # M4-4: the generator itself, its `maximumSize`, its two tolerances, its
    # `appliesPreferredTrackTransform` and the one call that decodes.
    "AVAssetImageGenerator",
    # M4-4: the video track, for the pair the fact line prints — a frame's
    # `naturalSize` turned by its `preferredTransform`, which is the video's own
    # size and not the raster's.
    "AVAssetTrack",
    # M4-4: `AVMediaTypeVideo`, which is how the track above is asked for.
    "AVMediaFormat",
    # M4-4: `CMTime`, which every time in this framework is written in. **A
    # feature, and a package** — see the note above the table.
    "objc2-core-media",
    # M4-4: `CGImage`, which is what a generated frame comes back as. **A
    # feature and not a package**: `objc2-core-graphics` 0.3.2 is already in
    # `Cargo.lock`.
    "objc2-core-graphics",
    # M4-4: `CGSize` and `CGAffineTransform` — the cap the generator is given and
    # the turn a track asks its pixels be displayed with. Not a package either:
    # both live in `objc2-core-foundation`, which is named below in its own
    # right.
    "objc2-core-foundation",
    "std",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    # M4-4: the whole of what this crate reads out of CoreMedia — a time made
    # from a fraction of a declared length, and the zero tolerance that says the
    # generator may not answer with a neighbouring key frame instead.
    "CMTime",
    "std",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    # M4-4: the frame the generator hands back, and the width and height it
    # really came out at — read off the image rather than assumed from the ask,
    # for the reason the Windows arm reads its media type back.
    "CGImage",
    # M4-4: the one call that turns an opaque `CGImage` into bytes.
    "CGContext",
    "CGBitmapContext",
    # M4-4: sRGB by name, which is the colour space every other picture in this
    # window reaches the renderer in.
    "CGColorSpace",
    "std",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    # The array of paths a stream is created over — one path, but the API takes
    # an array — and the strings in it. `CFArray` is also what CoreText hands
    # back its font descriptors in (M2-4).
    "CFArray",
    "CFString",
    # M2-4: a face's traits arrive as a `CFDictionary` keyed by CoreText's own
    # constant strings, and the symbolic-traits value inside it is a `CFNumber`
    # of bit flags.
    "CFDictionary",
    "CFNumber",
    # The watcher thread's own run loop: what the stream is scheduled on, the
    # source the owner signals to stop it, and the default mode both are
    # attached in.
    "CFRunLoop",
    # M4-4: `CGSize`, `CGRect` and `CGAffineTransform` — the geometry the image
    # generator, the bitmap context and a track's preferred turn are all written
    # in. Already on by union through `objc2-app-kit`'s `objc2-core-foundation`
    # feature; named here because this crate's own code writes all three, and a
    # feature that arrives by union is a feature nobody declared.
    "CFCGTypes",
    "std",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    # M2-3: the last-resort fault report, when there is a running application to
    # raise it on and no window to draw it in (`message_box`).
    "NSAlert",
    # M2-3: the formula menu — one item, popped over the window at the pointer,
    # and the `bool` it answers is `TrackPopupMenu`'s returned command.
    "NSMenu",
    "NSMenuItem",
    # M2-3: the folder and file choosers. `NSOpenPanel` names `NSSavePanel` and
    # `NSPanel` as its superclasses, so its binding asks for their features too;
    # `NSWindow` and `NSResponder`, the other two, are already on above.
    "NSOpenPanel",
    "NSPanel",
    "NSSavePanel",
    # M2-3: `-[NSSavePanel beginSheetModalForWindow:completionHandler:]` is the
    # one AppKit method in this crate that takes a block, and the feature is
    # what generates it. **Not a package** — `block2` 0.6.2 is already in
    # `Cargo.lock`.
    "block2",
    # M2-3: `-[NSSavePanel setAllowedContentTypes:]`, which is what restricts
    # the picture chooser to the formats the decoder honours. **This one is a
    # package** — see the note above the table.
    "objc2-uniform-type-identifiers",
    # The appearance a window and the application wear — light or dark, read
    # for the theme and stated for the chrome (`set_window_dark_mode`,
    # `system_uses_light_apps`).
    "NSAppearance",
    # `NSApp` itself: the application's effective appearance, and the window a
    # window number belongs to.
    "NSApplication",
    # M3-3: `-[NSWindow standardWindowButton:]` answers an `NSButton`, and an
    # `NSButton` is an `NSControl`. Two classes and no package — what the
    # traffic-light inset is measured off.
    "NSButton",
    "NSControl",
    # The window's backing colour, which is the class brush's twin.
    "NSColor",
    # `+[NSEvent mouseLocation]` — where the pointer is, for the summon.
    "NSEvent",
    "NSPasteboard",
    # `NSResponder`, because a window is one and `makeFirstResponder:` takes
    # one; `NSView`, because that is what a `NativeWindow` holds.
    "NSResponder",
    # The displays: their frames, their work areas, their backing scales and
    # their identities.
    "NSScreen",
    "NSView",
    # The window itself — the whole of the geometry group.
    "NSWindow",
    # M1-8, and no package either: ending a composition is two calls, one to
    # the input method (`NSTextInputContext`'s `discardMarkedText`) and one to
    # the view it is composing into (`NSTextInputClient`'s `unmarkText`), which
    # is winit's own view reached through `-[NSTextInputContext client]`.
    "NSTextInputClient",
    "NSTextInputContext",
    # Reduce Motion, and the notification that says it moved.
    "NSAccessibility",
    # M2-2: the four verbs that leave this window — `openURL:`,
    # `activateFileViewerSelectingURLs:` and
    # `URLForApplicationWithBundleIdentifier:`.
    "NSWorkspace",
    # M2-2, and only its test: `runningApplicationsWithBundleIdentifier:`, so
    # that the case which really opens a document can end the application it
    # started and nothing else. A LaunchServices query rather than
    # `-[NSWorkspace runningApplications]`, whose cache Apple documents as
    # updating on the **main** run loop — which a `#[test]` body is not on.
    # Apple's own note on `processIdentifier` says to compare instances with
    # `isEqual:` rather than with a pid, which is what that case does.
    "NSRunningApplication",
    # A screen's device description, which is where its `CGDirectDisplayID` is.
    "NSGraphics",
    # `CGFloat` — the type every backing scale and every rectangle in AppKit is
    # written in. **Not a package**: `objc2-core-foundation` 0.3.2 is already in
    # `Cargo.lock`, pulled in by `objc2-foundation`'s own `NSGeometry`, and this
    # feature only turns on the AppKit methods that are typed in terms of it.
    "objc2-core-foundation",
    # M1-4: `-[NSView layer]`, and through it `CALayer`'s `sublayers` and
    # `setSublayers:` — the two calls `clear_surface_layers` is. **Not a package
    # either**: `objc2-quartz-core` 0.3.2 is already in `Cargo.lock` (wgpu's own
    # Metal backend and `raw-window-metal` both carry it), and this feature
    # turns on the AppKit accessor plus the `CALayer` binding it answers with,
    # which is the same shape `objc2-core-foundation` above came through.
    "objc2-quartz-core",
    "std",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    # The array of screens and the array of preferred languages.
    "NSArray",
    # The change dictionary a KVO callback is handed, and a screen's device
    # description.
    "NSDictionary",
    # M1-4: `NSArray::iter`, which is how `folios_own_view` walks a content
    # view's subviews looking for Folio's own. Named here rather than left to
    # `objc2-app-kit`'s own use of it, because this crate's code is what calls
    # it and a feature that arrives by union is a feature nobody declared.
    "NSEnumerator",
    # M2-3: `-[NSObject performSelector:withObject:afterDelay:]` — the twin of
    # the Windows arm's `PostMessageW`, and the reason the formula menu's nested
    # tracking loop never starts inside a winit callback. It lives in
    # `NSRunLoop`'s category on `NSObject` and is typed in `NSTimeInterval`,
    # which is `NSDate`'s.
    "NSDate",
    "NSRunLoop",
    # The appearance is observed rather than polled.
    "NSKeyValueObserving",
    # M2-2: the trash (`NSFileManager.trashItemAtURL:resultingItemURL:error:`),
    # the object every path crosses as, and the reason a refusal carries.
    # Already on through `objc2-app-kit`'s `NSWorkspace`; named here because
    # this crate's own code writes all three. `NSBundle` is the test's alone —
    # the identifier of the application LaunchServices named, which is the only
    # thing that case will act on.
    "NSBundle",
    "NSError",
    "NSFileManager",
    "NSURL",
    # `NSLocale.preferredLanguages` — the language the system is read in.
    "NSLocale",
    # The notification an accessibility-display change arrives as.
    "NSNotification",
    "NSString",
    # M2-3: what a panel answers with. `-[NSSavePanel URL]` is an `NSURL`, and
    # the path a chooser hands back is `-[NSURL path]` — asked of a URL that has
    # already said it is a file URL, which is `FOS_FORCEFILESYSTEM`'s twin.
    "NSURL",
    # `NSNumber`, which is what `NSScreenNumber` comes back as.
    "NSValue",
    # M3-3: `AppleActionOnDoubleClick`, the one preference a title bar's own
    # double click obeys. Read through the standard defaults, which is where
    # AppKit registers its own answer for a reader who has never set one.
    "NSUserDefaults",
    "std",
] }

# **The one dev-dependency this crate has ever had, and it is a test venue
# rather than a dependency** (M3-1). `tests/macos_app_delegate.rs` proves that
# four selectors added to `WinitApplicationDelegate` are delivered and that
# every `ApplicationHandler` callback keeps arriving afterwards; there is no way
# to state either claim without winit, because the class is winit's own and the
# callbacks are winit's own. **It adds no package**: `=0.30.13` with the same
# feature set is what the workspace already pins for `bt-app`, so `Cargo.lock`
# and `THIRD-PARTY-NOTICES.md` gain nothing — and being a *dev*-dependency it is
# not in the shipped graph at all, so §4.6's promise to a Linux server is
# untouched.
[target.'cfg(target_os = "macos")'.dev-dependencies]
winit.workspace = true

[target.'cfg(windows)'.dependencies]
# One spelling of "a path as a `file:` URI", shared with every other place this
# workspace writes one (`bt_transcript::paths::local_path_to_file_uri`). It is
# here for `src/msix.rs`, where the package location crosses into the deployment
# API as a URI: a second, hand-rolled encoder is where a folder with a `#`, a
# `?` or a `%` in its name becomes a registration that names a different folder
# — R2-11, and the reason this edge exists at all. The crate is portable, has
# `bt-unicode` as its only dependency of its own, and both are already in this
# build.
bt-transcript = { path = "../bt-transcript" }
# The web preview's engine (`src/webview.rs`). It is a thin, generated binding
# over the WebView2 SDK's COM interfaces on top of the same `windows` 0.62 this
# crate already carries — three new packages (`webview2-com`,
# `webview2-com-macros`, `webview2-com-sys`) and no second copy of anything.
webview2-com = "0.39.1"
# `#[implement]` in `webview2-com`'s generated callbacks expands to code that
# names `::windows_core` directly, so the crate has to be in the dependency list
# even though every path this crate writes goes through `windows::core`.
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    # `Package.Id.FullName` and `Package.EffectiveExternalPath`: what a
    # registration of `packaging/msix/AppxManifest.xml` is called, and which
    # folder it points its content at. See `src/msix.rs`.
    "ApplicationModel",
    # The three WinRT namespaces one desktop notification needs: the XML document
    # a toast is (`Data_Xml_Dom`), the handler its click arrives on
    # (`Foundation`), and the notifier that shows it (`UI_Notifications`). All
    # three are reachable from an unpackaged process — see `Notifier`, whose whole
    # registration is one `REG_SZ`.
    "Data_Xml_Dom",
    "Foundation",
    # Iterating what `PackageManager` finds. A **feature**, not a package:
    # `windows-collections` and `windows-future` are already unconditional
    # dependencies of `windows`, so neither `Cargo.lock` nor
    # `THIRD-PARTY-NOTICES.md` gains a line — DESIGN §8's bar, and the same door
    # `Win32_Networking_WinHttp` came through.
    "Foundation_Collections",
    # `PackageManager` and `AddPackageOptions`: registering the sparse package
    # that puts Folio on Windows 11's first-page right-click menu, with the
    # external location that says where `folio.exe` actually is.
    "Management_Deployment",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Globalization",
    # `WinHttpOpen` and the eight calls beside it: the update check's one `GET`
    # (`src/http.rs`, DESIGN §7.51). A **feature**, not a package — `windows` is
    # already here, so turning the namespace on adds not one line to
    # `Cargo.lock` or to `THIRD-PARTY-NOTICES.md`, which is `docs/DESIGN.md`
    # §8's bar and the same door `Win32_Media_MediaFoundation` below came
    # through. What it buys is the operating system's own TLS, certificate
    # store and proxy configuration — including the PAC file a managed laptop
    # is handed — rather than a Rust HTTP client and the forty packages its own
    # trust store arrives with.
    "Win32_Networking_WinHttp",
    # `IMFSourceReader` and the platform under it: the first frame of a video,
    # for the hover card and the preview pane (`src/video.rs`, DESIGN §7.23).
    # This is a **feature**, not a package — `windows` is already in the lock
    # file, so turning the namespace on adds not one line to it, which is
    # `docs/DESIGN.md` §8's bar and the same door `hayro` and `serde_json` came
    # through. What it costs is a batch of generated bindings at compile time.
    "Win32_Media_MediaFoundation",
    # The four that let the composition device rasterize **one** thing: the
    # 1×1 premultiplied surface every web pane's ground is scaled out of
    # (`page_ground`). A composition device built on a null rendering device
    # cannot create surfaces at all, so the ground goes through
    # `CreateSurfaceFactory`, which takes a rendering device of its own — a
    # D3D11 one, because that is the only kind `IDXGIDevice` comes on and
    # `Direct2D` is a second stack for a call `ClearView` already makes.
    # `Direct2D_Common` is here for `D2D_MATRIX_3X2_F` alone, which is the type
    # `IDCompositionVisual::SetTransform` takes.
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # `CreateFileW` and `CreateEventW` both take a `SECURITY_ATTRIBUTES`, which
    # is what pulls this one in. The attention endpoint is the one caller that
    # actually passes one: `GetTokenInformation` / `TOKEN_GROUPS` (this
    # namespace) find the logon SID, and `Win32_Security_Authorization` below
    # turns it into the descriptor. See `src/attention_pipe.rs` for why a
    # default descriptor is not an option there.
    "Win32_Security",
    # `ConvertStringSecurityDescriptorToSecurityDescriptorW` and
    # `ConvertSidToStringSidW`: SDDL in, kernel descriptor out.
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # `CreateStreamOnHGlobal`: the buffer `ICoreWebView2::CapturePreview` writes
    # a page's picture into (W2 slice 6). A memory stream and not a file, because
    # a thumbnail routed through the disk would be measuring the disk.
    "Win32_System_Com_StructuredStorage",
    # `AttachConsole` / `WriteConsoleW`: the only way a Windows program with no
    # console of its own can answer `--help` on the console that started it.
    "Win32_System_Console",
    "Win32_System_DataExchange",
    # `GetThreadContext` and `ReadProcessMemory`: the two kernel calls the hang
    # reporter makes while the window thread is suspended (`src/hang.rs`). The
    # namespace is called `Diagnostics::Debug` because a debugger is the other
    # thing that makes them; nothing here attaches to anything.
    "Win32_System_Diagnostics_Debug",
    # `GetThreadContext` alone, which the `windows` crate files under `Kernel`
    # even though it sits beside `ReadProcessMemory` in `Diagnostics::Debug`.
    "Win32_System_Kernel",
    # `ReadDirectoryChangesW`'s three companions: the overlapped completion
    # (`Win32_System_IO`), and the events the watcher thread waits on and the
    # caller stops it with (`Win32_System_Threading`). See `DirWatch`.
    "Win32_System_IO",
    "Win32_System_Memory",
    # `CreateNamedPipeW` / `ConnectNamedPipe` / `DisconnectNamedPipe` /
    # `WaitNamedPipeW`: the attention endpoint and the `folio attention` verb's
    # two ends.
    "Win32_System_Pipes",
    # `EnumProcessModulesEx` / `GetModuleInformation` / `GetModuleBaseNameW`:
    # the module map that turns a raw return address into `folio.exe+0x…`. Built
    # before the suspend, because it takes the loader lock — see `src/hang.rs`.
    "Win32_System_ProcessStatus",
    # The Explorer verb: `RegCreateKeyExW`, `RegSetValueExW`, `RegQueryValueExW`
    # and `RegDeleteTreeW`, all against `HKEY_CURRENT_USER`. `RegCreateKeyExW`
    # also needs `Win32_Security` above, for the `SECURITY_ATTRIBUTES` it takes
    # and nothing here ever passes.
    "Win32_System_Registry",
    "Win32_System_Threading",
    # `OSVERSIONINFOW`, which is the only thing `RtlGetVersion` below writes
    # into.
    "Win32_System_SystemInformation",
    # The `PROPVARIANT` conversions `IMFSourceReader::GetPresentationAttribute`
    # and `SetCurrentPosition` are typed in terms of: a video's declared length
    # comes back as one and its seek target goes in as one. The generated
    # bindings for both methods are gated on this namespace *and* on
    # `Win32_System_Com_StructuredStorage` above, which was already here for the
    # memory stream a page's thumbnail is captured into.
    "Win32_System_Variant",
    # `RtlGetVersion` — the build number the compatibility shims do not touch.
    # `GetVersionExW` answers "Windows 8" for a process with no application
    # manifest, and `folio.exe` has none; this decides whether the machine has a
    # first-page context menu at all (`src/msix.rs`).
    "Wdk_System_SystemServices",
    "Win32_UI_HiDpi",
    # `ImmGetContext` / `ImmNotifyIME` / `ImmReleaseContext`: the one call that
    # ends a composition the field it was typed into no longer exists for
    # (`cancel_composition`, DESIGN §7.1.5a″). A **feature**, not a package —
    # `windows` is already in the lock file, so turning the namespace on adds
    # not one line to it or to `THIRD-PARTY-NOTICES.md`, which is
    # `docs/DESIGN.md` §8's bar.
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    # `COMDLG_FILTERSPEC` and therefore `IFileDialog::SetFileTypes`, which is
    # what filters the picture chooser to the formats the decoder honours.
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# **M3-7 adds one line and no package, and it is the first dependency this crate
# has that a Linux build also links.** `dup2` is the whole of the stdio door —
# moving `stdout` and `stderr` onto a log file, or onto `/dev/null`, for the rest
# of a run — and Rust's standard library has no spelling for it: `std::os::fd`
# owns descriptors and never renumbers one. `libc` 0.2.186 is **already in
# `Cargo.lock`** and already in `THIRD-PARTY-NOTICES.md` (winit, wgpu and
# `portable-pty` all carry it), so naming it here moves neither file's contents;
# what it costs is the declaration below.
#
# `cfg(unix)` and not `cfg(target_os = "macos")`, because the three calls this
# crate makes — `dup`, `dup2` and `close` — are POSIX and are the same two
# sentences on a Mac and on the Linux server §4.6 of the plan keeps possible. The
# arm that uses them is `portable_impl`'s own `#[cfg(unix)]` pair, beside the one
# `same_file` already has.
#
# `nix` was the other candidate and is already a `bt-pty` dev-dependency. It was
# not taken: its `dup2` is typed in `OwnedFd`/`BorrowedFd` and would have this
# crate constructing an `OwnedFd` for descriptor 1 — a value whose `Drop` closes
# the process's own standard output — to hand to a call that is defined as *not*
# taking ownership of it. The raw call says what is happening; the safe wrapper
# would need a `ManuallyDrop` around every argument to mean the same thing.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# This crate is the deliberately narrow unsafe boundary for native Win32 APIs. All other
# first-party crates continue inheriting the workspace-wide `unsafe_code = "deny"` policy.
[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
