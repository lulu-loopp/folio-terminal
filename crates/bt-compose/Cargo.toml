[package]
name = "bt-compose"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# **Terminal composition** (`src/lib.rs`): the order one pane's frame is made in
# — project, the presentation hold, schedule, the deadlines and their advance,
# the acknowledgment at the publish boundary — and the draw list a present is
# handed. A borrowing coordinator: the host owns every session and view and
# lends them per call. Its edges are by direct use, and it stays out of the
# platform layer, the PTY, persistence and the window (design T-COMPOSE-CRATE
# §3.1; `docs/ARCHITECTURE.md` §3.1).
[dependencies]
# `DualPlaneSession`: projection, scheduling, deadlines, the acknowledgment.
bt-term = { path = "../bt-term" }
# `ViewportProjection` (the view half of a pane) and `ViewportFrame`.
bt-viewport = { path = "../bt-viewport" }
# `SeatFrame`, `SeatViewport` and `CellMetrics`: the draw list's vocabulary.
bt-render = { path = "../bt-render" }
# `DetectionTask`/`LiveDetectionTask`, the math span and their resolution: what `typeset` reads.
bt-detect = { path = "../bt-detect" }
# The raster, its error and its key, the layout and the subpixel unit (`typeset`, `pump`).
bt-doc = { path = "../bt-doc" }
# `MathEngine`: composition owns math execution (design T-COMPOSE-CRATE §3.4 D-15).
bt-math = { path = "../bt-math" }
# The column a run starts at on its line (`typeset`'s inline composite).
unicode-width.workspace = true
# The `Instant` in its signatures: `std::time::Instant` on every native target,
# `performance.now()` in a browser (the clock guard, gate G3).
web-time.workspace = true

[dev-dependencies]
# A scratch name for the folder the pump tests print paths into (it is never created).
bt-testpath = { path = "../bt-testpath" }
# `TranscriptId`, the name a frozen formula's record is read back under.
bt-transcript = { path = "../bt-transcript" }

[lints]
workspace = true
