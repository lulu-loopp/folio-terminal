[package]
name = "bt-source"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# Every test target is named below (plan row 166): the guards that read the real tree are
# modules of one binary, `real_tree`, so that the index this crate keeps once per process is
# lowered once for all of them, and a module's file must not also become a binary of its own.
# A `tests/*.rs` file that is neither a target here nor a module of `real_tree` is compiled by
# nothing; `tests/real_workspace.rs`'s unreached check names it.
autotests = false

# **Nothing in `folio.exe` depends on this crate and nothing ever should.** It is
# the mechanism `docs/plans/bt-app-split-prep.md` is built on: the guards in this
# workspace that pin facts about the source read *files*, and a reader bound to a
# file does not go red when its subject moves to another file. This crate is what
# they ask instead, and it is reached only as a `[dev-dependencies]` entry — see
# §6.0 rule 1, which forbids a preparation ticket from touching product code at
# all.

[dependencies]
# The line and column a rejection names. `span-locations` is what makes
# `Span::start()` mean anything outside a procedural macro; without it every
# position in every message is line 1, which is the same as having no message.
# It is a feature of a package the lock file already carries, not a new package.
proc-macro2 = { version = "1", features = ["span-locations"] }
# `full` because a module declaration can be written anywhere an item can, and
# `visit` because the walk has to descend into the body of a function to find one
# — `fn main() { mod helper; }` is legal Rust and a walk that only looked at
# top-level items would miss the file it names without a word.
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
# Every test's scratch name comes from one place (`bt_testpath`, T-TEST-HYGIENE-048).
bt-testpath = { path = "../bt-testpath" }

[lints]
workspace = true

# The guards that read the real tree, one module each (`tests/real_tree.rs`).
[[test]]
name = "real_tree"
path = "tests/real_tree.rs"

# The index's cost, measured in a process that has lowered nothing: alone on purpose.
[[test]]
name = "measure"
path = "tests/measure.rs"

# Reads the real tree and lowers nothing: the enumeration and the unreached check.
[[test]]
name = "real_workspace"
path = "tests/real_workspace.rs"

# Declares the real tree's universes and lowers nothing.
[[test]]
name = "universes"
path = "tests/universes.rs"

# bt-app's broken doc links against docs/plans/DOC-LINK-DEBT.tsv (T-DOC-LINK-DEBT, plan row 78).
# `test = false`: it reads rustdoc's warnings, which only scripts/ci/measure-doc-links.ps1 writes
# (it runs `cargo doc` first, then this by name, `--test doc_link_debt`), so `cargo test -p
# bt-source` and `cargo clippy --all-targets` leave it out; the measuring script and the `docs`
# CI job lint it by name. Its fixture cases run with it.
[[test]]
name = "doc_link_debt"
path = "tests/doc_link_debt.rs"
test = false

# Fixtures only, from here down.
[[test]]
name = "dep_map"
path = "tests/dep_map.rs"

[[test]]
name = "function_paths"
path = "tests/function_paths.rs"

[[test]]
name = "ownership"
path = "tests/ownership.rs"

[[test]]
name = "rejections"
path = "tests/rejections.rs"

[[test]]
name = "views"
path = "tests/views.rs"
