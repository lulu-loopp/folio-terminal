[package]
name = "bt-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bt-transcript = { path = "../bt-transcript" }
bt-unicode = { path = "../bt-unicode" }
bt-doc = { path = "../bt-doc" }
bt-viewport = { path = "../bt-viewport" }
bytemuck.workspace = true
glyphon.workspace = true
thiserror.workspace = true
unicode-properties.workspace = true
# The `Fallback` trait cosmic-text takes speaks in `unicode_script::Script`, and
# cosmic-text does not re-export the crate. Pinned to the version cosmic-text
# itself depends on, so the trait and the argument are the same type.
unicode-script.workspace = true
wgpu.workspace = true

[dev-dependencies]
bt-detect = { path = "../bt-detect" }
bt-math = { path = "../bt-math" }
bt-term = { path = "../bt-term" }
pollster.workspace = true

[lints]
workspace = true

# **The backend a macOS adapter is enumerated through.** The workspace pin is
# `default-features = false, features = ["std", "dx12", "wgsl"]`, which on an
# Apple machine builds a wgpu that finds no adapter at all — every call in this
# crate compiles and the first one that asks for a device fails, which is the
# worst shape a portability gap can have. Cargo unions the feature sets of the
# two rows, so Windows is untouched: `metal` is compiled for Apple targets only,
# and this row does not exist off them.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }
