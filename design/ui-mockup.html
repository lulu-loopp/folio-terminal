<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetterTerminal UI 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ── Notion/Typora-like tokens, light & dark ── */
  :root {
    --page: #F1F0EE;
    --win: #FFFFFF;
    --panel: #F7F7F5;
    --border: rgba(0,0,0,.088);
    --border-soft: rgba(0,0,0,.055);
    --ink: #37352F;
    --ink2: rgba(55,53,47,.65);
    --ink3: rgba(55,53,47,.45);
    --hover: rgba(55,53,47,.055);
    --active: rgba(55,53,47,.09);
    --accent: #5E6AD2;
    --prompt: #5E6AD2;
    --termbg: #FFFFFF;
    --cursor: #37352F;
    --shadow: 0 16px 48px rgba(0,0,0,.13), 0 2px 8px rgba(0,0,0,.06);
    --menu: #FFFFFF;
    --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  }
  body.dark {
    --page: #141414;
    --win: #202020;
    --panel: #252525;
    --border: rgba(255,255,255,.094);
    --border-soft: rgba(255,255,255,.06);
    --ink: rgba(255,255,255,.87);
    --ink2: rgba(255,255,255,.55);
    --ink3: rgba(255,255,255,.38);
    --hover: rgba(255,255,255,.055);
    --active: rgba(255,255,255,.09);
    --accent: #828FFF;
    --prompt: #828FFF;
    --termbg: #1B1B1B;
    --cursor: #D4D4D4;
    --shadow: 0 16px 48px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35);
    --menu: #2A2A2A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", -apple-system, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background .18s ease;
  }

  /* ── Window ── */
  .window {
    width: min(1080px, 100%);
    height: min(660px, 88vh);
    background: var(--win);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    transition: background .18s ease;
  }

  /* ── Title bar ── */
  .titlebar { height: 40px; flex: none; display: flex; align-items: stretch; }
  .window[data-tabs="horizontal"] .titlebar { background: var(--panel); }
  .titlebar .drag {
    display: flex; align-items: center; gap: 8px;
    padding-left: 14px; min-width: 0; flex: 1;
  }
  .logo {
    width: 15px; height: 15px; border-radius: 4px; flex: none;
    border: 1.4px solid var(--ink3);
    position: relative;
  }
  .logo::after {
    content: "❯"; position: absolute; inset: 0;
    font-family: var(--mono); font-size: 7.5px; font-weight: 700; color: var(--ink2);
    display: flex; align-items: center; justify-content: center;
  }
  .apptitle { font-size: 12.5px; color: var(--ink3); white-space: nowrap; }
  .window[data-tabs="horizontal"] .apptitle { display: none; }

  /* Tabs in title bar (horizontal) — WT style: active tab connects with content */
  .tabs-inline {
    display: none; align-items: flex-end; gap: 1px;
    margin-left: 12px; min-width: 0; height: 100%;
  }
  .window[data-tabs="horizontal"] .tabs-inline { display: flex; }
  .tab {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 8px 0 13px;
    border-radius: 8px 8px 0 0;
    font-size: 13px; color: var(--ink2);
    cursor: pointer; white-space: nowrap;
  }
  .tab:hover:not(.active) { background: var(--hover); color: var(--ink); }
  .tab.shown:not(.active) { background: var(--hover); }
  .tab.active { background: var(--termbg); color: var(--ink); }
  .tab.active::before, .tab.active::after {
    content: ""; position: absolute; bottom: 0; width: 8px; height: 8px;
    pointer-events: none;
  }
  .tab.active::before { left: -8px;  background: radial-gradient(circle 8px at 0 0,   transparent 98%, var(--termbg) 100%); }
  .tab.active::after  { right: -8px; background: radial-gradient(circle 8px at 100% 0, transparent 98%, var(--termbg) 100%); }
  .ticon {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    color: var(--ink3); flex: none; width: 13px; text-align: center;
  }
  .tab.active .ticon, .vtab.active .ticon { color: var(--prompt); }
  .ticon-wrap { position: relative; display: inline-flex; flex: none; align-items: center; }
  /* working = spinner replaces the icon */
  .spinner {
    width: 11px; height: 11px; border-radius: 50%;
    border: 1.5px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
    margin: 0 1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* finished-but-unread = static dot */
  .unreaddot {
    position: absolute; top: -2px; right: -4px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
  }
  .tab .ttitle { max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  /* how many panes this tab holds — only shown once it holds more than one */
  .panecount {
    flex: none; min-width: 15px; height: 15px; padding: 0 4px;
    border-radius: 4px; background: var(--active);
    font-size: 10px; font-weight: 600; color: var(--ink2);
    display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  .tab.active .panecount, .vtab.active .panecount { background: var(--accent); color: #fff; }
  .tab .close, .vtab .close {
    width: 17px; height: 17px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink3);
  }
  .tab .close:hover, .vtab .close:hover { background: var(--active); color: var(--ink); }
  .close svg { width: 8px; height: 8px; pointer-events: none; }
  .newtab {
    width: 28px; height: 28px; border: none; background: none; border-radius: 6px;
    color: var(--ink3); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex: none; gap: 7px;
  }
  .newtab svg { width: 10px; height: 10px; flex: none; }
  .chevbtn svg { width: 9px; height: 6px; }
  .tabs-inline .newtab { margin: 0 0 3px 6px; }
  .tabs-inline .chevbtn { margin-left: 0; width: 24px; }
  .newtab:hover { background: var(--hover); color: var(--ink); }

  /* Caption buttons */
  .caption { display: flex; flex: none; }
  .capbtn {
    width: 46px; height: 40px; border: none; background: none;
    color: var(--ink2); cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .capbtn svg { width: 10px; height: 10px; }
  .capbtn.gear svg { width: 14px; height: 14px; }
  .capbtn:hover { background: var(--hover); color: var(--ink); }
  .capbtn.close-w:hover { background: #E5484D; color: #fff; }
  .capbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: 4px; }

  /* ── Body ── */
  .body { flex: 1; min-height: 0; display: flex; }

  /* Vertical rail */
  .rail {
    display: none;
    width: 220px; flex: none;
    flex-direction: column; gap: 1px;
    padding: 6px 8px 10px;
    background: var(--panel);
    border-right: 1px solid var(--border-soft);
    overflow: hidden;
    transition: width .18s ease, padding .18s ease, opacity .18s ease;
  }
  .window[data-tabs="vertical"] .rail { display: flex; }
  .window.rail-collapsed .rail { width: 0; padding-left: 0; padding-right: 0; border-right: none; opacity: 0; }

  .panel-toggle {
    display: none; width: 30px; height: 26px; border: none; background: none;
    border-radius: 6px; color: var(--ink3); cursor: pointer;
    align-items: center; justify-content: center; flex: none;
  }
  .window[data-tabs="vertical"] .panel-toggle { display: flex; }
  .panel-toggle:hover { background: var(--hover); color: var(--ink); }
  .panel-toggle svg { width: 14px; height: 14px; }

  .rail .label {
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    color: var(--ink3); padding: 4px 10px 6px;
  }
  .vtab {
    display: flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 5px 0 10px;
    border-radius: 6px; font-size: 13px; color: var(--ink2);
    cursor: pointer;
  }
  .vtab:hover { background: var(--hover); }
  .vtab.shown:not(.active) { background: var(--hover); }
  .vtab.active { background: var(--active); color: var(--ink); font-weight: 500; }
  .vtab .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vtab .close { visibility: hidden; }
  .vtab:hover .close { visibility: visible; }
  .rail-new { display: flex; gap: 2px; margin-top: 2px; }
  .rail-new .nt-main {
    flex: 1; width: auto; height: 30px; justify-content: flex-start; gap: 8px;
    padding: 0 10px; font-size: 13px; color: var(--ink3);
  }
  .rail-new .nt-chev { width: 28px; height: 30px; }
  .tabstrip-drop, .rail.tabstrip-drop { box-shadow: inset 0 0 0 1.5px var(--accent); border-radius: 8px; }
  .tabs-inline.tabstrip-drop { box-shadow: inset 0 0 0 1.5px var(--accent); }

  /* Profile picker menu */
  .profile-menu {
    position: absolute;
    min-width: 180px;
    background: var(--menu);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0,0,0,.18);
    padding: 4px;
    display: none; z-index: 30;
  }
  .profile-menu.show { display: block; }
  .profile-item {
    display: flex; align-items: center; gap: 10px;
    border-radius: 5px; padding: 7px 10px;
    font-size: 13px; color: var(--ink2); cursor: pointer; white-space: nowrap;
  }
  .profile-item:hover { background: var(--hover); color: var(--ink); }
  .profile-item .ticon { width: 14px; }
  .profile-item .default-hint { margin-left: auto; font-size: 11px; color: var(--ink3); }

  /* ── Terminal & panes ── */
  .termhost { flex: 1; min-width: 0; display: flex; position: relative; }
  .term {
    flex: 1; min-width: 0; min-height: 0;
    background: var(--termbg);
    font-family: var(--mono);
    font-size: 13px; line-height: 1.55; font-weight: 400;
    padding: 14px 18px;
    overflow-y: auto;
    cursor: text;
    transition: background .18s ease;
  }
  .dim { color: var(--ink3); }
  .prompt { color: var(--prompt); font-weight: 700; }
  .cursor {
    display: inline-block; width: 7px; height: 15px; background: var(--cursor);
    vertical-align: text-bottom; opacity: .85;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .split { flex: 1; min-width: 0; min-height: 0; display: flex; }
  .split-row { flex-direction: row; }
  .split-col { flex-direction: column; }
  .split-row > * + * { border-left: 1px solid var(--border); }
  .split-col > * + * { border-top: 1px solid var(--border); }
  .pane { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  /* Every pane header is identical; only the focus accent differs. */
  .panehead {
    flex: none; position: relative;
    display: flex; align-items: center; gap: 7px;
    height: 26px; padding: 0 6px 0 11px;
    font-size: 11.5px; color: var(--ink3);
    border-bottom: 1px solid var(--border-soft);
    cursor: grab; user-select: none;
  }
  .panehead::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1.5px;
    background: var(--accent); opacity: 0;
  }
  .pane.focused .panehead { color: var(--ink); }
  .pane.focused .panehead::before { opacity: 1; }
  .pane.focused .panehead .ticon { color: var(--accent); }
  .panehead .ticon { width: auto; }
  .panehead .ptitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panehead .pane-close {
    margin-left: auto; width: 17px; height: 17px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink3); cursor: pointer; visibility: hidden; flex: none;
  }
  .pane:hover .pane-close { visibility: visible; }
  .panehead .pane-close:hover { background: var(--active); color: var(--ink); }
  .panehead .pane-close svg { width: 8px; height: 8px; pointer-events: none; }

  #dock-preview {
    position: absolute; z-index: 25; pointer-events: none;
    background: color-mix(in srgb, var(--accent) 13%, transparent);
    border: 1.5px solid var(--accent); border-radius: 8px;
    opacity: 0; transition: opacity .1s ease, left .12s ease, top .12s ease, width .12s ease, height .12s ease;
  }
  #dock-preview.show { opacity: 1; }
  .drag-ghost {
    position: fixed; z-index: 100; pointer-events: none;
    display: flex; align-items: center; gap: 7px;
    background: var(--menu); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 12px; font-size: 12.5px; color: var(--ink);
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    font-family: inherit;
  }
  .drag-ghost .ticon { width: auto; }
  body.dragging { user-select: none; cursor: grabbing; }

  @media (prefers-reduced-motion: reduce) {
    .spinner, .cursor { animation: none; }
    .rail { transition: none; }
  }

  /* ── Settings ── */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(15,15,15,.35);
    display: none; z-index: 40;
  }
  .overlay.show { display: block; }
  .settings {
    width: min(480px, 92%);
    margin: 54px auto 0;
    background: var(--win);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }
  .settings header { display: flex; align-items: center; padding: 16px 10px 10px 22px; }
  .settings header h1 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
  .settings .content { padding: 2px 22px 18px; }
  .group-label {
    font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--ink3); margin: 10px 0 2px;
  }
  .row {
    display: flex; align-items: center; gap: 16px;
    padding: 11px 2px;
    border-bottom: 1px solid var(--border-soft);
  }
  .row:last-child { border-bottom: none; }
  .row .text { flex: 1; min-width: 0; }
  .row .title { font-size: 13.5px; color: var(--ink); }
  .row .desc { font-size: 12px; color: var(--ink3); margin-top: 1px; }

  .combo { position: relative; flex: none; }
  .combo > button {
    min-width: 118px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--ink);
    font-family: inherit; font-size: 13px;
    padding: 5px 10px 5px 12px;
    cursor: pointer;
  }
  .combo > button:hover { background: var(--hover); }
  .combo .chev { font-size: 8.5px; color: var(--ink3); }
  .combo-menu {
    position: absolute; right: 0; top: calc(100% + 4px);
    min-width: 100%;
    background: var(--menu);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0,0,0,.18);
    padding: 4px;
    display: none; z-index: 50;
  }
  .combo.open .combo-menu { display: block; }
  .combo-item {
    display: flex; align-items: center; gap: 8px;
    border-radius: 5px;
    padding: 6px 10px;
    font-size: 13px; color: var(--ink2);
    cursor: pointer; white-space: nowrap;
  }
  .combo-item:hover { background: var(--hover); color: var(--ink); }
  .combo-item .tick { width: 14px; font-size: 11px; color: var(--accent); visibility: hidden; }
  .combo-item.selected .tick { visibility: visible; }
  .combo-item.selected { color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-min" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></symbol>

  <symbol id="i-plus" viewBox="0 0 10 10"><path d="M5 0.5v9M0.5 5h9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></symbol>

  <symbol id="i-panel" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M6.2 2.5v11" stroke="currentColor" stroke-width="1.1"/></symbol>

<div class="window" id="win" data-tabs="horizontal">
  <div class="titlebar">
    <div class="drag">
      <div class="logo"></div>
      <button class="panel-toggle" id="btn-rail" title="Toggle sidebar" aria-label="Toggle sidebar"><svg><use href="#i-panel"/></svg></button>
      <span class="apptitle">BetterTerminal</span>
      <div class="tabs-inline" id="tabstrip"></div>
    </div>
    <button class="capbtn gear" id="btn-settings" title="Settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    <div class="caption">
      <button class="capbtn" title="Minimize" aria-label="Minimize"><svg><use href="#i-min"/></svg></button>
      <button class="capbtn" title="Maximize" aria-label="Maximize"><svg><use href="#i-max"/></svg></button>
      <button class="capbtn close-w" title="Close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </div>
  </div>

  <div class="body">
    <nav class="rail" id="rail"></nav>
    <div class="termhost" id="termhost"></div>
  </div>

  <div class="profile-menu" id="profile-menu"></div>

  <div class="overlay" id="settings-overlay">
    <div class="settings" role="dialog" aria-label="Settings">
      <header>
        <h1>Settings</h1>
        <button class="capbtn" id="btn-close-settings" title="Close" aria-label="Close settings"><svg><use href="#i-close"/></svg></button>
      </header>
      <div class="content">
        <div class="group-label">Appearance</div>
        <div class="row">
          <div class="text">
            <div class="title">Theme</div>
            <div class="desc">Light, dark, or follow your system setting</div>
          </div>
          <div class="combo" data-combo="theme">
            <button aria-haspopup="listbox"><span class="value">System</span><span class="chev">▼</span></button>
            <div class="combo-menu" role="listbox">
              <div class="combo-item" data-v="light" role="option"><span class="tick">✓</span>Light</div>
              <div class="combo-item" data-v="dark" role="option"><span class="tick">✓</span>Dark</div>
              <div class="combo-item selected" data-v="system" role="option"><span class="tick">✓</span>System</div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="text">
            <div class="title">Tab layout</div>
            <div class="desc">Choose where tabs appear in the window</div>
          </div>
          <div class="combo" data-combo="layout">
            <button aria-haspopup="listbox"><span class="value">Horizontal</span><span class="chev">▼</span></button>
            <div class="combo-menu" role="listbox">
              <div class="combo-item selected" data-v="horizontal" role="option"><span class="tick">✓</span>Horizontal</div>
              <div class="combo-item" data-v="vertical" role="option"><span class="tick">✓</span>Vertical</div>
            </div>
          </div>
        </div>

        <div class="group-label" style="margin-top:16px">Tabs &amp; panes</div>
        <div class="row">
          <div class="text">
            <div class="title">Clicking a tab</div>
            <div class="desc" id="tabmode-desc">Switches the whole view; each tab keeps its own split layout</div>
          </div>
          <div class="combo" data-combo="tabmode">
            <button aria-haspopup="listbox"><span class="value">Switch view</span><span class="chev">▼</span></button>
            <div class="combo-menu" role="listbox">
              <div class="combo-item selected" data-v="switch" role="option"><span class="tick">✓</span>Switch view</div>
              <div class="combo-item" data-v="swap" role="option"><span class="tick">✓</span>Swap focused pane</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  /* ══════════════════════════════════════════════════════════
     Every tab owns a split tree; most tabs own a single pane.
     The strip shows one entry per tab; the active tab's layout
     fills the content area. A tab's title follows the FOCUSED
     pane inside it, plus a badge once it holds more than one.

     Dragging is the same in both modes:
       - tab onto a pane edge → its layout merges in there and its
         strip entry disappears, so the strip holds
         (tabs not merged) + 1 for the layout you're in
       - pane header onto the strip → that pane leaves the layout
         and becomes its own tab again

     Clicking a tab is what the "Tab behavior" setting switches:
       - "switch"  → the whole content area swaps to that tab; each
                     tab keeps its own layout, waiting for you
       - "swap"    → only the FOCUSED pane is taken over by that
                     tab; the session it displaces returns to the
                     strip as a tab. Other panes are untouched, so
                     the split survives. With a single pane this is
                     just ordinary tab switching.
     ══════════════════════════════════════════════════════════ */

  const $ = (id) => document.getElementById(id);
  const closeSvg = `<svg><use href="#i-close"/></svg>`;
  const media = window.matchMedia("(prefers-color-scheme: dark)");
  /* A pane must stay usable; splits that would go below this are not offered.
     This — not an arbitrary pane count — is what limits how far you can split. */
  const MIN_PANE_W = 260, MIN_PANE_H = 120;

  let uidSeq = 1, leafSeq = 1, wsSeq = 1;

  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* ── sessions ── */
  function powershell() {
    return { prompt: `<span class="prompt">❯ </span>`, lines: [
      `<span class="dim">BetterTerminal v0.1.0 — PowerShell 7.5</span>`,
      `<span class="prompt">❯ </span>cargo --version`,
      `cargo 1.88.0 (873a06493 2026-04-28)`,
    ]};
  }
  function claude() {
    return { prompt: `<span class="prompt">❯ </span>`, lines: [
      `<span class="prompt">❯ </span>claude "整理 docs 目录"`,
      `<span class="dim">Welcome to Claude Code.</span>`,
      `<span class="dim">✳ Reading files…</span>`,
    ]};
  }
  function wsl() {
    return { prompt: `<span class="prompt">$ </span>`, lines: [
      `<span class="dim">Ubuntu 24.04 LTS (WSL2)</span>`,
      `<span class="prompt">$ </span>uname -r`,
      `6.6.87-microsoft-standard-WSL2`,
    ]};
  }
  function gitbash() {
    return { prompt: `<span class="prompt">$ </span>`, lines: [`<span class="dim">MINGW64 — Git Bash</span>`]};
  }
  function cmdsh() {
    return { prompt: `<span class="prompt">&gt; </span>`, lines: [`<span class="dim">Microsoft Windows [Version 10.0.26200]</span>`]};
  }
  const PROFILES = [
    { title: "PowerShell", icon: "❯", make: powershell, default: true },
    { title: "WSL · Ubuntu", icon: "$", make: wsl },
    { title: "Git Bash", icon: "%", make: gitbash },
    { title: "Command Prompt", icon: ">", make: cmdsh },
  ];

  function mkSession(title, icon, c, busy) {
    const s = { uid: uidSeq++, title, icon, prompt: c.prompt, lines: c.lines, input: "", busy: !!busy, unread: false };
    state.sessions.push(s);
    return s;
  }
  const mkLeaf = (uid) => ({ type: "leaf", id: leafSeq++, uid });
  function mkWs(session) {
    const leaf = mkLeaf(session.uid);
    return { id: wsSeq++, tree: leaf, focus: leaf.id };
  }

  const state = {
    sessions: [],
    tabs: [],            // workspaces
    active: null,        // workspace id
    layoutMode: "horizontal",
    tabMode: "switch",     // switch | swap  (see the header comment)
    theme: "system",
    railCollapsed: false,
  };
  state.tabs = [
    mkWs(mkSession("PowerShell", "❯", powershell())),
    mkWs(mkSession("claude", "✳", claude(), true)),
    mkWs(mkSession("wsl", "$", wsl())),
  ];
  state.active = state.tabs[0].id;

  /* ── lookups ── */
  const session = (uid) => state.sessions.find(s => s.uid === uid);
  const tabById = (id) => state.tabs.find(w => w.id === id);
  const activeTab = () => tabById(state.active);
  function leavesOf(node, out = []) {
    if (node.type === "leaf") out.push(node);
    else { leavesOf(node.a, out); leavesOf(node.b, out); }
    return out;
  }
  const paneCount = (w) => leavesOf(w.tree).length;
  const findLeafIn = (w, id) => leavesOf(w.tree).find(l => l.id === id);
  const focusedLeaf = (w) => findLeafIn(w, w.focus) || leavesOf(w.tree)[0];
  const focusedSession = () => session(focusedLeaf(activeTab()).uid);
  const tabOfLeaf = (id) => state.tabs.find(w => findLeafIn(w, id));
  const isVisible = (uid) => leavesOf(activeTab().tree).some(l => l.uid === uid);

  /* ── tree ops ── */
  function splitLeafIn(w, leafId, zone, subtree) {
    const walk = (node) => {
      if (node.type === "leaf") {
        if (node.id !== leafId) return node;
        const dir = (zone === "left" || zone === "right") ? "row" : "col";
        const first = (zone === "left" || zone === "top");
        return { type: "split", dir, a: first ? subtree : node, b: first ? node : subtree };
      }
      return { ...node, a: walk(node.a), b: walk(node.b) };
    };
    w.tree = walk(w.tree);
  }
  /* detach a leaf, promoting its sibling; returns the leaf (null if it was the last one) */
  function detachLeaf(w, leafId) {
    if (paneCount(w) <= 1) return null;
    const leaf = findLeafIn(w, leafId);
    const walk = (node) => {
      if (node.type === "leaf") return node;
      if (node.a.type === "leaf" && node.a.id === leafId) return node.b;
      if (node.b.type === "leaf" && node.b.id === leafId) return node.a;
      return { ...node, a: walk(node.a), b: walk(node.b) };
    };
    w.tree = walk(w.tree);
    if (!findLeafIn(w, w.focus)) w.focus = leavesOf(w.tree)[0].id;
    return leaf;
  }

  /* tab dropped on a pane edge → its whole layout merges in, its strip entry disappears */
  function mergeTabIntoPane(srcWsId, targetLeafId, zone) {
    const src = tabById(srcWsId), tgt = activeTab();
    if (!src || src.id === tgt.id) return;
    const keepFocus = focusedLeaf(src).id;
    splitLeafIn(tgt, targetLeafId, zone, src.tree);
    tgt.focus = keepFocus;
    state.tabs = state.tabs.filter(w => w.id !== srcWsId);
    leavesOf(tgt.tree).forEach(l => { const s = session(l.uid); if (s) s.unread = false; });
    render();
  }
  /* pane dropped on the strip → leaves the layout, becomes its own tab again */
  function extractPaneToTab(leafId) {
    const w = activeTab();
    const leaf = detachLeaf(w, leafId);
    if (!leaf) return;
    const nw = { id: wsSeq++, tree: leaf, focus: leaf.id };
    const at = state.tabs.indexOf(w) + 1;
    state.tabs.splice(at, 0, nw);
    render();      /* stay in the layout you were in; the pane is now waiting in the strip */
  }
  /* pane dropped on another pane's edge → rearrange inside the layout */
  function movePane(leafId, targetLeafId, zone) {
    const w = activeTab();
    if (leafId === targetLeafId) return;
    const leaf = detachLeaf(w, leafId);
    if (!leaf || !findLeafIn(w, targetLeafId)) { render(); return; }
    splitLeafIn(w, targetLeafId, zone, leaf);
    w.focus = leaf.id;
    render();
  }
  function closePane(leafId) {
    const w = activeTab();
    const leaf = detachLeaf(w, leafId);
    if (!leaf) { closeTab(w.id); return; }        /* last pane → close the tab */
    state.sessions = state.sessions.filter(s => s.uid !== leaf.uid);
    render();
  }
  function closeTab(wsId) {
    if (state.tabs.length === 1) return;
    const w = tabById(wsId);
    const uids = leavesOf(w.tree).map(l => l.uid);
    state.sessions = state.sessions.filter(s => !uids.includes(s.uid));
    const idx = state.tabs.indexOf(w);
    state.tabs = state.tabs.filter(x => x.id !== wsId);
    if (state.active === wsId) state.active = state.tabs[Math.min(idx, state.tabs.length - 1)].id;
    render();
  }
  function selectTab(wsId) {
    if (state.tabMode === "swap" && wsId !== state.active) { swapTabIntoFocusedPane(wsId); return; }
    state.active = wsId;
    leavesOf(tabById(wsId).tree).forEach(l => { const s = session(l.uid); if (s) s.unread = false; });
    render();
  }

  /* "swap" mode: the clicked tab takes over the focused pane; the session it
     displaces goes back to the strip, taking the clicked tab's place. Other
     panes never move — the split survives. */
  function swapTabIntoFocusedPane(wsId) {
    const src = tabById(wsId), tgt = activeTab();
    if (!src || src.id === tgt.id) return;
    const outLeaf = focusedLeaf(tgt);
    const displaced = session(outLeaf.uid);
    const incoming = src.tree, incomingFocus = focusedLeaf(src).id;

    const walk = (node) => {
      if (node.type === "leaf") return node.id === outLeaf.id ? incoming : node;
      return { ...node, a: walk(node.a), b: walk(node.b) };
    };
    tgt.tree = walk(tgt.tree);
    tgt.focus = incomingFocus;

    /* the displaced session becomes a tab again, in the slot the clicked tab left */
    state.tabs[state.tabs.indexOf(src)] = mkWs(displaced);
    leavesOf(tgt.tree).forEach(l => { const s = session(l.uid); if (s) s.unread = false; });
    render();
  }
  function newTab(profile) {
    const s = mkSession(profile.title.split(" ·")[0], profile.icon, profile.make());
    const w = mkWs(s);
    state.tabs.push(w);
    state.active = w.id;
    render();
  }

  /* ── theme ── */
  function applyTheme() {
    const resolved = state.theme === "system" ? (media.matches ? "dark" : "light") : state.theme;
    document.body.classList.toggle("dark", resolved === "dark");
  }
  media.addEventListener("change", () => { if (state.theme === "system") applyTheme(); });

  /* ── render ── */
  function stateIcon(s, busy, unread) {
    return busy
      ? `<span class="ticon-wrap"><span class="spinner"></span></span>`
      : `<span class="ticon-wrap"><span class="ticon">${s.icon}</span>${unread ? `<span class="unreaddot"></span>` : ""}</span>`;
  }
  /* a tab aggregates the state of every session in its layout */
  const tabBusy = (w) => leavesOf(w.tree).some(l => (session(l.uid) || {}).busy);
  const tabUnread = (w) => leavesOf(w.tree).some(l => (session(l.uid) || {}).unread);
  function tabIcon(w) {
    return stateIcon(session(focusedLeaf(w).uid), tabBusy(w), tabUnread(w));
  }
  const paneBadge = (w) => paneCount(w) > 1 ? `<span class="panecount" title="${paneCount(w)} panes">${paneCount(w)}</span>` : "";

  function termHtml(s, focused) {
    return s.lines.map(l => `<div>${l}</div>`).join("") +
      `<div>${s.prompt}<span>${esc(s.input)}</span>${focused ? `<span class="cursor"></span>` : ""}</div>`;
  }
  function renderNode(node, w) {
    if (node.type === "leaf") {
      const s = session(node.uid);
      const focused = node.id === w.focus;
      const multi = paneCount(w) > 1;
      return `<div class="pane ${focused ? "focused" : ""}" data-leaf="${node.id}">
        ${multi ? `<div class="panehead" data-leaf="${node.id}">${stateIcon(s, s.busy, s.unread)}<span class="ptitle">${s.title}</span>
          <span class="pane-close" title="Close pane">${closeSvg}</span></div>` : ""}
        <div class="term" data-leaf="${node.id}">${termHtml(s, focused)}</div>
      </div>`;
    }
    return `<div class="split split-${node.dir}">${renderNode(node.a, w)}${renderNode(node.b, w)}</div>`;
  }

  function render() {
    $("win").dataset.tabs = state.layoutMode;
    $("win").classList.toggle("rail-collapsed", state.railCollapsed);
    const aw = activeTab();

    $("tabstrip").innerHTML = state.tabs.map(w => `
      <div class="tab ${w.id === state.active ? "active" : ""}" data-ws="${w.id}">
        ${tabIcon(w)}<span class="ttitle">${session(focusedLeaf(w).uid).title}</span>${paneBadge(w)}
        <span class="close" data-close="${w.id}">${closeSvg}</span>
      </div>`).join("") + `<button class="newtab nt-main" title="New tab (PowerShell)"><svg><use href="#i-plus"/></svg></button><button class="newtab chevbtn nt-chev" title="Choose a profile"><svg><use href="#i-chev"/></svg></button>`;

    $("rail").innerHTML = `<div class="label">Tabs</div>` + state.tabs.map(w => `
      <div class="vtab ${w.id === state.active ? "active" : ""}" data-ws="${w.id}">
        ${tabIcon(w)}<span class="title">${session(focusedLeaf(w).uid).title}</span>${paneBadge(w)}
        <span class="close" data-close="${w.id}">${closeSvg}</span>
      </div>`).join("") + `<div class="rail-new"><button class="newtab nt-main" title="New tab (PowerShell)"><svg><use href="#i-plus"/></svg>New tab</button><button class="newtab chevbtn nt-chev" title="Choose a profile"><svg><use href="#i-chev"/></svg></button></div>`;

    $("termhost").innerHTML = renderNode(aw.tree, aw) + `<div id="dock-preview"></div>`;
    document.querySelectorAll("#termhost .term").forEach(el => { el.scrollTop = el.scrollHeight; });

    document.querySelectorAll(".tab, .vtab").forEach(el => {
      el.addEventListener("click", (e) => {
        const c = e.target.closest(".close");
        if (c) { closeTab(+c.dataset.close); e.stopPropagation(); return; }
        selectTab(+el.dataset.ws);
      });
      el.addEventListener("pointerdown", (e) => startDrag(e, { kind: "tab", wsId: +el.dataset.ws }));
    });
    document.querySelectorAll(".nt-main").forEach(el =>
      el.addEventListener("click", () => newTab(PROFILES.find(p => p.default))));
    document.querySelectorAll(".nt-chev").forEach(el =>
      el.addEventListener("click", (e) => { e.stopPropagation(); openProfileMenu(el); }));
    document.querySelectorAll(".pane").forEach(el =>
      el.addEventListener("click", (e) => {
        if (e.target.closest(".pane-close")) { closePane(+el.dataset.leaf); return; }
        const id = +el.dataset.leaf;
        if (aw.focus !== id) { aw.focus = id; render(); }
      }));
    document.querySelectorAll(".panehead").forEach(el =>
      el.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".pane-close")) return;
        startDrag(e, { kind: "pane", leafId: +el.dataset.leaf });
      }));
  }

  /* ── input & fake execution ── */
  function runCommand() {
    const t = focusedSession();
    const cmd = t.input;
    t.input = "";
    t.lines.push(t.prompt + esc(cmd));
    const head = cmd.trim().split(/\s+/)[0];
    if (!head) { render(); return; }
    if (head === "clear" || head === "cls") { t.lines = []; render(); return; }
    t.busy = true;
    render();
    setTimeout(() => {
      t.busy = false;
      t.lines.push(...fakeOutput(cmd));
      if (!isVisible(t.uid)) t.unread = true;     /* finished off-screen → unread */
      render();
    }, 1600);
  }
  function fakeOutput(cmd) {
    const parts = cmd.trim().split(/\s+/), head = parts[0], rest = parts.slice(1);
    switch (head) {
      case "help":   return [`<span class="dim">This is a UI mockup — try: echo · ls · git · cargo · claude · clear</span>`];
      case "echo":   return [esc(rest.join(" ")) || " "];
      case "ls": case "dir": return [`design  docs  <span class="dim">.gitignore</span>`];
      case "git":    return [`On branch <span class="prompt">main</span> — nothing to commit, working tree clean`];
      case "cargo":  return [`cargo 1.88.0 (873a06493 2026-04-28)`];
      case "claude": return [`<span class="dim">Welcome to Claude Code.</span>`];
      default:       return [`<span class="dim">'${esc(head)}' is not recognized — this terminal is a mockup. Try 'help'.</span>`];
    }
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      $("settings-overlay").classList.remove("show");
      $("profile-menu").classList.remove("show");
      document.querySelectorAll(".combo").forEach(c => c.classList.remove("open"));
      return;
    }
    if ($("settings-overlay").classList.contains("show")) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = focusedSession();
    if (e.key === "Enter") { e.preventDefault(); runCommand(); }
    else if (e.key === "Backspace") { e.preventDefault(); t.input = t.input.slice(0, -1); render(); }
    else if (e.key.length === 1) { e.preventDefault(); t.input += e.key; render(); }
  });

  /* ── drag & dock (tabs and panes share one engine) ── */
  let drag = null;
  function startDrag(e, src) {
    if (e.button !== 0 || e.target.closest(".close")) return;
    drag = { ...src, x0: e.clientX, y0: e.clientY, started: false, ghost: null, target: null };
  }
  const stripEl = () => state.layoutMode === "horizontal" ? $("tabstrip") : $("rail");
  function dragLabel(d) {
    const s = d.kind === "tab"
      ? session(focusedLeaf(tabById(d.wsId)).uid)
      : session(findLeafIn(activeTab(), d.leafId).uid);
    return `<span class="ticon">${s.icon}</span>${s.title}`;
  }

  document.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (!drag.started) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
      drag.started = true;
      document.body.classList.add("dragging");
      const g = document.createElement("div");
      g.className = "drag-ghost";
      g.innerHTML = dragLabel(drag);
      document.body.appendChild(g);
      drag.ghost = g;
    }
    drag.ghost.style.left = (e.clientX + 10) + "px";
    drag.ghost.style.top = (e.clientY + 8) + "px";

    const pv = $("dock-preview");
    drag.target = null;
    stripEl().classList.remove("tabstrip-drop");

    /* over the strip? a pane dropped here becomes its own tab again */
    const sr = stripEl().getBoundingClientRect();
    if (e.clientX >= sr.left && e.clientX <= sr.right && e.clientY >= sr.top && e.clientY <= sr.bottom) {
      if (drag.kind === "pane" && paneCount(activeTab()) > 1) {
        drag.target = { strip: true };
        stripEl().classList.add("tabstrip-drop");
      }
      pv.classList.remove("show");
      return;
    }

    /* over a pane? zones are relative to THAT pane */
    const host = $("termhost").getBoundingClientRect();
    let hit = null;
    for (const el of document.querySelectorAll("#termhost .pane")) {
      const r = el.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) { hit = { el, r }; break; }
    }
    if (!hit) { pv.classList.remove("show"); return; }
    /* dragging the active tab onto its own layout is meaningless */
    if (drag.kind === "tab" && drag.wsId === state.active) { pv.classList.remove("show"); return; }

    const leafId = +hit.el.dataset.leaf;
    const rx = (e.clientX - hit.r.left) / hit.r.width;
    const ry = (e.clientY - hit.r.top) / hit.r.height;
    let zone = rx < 0.25 ? "left" : rx > 0.75 ? "right" : ry < 0.3 ? "top" : ry > 0.7 ? "bottom" : "center";
    /* refuse splits that would leave either half unusable */
    if ((zone === "left" || zone === "right") && hit.r.width / 2 < MIN_PANE_W) zone = "center";
    if ((zone === "top" || zone === "bottom") && hit.r.height / 2 < MIN_PANE_H) zone = "center";
    if (zone === "center" || (drag.kind === "pane" && drag.leafId === leafId)) { pv.classList.remove("show"); return; }
    drag.target = { leafId, zone };

    let x = hit.r.left - host.left, y = hit.r.top - host.top, w = hit.r.width, h = hit.r.height;
    if (zone === "left") w /= 2;
    if (zone === "right") { x += w / 2; w /= 2; }
    if (zone === "top") h /= 2;
    if (zone === "bottom") { y += h / 2; h /= 2; }
    pv.style.left = x + "px"; pv.style.top = y + "px";
    pv.style.width = w + "px"; pv.style.height = h + "px";
    pv.classList.add("show");
  });

  document.addEventListener("pointerup", () => {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (d.ghost) d.ghost.remove();
    document.body.classList.remove("dragging");
    const pv = $("dock-preview");
    if (pv) pv.classList.remove("show");
    stripEl().classList.remove("tabstrip-drop");
    if (!d.started || !d.target) return;
    if (d.target.strip) { extractPaneToTab(d.leafId); return; }
    if (d.kind === "tab") mergeTabIntoPane(d.wsId, d.target.leafId, d.target.zone);
    else movePane(d.leafId, d.target.leafId, d.target.zone);
  });

  /* ── profile menu ── */
  function openProfileMenu(anchor) {
    const menu = $("profile-menu");
    menu.innerHTML = PROFILES.map((p, i) => `
      <div class="profile-item" data-p="${i}">
        <span class="ticon">${p.icon}</span>${p.title}
        ${p.default ? `<span class="default-hint">default</span>` : ""}
      </div>`).join("");
    menu.querySelectorAll(".profile-item").forEach(el =>
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        menu.classList.remove("show");
        newTab(PROFILES[+el.dataset.p]);
      }));
    const win = $("win").getBoundingClientRect();
    const a = anchor.getBoundingClientRect();
    menu.classList.add("show");
    const mw = menu.offsetWidth;
    menu.style.top = (a.bottom - win.top + 4) + "px";
    menu.style.left = Math.min(a.left - win.left, win.width - mw - 8) + "px";
  }
  document.addEventListener("click", () => $("profile-menu").classList.remove("show"));

  /* ── settings ── */
  $("btn-settings").addEventListener("click", () => $("settings-overlay").classList.add("show"));
  $("btn-close-settings").addEventListener("click", () => $("settings-overlay").classList.remove("show"));
  $("settings-overlay").addEventListener("click", (e) => {
    if (e.target === $("settings-overlay")) $("settings-overlay").classList.remove("show");
  });
  document.querySelectorAll(".combo").forEach(combo => {
    const btn = combo.querySelector("button");
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      document.querySelectorAll(".combo").forEach(c => { if (c !== combo) c.classList.remove("open"); });
      combo.classList.toggle("open");
    });
    combo.querySelectorAll(".combo-item").forEach(item =>
      item.addEventListener("click", (e) => {
        e.stopPropagation();
        combo.querySelectorAll(".combo-item").forEach(x => x.classList.remove("selected"));
        item.classList.add("selected");
        combo.querySelector(".value").textContent = item.dataset.v[0].toUpperCase() + item.dataset.v.slice(1);
        combo.classList.remove("open");
        const kind = combo.dataset.combo;
        if (kind === "layout") { state.layoutMode = item.dataset.v; render(); }
        if (kind === "theme") { state.theme = item.dataset.v; applyTheme(); }
        if (kind === "tabmode") {
          state.tabMode = item.dataset.v;
          combo.querySelector(".value").textContent = item.dataset.v === "swap" ? "Swap focused pane" : "Switch view";
          $("tabmode-desc").textContent = item.dataset.v === "swap"
            ? "Takes over the pane you're in; the pane it replaces goes back to the strip"
            : "Switches the whole view; each tab keeps its own split layout";
          render();
        }
      }));
  });
  document.addEventListener("click", () => document.querySelectorAll(".combo").forEach(c => c.classList.remove("open")));

  $("btn-rail").addEventListener("click", () => {
    state.railCollapsed = !state.railCollapsed;
    render();
  });

  /* demo: claude is working; it finishes in 6s → unread dot if you're elsewhere */
  setTimeout(() => {
    const c = state.sessions.find(x => x.title === "claude");
    if (c && c.busy) {
      c.busy = false;
      c.lines.push(`<span class="dim">✓ Done — 3 files changed.</span>`);
      if (!isVisible(c.uid)) c.unread = true;
      render();
    }
  }, 6000);

  applyTheme();
  render();
</script>

</body>
</html>
