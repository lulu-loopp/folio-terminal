<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files pane — Miller columns concept</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page:#F1F0EE; --win:#FFFFFF; --panel:#F7F7F5;
    --border:rgba(0,0,0,.088); --border-soft:rgba(0,0,0,.055);
    --ink:#37352F; --ink2:rgba(55,53,47,.65); --ink3:rgba(55,53,47,.45);
    --hover:rgba(55,53,47,.055); --active:rgba(55,53,47,.09);
    --accent:#5E6AD2; --sel:#5E6AD2;
    --kw:#8250DF; --fn:#0550AE; --str:#0A7B34; --num:#B5651D;
  }
  body.dark {
    --page:#141414; --win:#202020; --panel:#252525;
    --border:rgba(255,255,255,.094); --border-soft:rgba(255,255,255,.06);
    --ink:rgba(255,255,255,.87); --ink2:rgba(255,255,255,.55); --ink3:rgba(255,255,255,.38);
    --hover:rgba(255,255,255,.055); --active:rgba(255,255,255,.09);
    --accent:#828FFF; --sel:#828FFF;
    --kw:#C678DD; --fn:#61AFEF; --str:#98C379; --num:#D19A66;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--page); color:var(--ink);
    font:14px/1.5 "Inter","Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:26px; min-height:100vh;
  }
  .bar { display:flex; gap:14px; align-items:center; font-size:12.5px; color:var(--ink2); }
  .bar b { color:var(--ink); font-weight:600; }
  .bar button {
    font:inherit; font-size:12px; padding:4px 11px; border-radius:6px;
    border:1px solid var(--border); background:var(--win); color:var(--ink); cursor:pointer;
  }
  .bar button:hover { background:var(--hover); }
  .bar .pill { padding:3px 9px; border-radius:20px; background:var(--active); font-variant-numeric:tabular-nums; }

  /* The pane — resizable, so you can drag the corner and watch it collapse. */
  .pane {
    width:820px; height:460px; min-width:220px; max-width:96vw;
    resize:horizontal; overflow:hidden;
    background:var(--win); border:1px solid var(--border); border-radius:11px;
    box-shadow:0 16px 48px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.05);
    display:flex; flex-direction:column;
  }
  body.dark .pane { box-shadow:0 16px 48px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35); }
  .head {
    flex:none; height:30px; display:flex; align-items:center; gap:5px;
    padding:0 12px; font-size:11px; color:var(--ink3);
  }
  .head .crumb { color:var(--ink3); }
  .head .crumb b { color:var(--ink2); font-weight:600; }
  .head .sep { opacity:.5; }
  .head .cols { margin-left:auto; font-variant-numeric:tabular-nums; }

  .cols-wrap { flex:1; min-height:0; display:flex; }
  .col {
    min-width:0; display:flex; flex-direction:column;
    border-left:1px solid var(--border-soft); overflow-y:auto;
  }
  .col:first-child { border-left:0; }
  .col.parent  { flex:1 1 0; }
  .col.current { flex:2.6 1 0; }
  .col.preview { flex:2.2 1 0; background:var(--panel); }

  .row {
    display:flex; align-items:center; gap:7px; height:25px; padding:0 10px;
    color:var(--ink2); white-space:nowrap; cursor:pointer; user-select:none;
  }
  .row:hover { background:var(--hover); }
  .row .ic { width:15px; height:15px; flex:none; }
  .row .ic.folder { color:var(--accent); }
  .row .ic.file { color:var(--ink3); }
  .row .nm { overflow:hidden; text-overflow:ellipsis; }
  .row .chev { margin-left:auto; color:var(--ink3); font-size:10px; opacity:.6; }
  /* selection in the current column: solid accent, the item you're on */
  .col.current .row.sel { background:var(--sel); color:#fff; }
  .col.current .row.sel .ic { color:#fff; }
  .col.current .row.sel .chev { color:rgba(255,255,255,.7); }
  /* the parent's highlighted child (the folder you came from): a soft mark */
  .col.parent .row.here { background:var(--active); color:var(--ink); }

  /* preview surfaces */
  .pv { padding:12px 14px; font-size:12.5px; color:var(--ink2); overflow:auto; height:100%; }
  .pv-title { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink3); margin-bottom:8px; }
  .pv code, .pv pre { font-family:"JetBrains Mono",monospace; font-size:12px; }
  .pv pre { margin:0; white-space:pre; color:var(--ink); line-height:1.65; }
  .pv .kw{color:var(--kw)} .pv .fn{color:var(--fn)} .pv .str{color:var(--str)} .pv .num{color:var(--num)} .pv .cm{color:var(--ink3)}
  .pv-img {
    display:flex; align-items:center; justify-content:center; height:120px;
    border-radius:8px; color:#fff; font-weight:600; font-size:13px;
    background:linear-gradient(135deg,#5E6AD2,#8b5cf6);
  }
  .pv table { border-collapse:collapse; font-family:"JetBrains Mono",monospace; font-size:11.5px; width:100%; }
  .pv th,.pv td { border:1px solid var(--border); padding:3px 8px; text-align:left; color:var(--ink); }
  .pv th { background:var(--hover); color:var(--ink2); font-weight:600; }
  .pv .meta { display:flex; flex-direction:column; gap:5px; }
  .pv .meta .kv { display:flex; justify-content:space-between; gap:12px; }
  .pv .meta .kv span:first-child { color:var(--ink3); }
  .pv .md h1{font-size:16px;color:var(--ink);margin:.2em 0 .4em} .pv .md h2{font-size:13px;color:var(--ink);margin:.6em 0 .3em}
  .pv .md p{margin:.3em 0} .pv .md code{background:var(--hover);padding:1px 5px;border-radius:4px;color:var(--ink)}
  .pv .empty { color:var(--ink3); font-style:italic; }
</style>
</head>
<body>
  <div class="bar">
    <span><b>Files pane</b> — Miller columns + preview concept</span>
    <button id="w">Wide</button><button id="m">Medium</button><button id="n">Narrow</button>
    <span class="pill" id="wpill">— px</span>
    <button id="theme">◑ theme</button>
    <span style="color:var(--ink3)">拖右下角改宽 · ←↑↓→ / hjkl 导航</span>
  </div>

  <div class="pane" id="pane" tabindex="0">
    <div class="head">
      <span class="crumb" id="crumb"></span>
      <span class="cols" id="colcount"></span>
    </div>
    <div class="cols-wrap" id="wrap"></div>
  </div>

<script>
  /* ── a believable repo ── */
  const F = (name, children, meta) => ({ name, dir:true, children, meta });
  const f = (name, kind, meta) => ({ name, dir:false, kind, meta });

  const ROOT = F("BetterTerminal", [
    F("crates", [
      F("bt-term", [ f("lib.rs","code"), f("grid.rs","code"), f("cell.rs","code") ]),
      F("bt-detect", [ f("lib.rs","code"), f("latex.rs","code") ]),
      F("bt-viewport", [ f("lib.rs","code") ]),
    ]),
    F("design", [ f("ui-mockup.html","code"), f("logo.png","image"), f("palette.png","image") ]),
    F("docs", [
      F("spikes", [ f("03-math-engine.md","md"), f("04-ime-cjk.md","md"), f("comparison.png","image") ]),
      f("DESIGN.md","md"), f("PROBLEM-LIST.md","md"), f("UI-UX.md","md"),
    ]),
    F("corpus", [ f("cjk-width.json","code"), f("math.csv","csv"), f("emoji.csv","csv") ]),
    f("Cargo.toml","code"), f("README.md","md"), f(".gitignore","code"),
  ]);

  /* current path = array of nodes from ROOT down to the focused folder;
     `sel` = index of the selected child inside the deepest folder. */
  let path = [ROOT];
  let sel = 0;

  const icFolder = `<svg class="ic folder" viewBox="0 0 16 16"><path d="M1.6 4.2c0-.6.5-1.1 1.1-1.1h3.1l1.3 1.5h6.2c.6 0 1.1.5 1.1 1.1v6.6c0 .6-.5 1.1-1.1 1.1H2.7c-.6 0-1.1-.5-1.1-1.1z" fill="currentColor"/></svg>`;
  const icFile = `<svg class="ic file" viewBox="0 0 16 16"><path d="M3.5 1.8h5.2l3.8 3.8v8.6c0 .3-.2.5-.5.5H3.5c-.3 0-.5-.2-.5-.5V2.3c0-.3.2-.5.5-.5z" fill="none" stroke="currentColor" stroke-width="1.15"/><path d="M8.6 1.9v3.8h3.8" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round"/></svg>`;

  const cur = () => path[path.length - 1];
  const curChildren = () => cur().children;
  const selNode = () => curChildren()[sel];

  function rowHtml(n, cls) {
    return `<div class="row ${cls||''}" data-name="${n.name}">
      ${n.dir ? icFolder : icFile}<span class="nm">${n.name}</span>${n.dir ? `<span class="chev">▸</span>` : ""}</div>`;
  }

  /* preview column content for the selected node */
  function previewHtml(n) {
    if (!n) return `<div class="pv"><div class="empty">Nothing selected</div></div>`;
    if (n.dir) {
      const kids = n.children.map(c => rowHtml(c)).join("");
      return `<div class="pv" style="padding:2px 0"><div class="pv-title" style="padding:8px 14px 4px">${n.name}/ — ${n.children.length} items</div>${kids}</div>`;
    }
    if (n.kind === "image") return `<div class="pv"><div class="pv-title">${n.name}</div><div class="pv-img">🖼  ${n.name}</div><div class="meta" style="margin-top:12px"><div class="kv"><span>Type</span><span>PNG image</span></div><div class="kv"><span>Size</span><span>48.2 KB</span></div><div class="kv"><span>Dimensions</span><span>1600 × 900</span></div></div></div>`;
    if (n.kind === "csv") return `<div class="pv"><div class="pv-title">${n.name}</div><table><tr><th>id</th><th>text</th><th>cells</th></tr><tr><td>0</td><td>你好</td><td>4</td></tr><tr><td>1</td><td>👨‍👩‍👧‍👦</td><td>8</td></tr><tr><td>2</td><td>café</td><td>4</td></tr><tr><td>3</td><td>☆</td><td>2</td></tr></table></div>`;
    if (n.kind === "md") return `<div class="pv"><div class="pv-title">${n.name}</div><div class="md"><h1>${n.name.replace('.md','')}</h1><p>This document is the <b>why</b>, not the code. Decisions live here.</p><h2>Section</h2><p>Rendered <code>markdown</code> preview — headings, lists, inline code.</p></div></div>`;
    /* code */
    return `<div class="pv"><div class="pv-title">${n.name}</div><pre><span class="kw">pub fn</span> <span class="fn">render</span>(grid: &Grid) -> <span class="kw">Vec</span>&lt;Cell&gt; {
    <span class="kw">let mut</span> out = Vec::new();
    <span class="kw">for</span> row <span class="kw">in</span> grid.rows() {
        out.push(row.<span class="fn">shape</span>(<span class="num">0</span>)); <span class="cm">// cosmic-text</span>
    }
    out
}</pre></div>`;
  }

  function colsForWidth(px) { return px >= 640 ? 3 : px >= 380 ? 2 : 1; }

  function render() {
    const pane = document.getElementById("pane");
    const px = Math.round(pane.getBoundingClientRect().width);
    const ncols = colsForWidth(px);
    document.getElementById("wpill").textContent = px + " px";
    document.getElementById("colcount").textContent =
      ncols === 3 ? "parent · current · preview" : ncols === 2 ? "current · preview" : "current";

    const crumb = path.map((n,i) => i===0 ? `<b>${n.name}</b>` : n.name).join(` <span class="sep">/</span> `);
    document.getElementById("crumb").innerHTML = crumb;

    const parent = path.length > 1 ? path[path.length - 2] : null;
    const parentSelName = cur().name;

    let html = "";
    /* parent column — only when 3 columns and a parent exists */
    if (ncols >= 3 && parent) {
      html += `<div class="col parent">${parent.children.map(c =>
        rowHtml(c, c.name === parentSelName ? "here" : "")).join("")}</div>`;
    }
    /* current column — always */
    html += `<div class="col current">${curChildren().map((c,i) =>
      rowHtml(c, i === sel ? "sel" : "")).join("")}</div>`;
    /* preview column — when 2+ columns */
    if (ncols >= 2) {
      html += `<div class="col preview">${previewHtml(selNode())}</div>`;
    }
    document.getElementById("wrap").innerHTML = html;

    /* wire clicks */
    document.querySelectorAll(".col.current .row").forEach((el, i) => {
      el.addEventListener("click", () => { sel = i; render(); });
      el.addEventListener("dblclick", () => { if (curChildren()[i].dir) enter(); });
    });
    document.querySelectorAll(".col.parent .row").forEach((el) => {
      el.addEventListener("click", () => { up(); });
    });
    document.querySelectorAll(".col.preview .row").forEach((el) => {
      el.addEventListener("click", () => { if (selNode().dir) { enter(); } });
    });
  }

  function enter() { const n = selNode(); if (n && n.dir) { path.push(n); sel = 0; render(); } }
  function up() { if (path.length > 1) { const child = path.pop(); sel = Math.max(0, cur().children.indexOf(child)); render(); } }

  document.getElementById("pane").addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowDown" || k === "j") { sel = Math.min(curChildren().length - 1, sel + 1); e.preventDefault(); render(); }
    else if (k === "ArrowUp" || k === "k") { sel = Math.max(0, sel - 1); e.preventDefault(); render(); }
    else if (k === "ArrowRight" || k === "l" || k === "Enter") { e.preventDefault(); enter(); }
    else if (k === "ArrowLeft" || k === "h") { e.preventDefault(); up(); }
  });

  document.getElementById("w").onclick = () => { document.getElementById("pane").style.width = "820px"; render(); };
  document.getElementById("m").onclick = () => { document.getElementById("pane").style.width = "520px"; render(); };
  document.getElementById("n").onclick = () => { document.getElementById("pane").style.width = "320px"; render(); };
  document.getElementById("theme").onclick = () => { document.body.classList.toggle("dark"); };

  new ResizeObserver(() => render()).observe(document.getElementById("pane"));
  document.getElementById("pane").focus();
  render();
</script>
</body>
</html>
